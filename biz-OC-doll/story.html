<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>biz-OC-doll · 스토리</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══ 공용 컴포넌트 스타일 (구 common.css — 이 파일 안으로 합침) ═══
   상단바 문의 버튼 · 언어 안내 각주 · 제작자 소개/문의 오버레이
   ※ index.html 에도 같은 블록이 있습니다. 한쪽 고치면 반대쪽도. */
#tb-contact-btn{display:flex;align-items:center;justify-content:center;width:30px;height:28px;padding:0;border:1px solid #e2e2e2;border-radius:6px;background:transparent;color:#5f5f5f;cursor:pointer;transition:all .12s;flex-shrink:0}
#tb-contact-btn:hover{background:#fafafa;color:#1a1a1a;border-color:#c6c6c6}

/* 번역 안내 각주 — 언어를 궁금해하는 바로 그 순간에만 보이게 */
.tb-lang-note{padding:10px 14px 11px;border-top:1px solid #ececec;background:#fafafa;font-size:10.5px;line-height:1.7;color:#8a8a8a;letter-spacing:-.01em}
.tb-lang-note b{color:#5f5f5f;font-weight:600}

/* ── 제작자 소개 · 비즈니스 문의 오버레이 (허브와 동일 컴포넌트) ── */
#contact-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
#contact-overlay.hidden{display:none}
.contact-card{position:relative;background:#fff;border:1px solid #e2e2e2;border-radius:14px;padding:28px 30px;max-width:440px;width:100%;box-shadow:0 12px 40px #00000026;font-family:var(--fn)}
.contact-close{position:absolute;top:14px;right:14px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #e2e2e2;border-radius:6px;color:#5f5f5f;cursor:pointer;transition:all .12s}
.contact-close:hover{background:#fafafa;border-color:#c6c6c6}
.contact-who{display:flex;align-items:center;gap:14px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid #ececec}
.contact-who-thumb{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid #e2e2e2;background:#fafafa}
.contact-who-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.contact-who-name{font-size:15px;font-weight:700;color:#111;letter-spacing:-.02em;margin-bottom:3px}
.contact-who-tag{font-size:12px;color:#5f5f5f;line-height:1.6}
.contact-eyebrow{font-size:10px;font-weight:600;letter-spacing:2px;color:#a0a0a0;text-transform:uppercase;margin-bottom:8px}
.contact-title{font-size:20px;font-weight:700;color:#111;letter-spacing:-.04em}
.contact-desc{font-size:13px;color:#5f5f5f;margin-top:8px;line-height:1.8}
.contact-mailrow{margin-top:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.contact-mailrow span.mail{font-size:13px;font-weight:600;color:#1a1a1a;font-family:'Inter',sans-serif}
.biq-copy-btn{background:transparent;border:1px solid #e2e2e2;border-radius:6px;padding:4px 7px;display:flex;align-items:center;gap:4px;font-family:var(--fn);font-size:11px;font-weight:500;color:#a0a0a0;cursor:pointer;transition:all .15s;flex-shrink:0}
.biq-copy-btn:hover{background:#fafafa;color:#1a1a1a;border-color:#c6c6c6}
</style>
<script src="../config.js"></script>
<script>
/* iframe 안인지 먼저 판별 — 단독 상단바가 깜빡이지 않게 페인트 전에 */
try{ if(window.parent !== window) document.documentElement.className = 'embed'; }
catch(e){ document.documentElement.className = 'embed'; }
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--sb:#fff;--sm:#fafafa;--bd:#e2e2e2;--bd2:#c6c6c6;
  --tx:#1a1a1a;--tx2:#5f5f5f;--tx3:#a0a0a0;
  --blue:#5a90b0;--blue-d:#4a7a98;
  --fn:'Inter','Noto Sans KR',-apple-system,sans-serif;
  --h-top:46px;
}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);-webkit-font-smoothing:antialiased}
button{font-family:var(--fn);cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

/* ── 단독 열람용 상단바 — iframe 안에서는 부모 상단바를 쓰므로 숨김 ── */
#solo-topbar{
  height:var(--h-top);background:var(--sb);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;padding:0 16px;
  position:sticky;top:0;z-index:120;transition:margin-top .26s ease;
}
#solo-topbar.hidden{margin-top:calc(var(--h-top) * -1)}
html.embed #solo-topbar{display:none}
.tb-back{background:transparent;border:none;color:var(--tx3);font-size:12px;padding:5px 8px;border-radius:6px;transition:all .12s;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tb-back:hover{background:var(--sm);color:var(--tx)}
.tb-sep{width:1px;height:14px;background:var(--bd);flex-shrink:0}
.tb-title{font-family:'Josefin Sans',sans-serif;font-weight:300;letter-spacing:.16em;font-size:14px;color:#4a5560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
#tl-badge{font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;border:1px solid;transition:opacity .2s,background .2s;opacity:0;pointer-events:none}
#tl-badge.deepl{background:#e8f0fe;color:#1a4c9e;border-color:#b5d4f4}
#tl-badge.google{background:#e8f7f2;color:#0a6e56;border-color:#9fe1cb}
#tl-badge.show{opacity:1}
#tb-lang-drop-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2);border:1px solid var(--bd);background:transparent;border-radius:6px;padding:5px 9px;transition:all .12s}
#tb-lang-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;width:280px;background:var(--sb);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 28px #00000018;z-index:9999;overflow:hidden}
#doll-tl-bar{display:none;gap:8px;justify-content:center;margin-bottom:14px}
#doll-tl-bar button{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--tx2);border:1px solid var(--bd);background:var(--sb);border-radius:100px;padding:6px 13px;transition:all .12s}
#doll-tl-bar button:hover{border-color:var(--bd2);color:var(--tx)}
#doll-tl-bar button.done{color:#1a4c9e;border-color:#b5d4f4;background:#e8f0fe}
#doll-dl-rebtn{display:none}
.goog-te-banner-frame,.skiptranslate{display:none !important}
body{top:0 !important}

/* ══════ 스토리 — 목록 ══════ */
#story-list{max-width:720px;margin:0 auto;padding-bottom:40px}
.story-banner{position:relative;width:100%;aspect-ratio:32/9;max-height:260px;background:linear-gradient(135deg,#1a2e3a,var(--blue));overflow:hidden}
.story-banner{display:none} /* 임시 숨김 — 이 줄만 지우면 배너 복원됨 */
.story-banner img{width:100%;height:100%;object-fit:cover;display:block}
.story-banner-txt{position:absolute;bottom:0;left:0;right:0;padding:20px 24px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.story-banner-eyebrow{font-size:9px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.7);text-transform:uppercase;margin-bottom:6px}
.story-banner-title{font-family:'Josefin Sans',sans-serif;font-weight:100;letter-spacing:.22em;font-size:clamp(20px,3.5vw,30px);color:#fff}
.story-tab-row{display:flex;gap:0;padding:0 24px;border-bottom:1px solid var(--bd);max-width:720px;margin:0 auto;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.story-tab-row::-webkit-scrollbar{display:none}
.story-tab-btn{flex-shrink:0;padding:10px 20px;background:transparent;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:600;color:var(--tx3);transition:all .15s;white-space:nowrap;margin-bottom:-1px}
.story-tab-btn:hover{color:var(--tx)}
.story-tab-btn.active{color:var(--tx);border-bottom-color:var(--tx)}
/* ── 편 스위치 (시안 M · 반반 채움 · 폭 전체) ──
   남자편 연하늘 / 여자편 연보라. 사이트 블루(#5a90b0)와 채도를 맞춰
   스위치만 튀어 보이지 않게 잡았다. */
.story-ed-row{display:flex;gap:6px;max-width:720px;margin:0 auto}
.story-ed-btn{flex:1;padding:10px 0;background:transparent;border:1px solid var(--bd);border-radius:999px;font-size:13px;font-weight:600;color:#b4b4b4;transition:all .14s;white-space:nowrap;cursor:pointer}
.story-ed-btn:hover{color:var(--tx2);border-color:var(--bd2)}
.story-ed-btn.active{font-weight:700}
.story-ed-btn.m.active{background:#E4F0F8;border-color:#9CC4DC;color:#3D6C88}
.story-ed-btn.f.active{background:#EDE7F6;border-color:#B4A3D4;color:#6B559B}
.story-ed-wrap{padding:14px 24px 2px}
.ep-both-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid #7f9fb8;color:#4a6b85;background:#7f9fb818}
.doll-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2b2b;color:#fff;font-size:12.5px;font-weight:500;padding:10px 18px;border-radius:20px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.doll-toast.show{opacity:.94}
.story-ep-card{background:var(--sb);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .12s,box-shadow .12s}
.story-ep-card:hover{border-color:var(--bd2);box-shadow:0 2px 10px #0001}
.story-ep-card.locked{opacity:.5;cursor:default;pointer-events:none}
.ep-status-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.ep-status-badge.done{background:#ffe4e4;color:#c0392b}
.ep-status-badge.wip{background:#F9F4CA;color:#F9CB4C}
.ep-status-badge.plan{background:#f0f0f0;color:#aaa}

/* ══════ 스토리 — 리더 ══════ */
#story-reader{display:none}
#story-reader.show{display:block}


/* ── 스토리 탭 상단 안내 — 원작 라인임을 한 줄로 알린다 ── */
.story-note{
  max-width:720px;margin:0 auto;padding:14px 24px 0;
  font-size:12.5px;line-height:1.75;color:var(--tx3);letter-spacing:-.01em;
}
.story-note b{color:var(--tx2);font-weight:600}
@media(max-width:520px){ .story-note{padding:12px 16px 0;font-size:11.5px} }

/* ── EP.00 원작 설정 카드 (스토리 목록 최상단 고정) ── */
.world-card{
  position:relative;margin:14px 24px 4px;border-radius:14px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(90,144,176,.22);
  display:flex;align-items:center;gap:14px;padding:20px 22px;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.world-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(90,144,176,.16);border-color:rgba(90,144,176,.45)}
.world-card-bg{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 320px 200px at 12% 8%, rgba(185,210,230,.55) 0%, transparent 100%),
    radial-gradient(ellipse 320px 200px at 88% 92%, rgba(210,195,230,.45) 0%, transparent 100%),
    linear-gradient(140deg,#fbfcfd 0%,#f4f1f8 55%,#f7fbfc 100%);
}
.world-card-inner{position:relative;z-index:1;flex:1;min-width:0}
.world-card-eyebrow{font-family:'Josefin Sans',sans-serif;font-size:10px;font-weight:300;letter-spacing:2.4px;color:var(--blue);margin-bottom:7px}
.world-card-title{font-size:17px;font-weight:700;color:var(--tx);letter-spacing:-.02em;margin-bottom:5px}
.world-card-badge{display:inline-block;margin-left:7px;vertical-align:middle;font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:10px;background:rgba(90,144,176,.12);border:1px solid rgba(90,144,176,.28);color:var(--blue)}
.world-card-sub{font-size:12px;font-style:italic;font-weight:300;color:var(--tx2);line-height:1.6}
.world-card-go{position:relative;z-index:1;flex-shrink:0;font-size:12px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:5px}
.world-card-go span{font-size:15px;transition:transform .16s ease;display:inline-block}
.world-card:hover .world-card-go span{transform:translateX(3px)}
@media(max-width:520px){
  .world-card{margin:12px 16px 4px;padding:17px 18px;gap:10px}
  .world-card-title{font-size:15px}
  .world-card-sub{font-size:11px}
}

/* ── 세계관 리더 — 인트로와 의도적으로 다른 톤. 여백 넓고 문장 짧게 ── */
.world-read{
  padding:88px 24px 100px;
  background:
    radial-gradient(ellipse 500px 300px at 15% 8%, rgba(185,210,230,.18) 0%, transparent 100%),
    radial-gradient(ellipse 500px 300px at 85% 92%, rgba(210,195,230,.16) 0%, transparent 100%),
    linear-gradient(180deg,#fbfcfd 0%,#f6f3f8 50%,#fbfcfd 100%);
  min-height:100%;
}
.world-read-inner{max-width:560px;margin:0 auto}
.world-read-eyebrow{font-size:11px;font-weight:600;letter-spacing:3px;color:var(--blue);text-transform:uppercase;text-align:center;margin-bottom:20px}
.world-read-title{font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:clamp(22px,4vw,30px);letter-spacing:.18em;text-align:center;color:#4a5560;margin-bottom:10px}
.diamond-i{position:relative;display:inline-block}
.diamond-i::after{content:'';position:absolute;top:-.18em;left:50%;transform:translateX(-50%) rotate(45deg);width:.18em;height:.18em;background:currentColor}
.diamond-o{position:relative;display:inline-block}
.diamond-o::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-55%) rotate(45deg);width:.18em;height:.18em;background:currentColor}
.world-read-tagline{text-align:center;font-size:15px;color:var(--tx2);font-style:italic;line-height:1.8;margin-bottom:72px}
.world-read-block{margin-bottom:56px;padding-bottom:56px;border-bottom:1px solid rgba(90,144,176,.14)}
.world-read-block:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0}
.world-read-block-title{font-size:12px;font-weight:700;letter-spacing:2.5px;color:var(--blue);text-transform:uppercase;text-align:center;margin-bottom:18px}
.world-read-block-body{font-size:16px;color:var(--tx2);line-height:2;text-align:center;font-weight:300}
.world-img-slot{margin:28px auto 0;max-width:460px;border-radius:14px;overflow:hidden}
.world-img-slot img{width:100%;display:block}
.world-img-slot.empty{min-height:180px;border:1px dashed rgba(90,144,176,.35);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4)}
.world-img-slot.empty::after{content:'이미지 자리';font-size:12px;letter-spacing:.5px;color:var(--tx3)}
.world-read-cta{text-align:center;margin-top:72px;padding-top:52px;border-top:1px solid rgba(90,144,176,.14)}
.world-read-cta-text{font-size:17px;font-weight:600;color:var(--tx);letter-spacing:-.02em;margin-bottom:20px}
.world-read-cta-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;border-radius:100px;border:1px solid var(--blue);
  background:var(--blue);color:#fff;font-size:13px;font-weight:700;
  transition:background .15s,gap .18s ease;
}
.world-read-cta-btn:hover{background:var(--blue-d);gap:12px}
@media(max-width:580px){
  .world-read{padding:56px 20px 80px}
  .world-read-block{margin-bottom:44px;padding-bottom:44px}
  .world-read-tagline{margin-bottom:52px}
  .world-read-block-body{font-size:15px}
  .world-read-cta{margin-top:56px;padding-top:44px}
}

.reader-topbar{position:sticky;top:0;z-index:50;background:var(--sb);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:8px;transition:transform .26s ease;will-change:transform}
.reader-topbar.hidden{transform:translateY(-110%)}
.reader-topbar button{background:transparent;border:none;color:var(--tx3);font-size:13px;padding:5px 8px;border-radius:5px}
.reader-topbar button:hover{color:var(--tx);background:var(--sm)}
.doll-reader-wrap{max-width:700px;margin:20px auto 40px;padding:32px 40px 80px;background:var(--sb);border-radius:12px}
.doll-reader-header{padding:16px 0;margin-bottom:4px;text-align:center}
.doll-ep-eyebrow{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase}
.doll-ep-num{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--tx3);font-family:monospace}
.doll-ep-title{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.03em;margin-top:4px}
.doll-cast-wrap{text-align:center;margin-bottom:24px}
.doll-cast-label{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--tx3);text-transform:uppercase;margin-bottom:12px}
.doll-cast{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.doll-cast-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.doll-cast-icon{width:52px;height:52px;border-radius:50%;overflow:hidden;border:1.5px solid #cce4ee;background:#eef6fa;display:flex;align-items:center;justify-content:center}
.doll-cast-icon img{width:100%;height:100%;object-fit:cover;display:block}
.doll-cast-num{font-size:12px;font-weight:700;color:var(--tx2);font-family:monospace;letter-spacing:.5px}
.doll-script-block{margin-bottom:16px}
.doll-script-img{width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--bd);background:var(--bg)}
.doll-script-img img{width:100%;display:block;border-radius:7px}
.doll-script-line{display:flex;align-items:flex-start}
.doll-line-icon{flex-shrink:0;width:44px;height:44px;border-radius:50%;overflow:hidden;border:1.5px solid #cce4ee;background:#eef6fa;margin-top:14px}
.doll-line-icon img{width:100%;height:100%;object-fit:cover;display:block}
.doll-line-icon.hidden{visibility:hidden}
.doll-line-connector{display:flex;align-items:center;flex-shrink:0;padding-top:30px}
.doll-tail-speech{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:9px solid #b8d9e8;position:relative;margin-left:6px}
.doll-tail-speech::after{content:'';position:absolute;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-right:9px solid var(--sb);top:-4px;left:3px}
.doll-tail-thought{display:flex;align-items:center;gap:4px;padding:0 6px}
.doll-tail-dot{border-radius:50%;background:#b8d9e8}
.doll-tail-dot1{width:6px;height:6px}
.doll-tail-dot2{width:9px;height:9px}
.doll-bubble{flex:1;min-width:0;background:var(--sb);border:2px solid #b8d9e8;border-radius:20px;padding:10px 16px;outline:3px solid #eaf5f9;outline-offset:-5px;box-shadow:2px 3px 0 #b8d9e8}
.doll-bubble.thought{background:#fafcff;border:2px dashed #b8d9e8;outline:none}
.doll-bubble.thought .doll-line-text{font-style:italic;color:var(--tx2)}
.doll-line-speaker{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#7aaec4;margin-bottom:5px}
.doll-line-text{font-size:16px;color:var(--tx);line-height:1.9;word-break:keep-all}
.doll-narration{padding:2px 0}
.doll-narration .doll-line-text{font-size:15px;color:var(--tx2);font-style:italic;line-height:1.9}
.doll-system{text-align:center;padding:6px 0}
.doll-system-text{display:inline-block;font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--tx);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:5px 16px}
.doll-sfx{text-align:center;padding:4px 0}

var TL = window.TL = {
  lang:  'ko',
  hooks: [],
  onChange:   function(fn){ if(typeof fn === 'function') TL.hooks.push(fn); },
  badge:      function(engine){ _tlBadge(engine); },
  badgeReset: function(){ _tlBadgeReset(); },
  set:        function(lang){ setLang(lang); }
};

/* ── 번역 뱃지 ── */
function _tlBadge(engine){
  var el = document.getElementById('tl-badge'); if(!el) return;
  el.className = engine + ' show';
  el.textContent = (engine === 'deepl') ? 'DeepL' : 'Google';
}
function _tlBadgeReset(){
  var el = document.getElementById('tl-badge'); if(!el) return;
  el.className = ''; el.textContent = '';
}

/* ── Google Translate ── */
function googleTranslateElementInit(){
  new google.translate.TranslateElement({pageLanguage:'ko', autoDisplay:false}, 'google_translate_element');
}
function _tlGoogle(lang){
  _tlBadge('google');
  var sel = document.querySelector('.goog-te-combo');
  if(sel){ sel.value = lang; sel.dispatchEvent(new Event('change')); return; }
  /* 위젯 미로드 시 쿠키 방식 */
  document.cookie = 'googtrans=/ko/' + lang + ';path=/';
  document.cookie = 'googtrans=/ko/' + lang + ';path=/;domain=.' + location.hostname;
  location.reload();
}

/* ── iframe 탭에도 번역 적용 (같은 출처일 때만) ── */
function _injectGT(fr){
  try{
    var d = fr.contentDocument, w = fr.contentWindow;
    if(!d || !w || w.__gtInjected) return;
    w.__gtInjected = true;
    var slot = d.createElement('div');
    slot.id = 'google_translate_element';
    slot.style.display = 'none';
    d.body.appendChild(slot);
    w.googleTranslateElementInit = function(){
      new w.google.translate.TranslateElement({pageLanguage:'ko', autoDisplay:false}, 'google_translate_element');
    };
    var sc = d.createElement('script');
    sc.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    d.body.appendChild(sc);
  }catch(e){}
}
function _setIframeLang(fr, lang, tries){
  tries = tries || 0;
  try{
    var d = fr.contentDocument; if(!d) return;
    var sel = d.querySelector('.goog-te-combo');
    if(sel){ sel.value = lang; sel.dispatchEvent(new Event('change')); return; }
  }catch(e){ return; }
  if(tries < 20) setTimeout(function(){ _setIframeLang(fr, lang, tries + 1); }, 350);
}
function _applyLangToIframes(lang){
  document.querySelectorAll('.panel iframe').forEach(function(fr){
    if(lang === 'ko') return;
    _injectGT(fr);
    _setIframeLang(fr, lang);
    /* 자체 tl.js 를 가진 하위 페이지(story.html 등)에 언어를 알려줌 */
    try{ fr.contentWindow.postMessage({type:'biz-tl-lang', lang:lang}, '*'); }catch(e){}
  });
}
window._applyLangToIframes = _applyLangToIframes;

/* 부모 프레임이 언어를 바꿨을 때 — 구글 위젯은 부모가 이미 주입하므로 상태만 맞춘다 */
window.addEventListener('message', function(ev){
  var d = ev.data;
  if(!d || d.type !== 'biz-tl-lang' || d.lang === TL.lang) return;
  TL.lang = d.lang;
  TL.hooks.forEach(function(fn){ try{ fn(d.lang); }catch(e){ console.warn('[TL hook]', e); } });
  _tlBadge('google');
});

/* ── 언어 전환 진입점 ── */
function setLang(lang){
  TL.lang = lang;

  if(lang === 'ko'){
    document.cookie = 'googtrans=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
    document.cookie = 'googtrans=;path=/;domain=.' + location.hostname + ';expires=Thu, 01 Jan 1970 00:00:00 GMT';
    location.reload();
    return;
  }

  /* 페이지별 훅 — 스토리 본문 DeepL 등 (TL.onChange 로 등록) */
  TL.hooks.forEach(function(fn){
    try{ fn(lang); }catch(e){ console.warn('[TL hook]', e); }
  });

  _tlGoogle(lang);
  _applyLangToIframes(lang);
}
window.setLang = setLang;
window.googleTranslateElementInit = googleTranslateElementInit;

    var n = document.createElement('span');
    n.style.cssText = 'font-size:13px;color:var(--tx);flex:1'; n.textContent = name;
    var c = document.createElement('span');

    d.appendChild(n); d.appendChild(c);
    if(isS){ var ck = document.createElement('span'); ck.style.cssText = 'font-size:12px;color:#3558c0'; ck.textContent = '✓'; d.appendChild(ck); }

  function render(q){

    list.innerHTML = '';

      div.style.cssText = 'height:1px;background:var(--bd);margin:4px 0';
      list.appendChild(div);
      filtered.filter(function(l){ return PRIORITY.indexOf(l[1]) === -1; }).forEach(function(l){ list.appendChild(item(l)); });
    }else{
      filtered.forEach(function(l){ list.appendChild(item(l)); });
    }
  }
  function close(){
    _open = false;
    var dd = document.getElementById('tb-lang-dropdown');
    var btn = document.getElementById('tb-lang-drop-btn');
    var caret = document.getElementById('tb-lang-caret');
    if(dd) dd.style.display = 'none';
    if(btn){ btn.style.background = 'transparent'; btn.style.color = 'var(--tx2)'; btn.style.borderColor = 'var(--bd)'; }
    if(caret) caret.style.transform = '';
  }
  window.tbLangToggle = function(){
    _open = !_open;
    var dd = document.getElementById('tb-lang-dropdown');
    var btn = document.getElementById('tb-lang-drop-btn');
    var caret = document.getElementById('tb-lang-caret');
    if(!dd) return;
    dd.style.display = _open ? 'block' : 'none';
    if(btn){
      btn.style.background = _open ? 'var(--sm)' : 'transparent';
      btn.style.color = _open ? 'var(--tx)' : 'var(--tx2)';
      btn.style.borderColor = _open ? 'var(--bd2)' : 'var(--bd)';
    }
    if(caret) caret.style.transform = _open ? 'rotate(180deg)' : '';
    if(_open){ render(''); setTimeout(function(){ var s = document.getElementById('tb-lang-search'); if(s) s.focus(); }, 80); }
  };
  window.tbLangFilter = function(){
    var s = document.getElementById('tb-lang-search');
    render(s ? s.value : '');
  };
  window.tbLangSelect = function(code, name){
    _sel = code;
    var lbl = document.getElementById('tb-lang-label');
    if(lbl) lbl.textContent = name;
    close();
    setLang(code);
  };
  document.addEventListener('click', function(e){
    if(_open && !e.target.closest('#tb-lang-drop-btn') && !e.target.closest('#tb-lang-dropdown')) close();
  });

  /* 새로고침 후에도 선택 언어 라벨 유지 (googtrans 쿠키 기준) */
  var m = document.cookie.match(/googtrans=\/[^\/]+\/([^;]+)/);
  if(m && m[1] && m[1] !== 'ko'){
    TL.lang = m[1];
    _sel = m[1];
    var found = ALL_LANGS.filter(function(l){ return l[1] === m[1]; })[0];
    var lbl0 = document.getElementById('tb-lang-label');
    if(lbl0 && found) lbl0.textContent = found[0];
    _tlBadge('google');
  }
})();
</script>
<script>
/* ══════ 스토리 데이터 ══════ */
var _storyData = null;
var _storyErr = null;

async function fetchStory(){
  if(_storyData) return _storyData;
  try{
    var r = await fetch('story_editor.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    _storyData = await r.json();
    _storyErr = null;
  }catch(e){
    _storyErr = e;
    _storyData = null;
  }
  return _storyData;
}


/* ══════════════════════════════════════════════════
   세계관 (EP.00) — 공식 원작 설정
   - doll_intro.html 오버레이에서 이관. 인트로에는 3줄 요약만 남김
   - 스토리 목록 최상단 고정 카드 → 에피소드 리더와 같은 뷰 전환 사용
   - 이미지는 images/world/ 에 넣으면 자동으로 슬롯을 대체합니다
   ══════════════════════════════════════════════════ */
var WORLDVIEW = {
  eyebrow: 'WORLDVIEW',
  title:   'b<span class="diamond-i">&#x131;</span>z-OC-d<span class="diamond-o">o</span>ll 세계관',
  tagline: '결핍, 고통, 흔들림이 없는 세계.',
  blocks: [
    { title:'비즈오씨돌이란',
      body:'먼 미래의 이 세계는, 인간은 20%. 비즈오씨돌은 80%.<br>인간은 비즈오씨돌에게 케어를 받으며 함께 살아가고 있다.',
      img:'images/world/world_01.png' },
    { title:'두 개의 별',
      body:'인류는 두 개의 행성, 여자별과 남자별로 분리되어 있다.<br>서로 다른 바이러스 때문에 재결합이 불가능한 구조다.<br>각 행성에는 그 행성 인간에 대응하는 비즈오씨돌이 배치되어 있다.',
      img:'images/world/world_02.png' },
    { title:'전속',
      body:'모든 인간에게는 평생 함께하는 전속 비즈오씨돌이 있다.<br><br>이 관계는 부모도, 연인도, 친구도 아니다.<br>세상 어떤 이름으로도 정의되지 않는, 오직 둘만의 관계.<br><br>영혼의 결핍을 채워주는 존재.',
      img:'images/world/world_03.png' }
  ],
  ctaText: '당신의 전속 비즈오씨돌을 고르세요.',
  ctaBtn:  '캐릭터 보러 가기'
};

/* 스토리 목록 최상단 EP.00 카드 */
function worldCardHtml(){
  return '' +
    '<div class="story-note">여기는 <b>공식의 이야기</b>입니다. 당신의 비즈오씨돌은 여기에 묶이지 않습니다.</div>' +
    '<div class="world-card" onclick="openWorld()">' +
      '<div class="world-card-bg"></div>' +
      '<div class="world-card-inner">' +
        '<div class="world-card-eyebrow">EP.00 · WORLDVIEW</div>' +
        '<div class="world-card-title">공식 원작 설정<span class="world-card-badge">준비중 · 변경 가능</span></div>' +
        '<div class="world-card-sub">IP 확장을 대비해 준비 중인 설정입니다</div>' +
      '</div>' +
      '<div class="world-card-go">읽기 <span>&rsaquo;</span></div>' +
    '</div>';
}

var TAB_LABELS  = {main:'메인스토리', sub:'캐릭터스토리', event:'이벤트스토리'};
var BANNER_TXT  = {main:'MAIN STORY', sub:'CHARACTER STORY', event:'EVENT STORY'};
var TAB_COLORS  = {main:'#5a90b0', sub:'#c07090', event:'#c0a040'};
var BANNER_IMGS = {
  main:  'images/ep_cover_sc/0_banner_main_story.png',
  sub:   'images/ep_cover_sc/0_banner__character_story.png',
  event: 'images/ep_cover_sc/0_banner_event_story.png'
};
function stClass(s){ return (s==='완료'||s==='done') ? 'done' : (s==='작업중'||s==='wip') ? 'wip' : 'plan'; }
function stLabel(s){ return (s==='완료'||s==='done') ? '완료' : (s==='작업중'||s==='wip') ? '작업중' : '예정'; }
function canRead(e){ return e.status==='완료' || e.status==='done'; }

/* ══════ 편(남자편 / 여자편 / 공통) ══════
   JSON 의 route 필드: 'm' | 'f' | 'both'  (없으면 남자편으로 봄)
   주소 열쇠는 '편-종류-화번호' (예: m-main-1-1).
   both 인 화는 두 편 목록에 모두 나오고, 들어온 링크의 편을 그대로 따른다. */
var ED_LABELS = {m:'남자편', f:'여자편'};
var _ed = 'm';
try{ var _ed0 = localStorage.getItem('doll_ed'); if(_ed0==='m'||_ed0==='f') _ed = _ed0; }catch(e){}
function saveEd(){ try{ localStorage.setItem('doll_ed', _ed); }catch(e){} }

function epEd(e){ var r = (e && e.route) || 'm'; return (r==='f'||r==='both') ? r : 'm'; }
function epInEd(e, ed){ var r = epEd(e); return r==='both' || r===ed; }
function epType(e){ return (e && e.type) || 'main'; }
function epKey(e, ed){ return (ed || _ed) + '-' + epType(e) + '-' + (e.num || ''); }
function findEpIdx(key, eps){
  var p = String(key||'').split('-');
  if(p.length < 3) return -1;
  var ed = p[0], ty = p[1], num = p.slice(2).join('-');
  if(ed!=='m' && ed!=='f') return -1;
  for(var i=0;i<eps.length;i++){
    if(epInEd(eps[i], ed) && epType(eps[i])===ty && String(eps[i].num||'')===num) return i;
  }
  return -1;
}
/* 같은 편 · 같은 종류의 형제 화들 (목록에 보이는 순서와 동일) */
function siblings(eps, e){
  var out = [];
  eps.forEach(function(x, i){
    if(epInEd(x, _ed) && epType(x)===epType(e)) out.push({e:x, i:i});
  });
  return out;
}
var _toastT = null;
function toast(msg){
  var el = document.getElementById('doll-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'doll-toast'; el.className = 'doll-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* 검색은 종류 탭·편과 무관하게 하나로 공유한다.
   '001번을 찾는다'는 의도는 탭을 옮겨도 그대로이기 때문. */
var _storyChips = new Set();
var _storyInput = '';   /* 아직 칩으로 안 굳은 입력 글자 */
var _storyTab   = '';   /* 마지막으로 보던 종류 탭 */

/* ── 스토리 목록 ── */
async function renderStoryList(){
  var listEl = document.getElementById('story-list');
  var readEl = document.getElementById('story-reader');
  readEl.classList.remove('show');
  listEl.style.display = 'block';
  listEl.innerHTML = '<div class="loading" style="position:static;height:220px"><div class="spin"></div></div>';

  var data = await fetchStory();
  if(!data){
    listEl.innerHTML = worldCardHtml() +
      '<div class="story-empty">스토리 데이터를 불러오지 못했습니다.' +
      '<br><span style="font-size:12px">1. <code>story_editor.json</code> 이 이 파일과 같은 폴더에 있는지' +
      '<br>2. 파일을 더블클릭(<code>file://</code>)해서 열지 않았는지' +
      '<br><span style="font-size:11px;opacity:.75">브라우저는 file:// 에서 JSON 읽기를 막습니다. 서버에 올리거나 로컬 서버로 열어야 보여요.</span>' +
      '<br><span style="font-size:11px;opacity:.6">(' + (_storyErr ? _storyErr.message : 'unknown') + ')</span></span></div>';
    return;
  }

  var eps = data.episodes || [];
  var banners = data._banners || {};

  /* 편 스위치는 항상 보인다. 한쪽이 아직 비어 있어도
     '그쪽도 곧 온다'는 신호가 되도록 감추지 않는다. */
  var EDS = ['m','f'];

  var groups = {main:[], sub:[], event:[]};
  eps.forEach(function(e, i){
    if(!epInEd(e, _ed)) return;
    (groups[e.type] || groups.main).push(Object.assign({}, e, {_idx:i}));
  });
  var types = ['main','sub','event'].filter(function(t){ return groups[t].length > 0; });

  function edSwitchHtml(){
    return '<div class="story-ed-wrap"><div class="story-ed-row">' + EDS.map(function(k){
      return '<button class="story-ed-btn ' + k + (k===_ed?' active':'') + '" onclick="switchEdition(\'' + k + '\')">' +
             (ED_LABELS[k]||k) + '</button>';
    }).join('') + '</div></div>';
  }

  if(!types.length){
    var emptyMsg = eps.length
      ? (ED_LABELS[_ed] || '이 편') + '은 아직 준비 중입니다.'
      : '스토리 에피소드가 없습니다.';
    listEl.innerHTML = worldCardHtml() + edSwitchHtml() + '<div class="story-empty">' + emptyMsg + '</div>';
    return;
  }
  var activeTab = (types.indexOf(_storyTab) !== -1) ? _storyTab : types[0];

  function banner(t){
    var img = banners[t] || BANNER_IMGS[t] || '';
    var bg = 'linear-gradient(135deg,#1a2e3a,' + (TAB_COLORS[t]||'#5a90b0') + ')';
    return '<div class="story-banner" style="background:' + bg + '">' +
      (img ? '<img src="' + img + '" onerror="this.style.display=\'none\'">' : '') +
      '<div class="story-banner-txt">' +
        '<div class="story-banner-eyebrow"><span class="brandname">biz-OC-doll</span> · STORY</div>' +
        '<div class="story-banner-title">' + (BANNER_TXT[t]||'STORY') + '</div>' +
      '</div></div>';
  }

  function cards(t){
    return groups[t].map(function(e){
      var read = canRead(e);
      var color = TAB_COLORS[e.type] || '#5a90b0';
      var cast = (e.castList||[]).map(function(c){ return c.charNum; }).filter(Boolean);
      var castHtml = cast.map(function(n){
        return '<img src="images/simple_profile/' + n + '.png" data-cast="' + n + '" ' +
               'style="width:30px;height:30px;border-radius:50%;border:1.5px solid #cce4ee;background:#eef6fa;object-fit:cover;flex-shrink:0" ' +
               'onerror="this.style.opacity=.4">';
      }).join('');
      var date = e.completedDate ? e.completedDate.replace(/-/g, '.') : '';
      var wipStyle = (e.status==='작업중'||e.status==='wip') ? 'background:#F9F4CA;color:#c9a227' : '';
      return '<div class="story-ep-card' + (read?'':' locked') + '" data-cast="' + cast.join(',') + '"' +
             (read ? ' onclick="openEp(' + e._idx + ')"' : '') + '>' +
        '<div style="font-family:monospace;font-size:11px;font-weight:700;color:var(--tx3);min-width:32px;flex-shrink:0">' + (e.num||'') + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">' +
            '<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid ' + color + ';color:' + color + ';background:' + color + '18">' + (TAB_LABELS[e.type]||e.type||'') + '</span>' +
            (epEd(e)==='both' ? '<span class="ep-both-badge">공통</span>' : '') +
            '<span class="ep-status-badge ' + stClass(e.status) + '" style="' + wipStyle + '">' + stLabel(e.status) + '</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;min-width:0">' +
            '<div style="font-size:14px;font-weight:600;color:' + (read?'var(--tx)':'var(--tx3)') + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">' + (e.title||'') + '</div>' +
            (castHtml ? '<div style="display:flex;align-items:center;gap:4px;flex-shrink:0">' + castHtml + '</div>' : '') +
          '</div>' +
        '</div>' +
        (date ? '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">' +
                  '<div style="font-size:10px;color:var(--tx3);white-space:nowrap"><span style="opacity:.45">✓</span> ' + date + '</div>' +
                  (read ? '<span style="color:var(--tx3);font-size:14px">›</span>' : '') +
                '</div>'
              : (read ? '<span style="color:var(--tx3);font-size:14px;flex-shrink:0">›</span>' : '')) +
      '</div>';
    }).join('');
  }

  listEl.innerHTML = worldCardHtml() + edSwitchHtml() + types.map(function(t){
    return '<div id="story-sec-' + t + '" style="display:' + (t===activeTab?'block':'none') + '">' +
      banner(t) +
      '<div style="padding:10px 24px 6px">' +
        '<input id="story-search-' + t + '" type="text" placeholder="캐릭터 번호로 검색 (예: 001)" ' +
        'onkeydown="onStorySearchKey(event,\'' + t + '\')" ' +
        'oninput="onStorySearchInput(this)" ' +
        'style="width:100%;padding:9px 16px;border:1px solid var(--bd);border-radius:20px;font-size:12px;font-family:var(--fn);outline:none;background:var(--bg);color:var(--tx)">' +
        '<div id="story-chips-' + t + '" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;min-height:4px"></div>' +
      '</div>' +
      '<div class="story-tab-row">' + types.map(function(tb){
        return '<button class="story-tab-btn' + (tb===t?' active':'') + '" onclick="switchStoryTab(\'' + tb + '\')">' + (TAB_LABELS[tb]||tb) + '</button>';
      }).join('') + '</div>' +
      '<div id="story-cards-' + t + '" style="padding:8px 24px 24px">' + cards(t) + '</div>' +
    '</div>';
  }).join('');

  /* 목록을 새로 그렸으니 검색 칩·입력 글자를 화면에 되살린다 */
  syncSearchUI();
}

window.switchEdition = function(k){
  if(k === _ed) return;
  _ed = k; saveEd();
  renderStoryList();   /* 검색 칩·입력 글자는 그대로 유지된다 */
};

window.switchStoryTab = function(t){
  _storyTab = t;
  document.querySelectorAll('[id^="story-sec-"]').forEach(function(el){ el.style.display = 'none'; });
  var el = document.getElementById('story-sec-' + t);
  if(el) el.style.display = 'block';
};

/* ── 캐릭터 번호 검색 칩 ── */
/* 화면에 떠 있는 종류 탭 목록 (숨겨진 탭도 DOM 에는 있다) */
function storyTypesOnScreen(){
  var out = [];
  document.querySelectorAll('[id^="story-chips-"]').forEach(function(el){
    out.push(el.id.replace('story-chips-', ''));
  });
  return out;
}
/* 검색 상태를 세 탭 모두에 똑같이 반영한다 */
function syncSearchUI(){
  storyTypesOnScreen().forEach(function(t){
    var inp = document.getElementById('story-search-' + t);
    if(inp && inp.value !== _storyInput) inp.value = _storyInput;
    renderChips(t);
    applyFilter(t);
  });
}
window.onStorySearchInput = function(el){
  _storyInput = el.value;
  storyTypesOnScreen().forEach(function(t){
    var i = document.getElementById('story-search-' + t);
    if(i && i !== el) i.value = _storyInput;
  });
};

window.onStorySearchKey = function(ev, t){
  if(ev.key !== 'Enter' && ev.key !== ' ') return;
  ev.preventDefault();
  var input = ev.target;
  var val = input.value.trim();
  if(!val) return;
  _storyChips.add(val);
  _storyInput = '';
  input.value = '';
  syncSearchUI();
};
function renderChips(t){
  var wrap = document.getElementById('story-chips-' + t);
  if(!wrap) return;
  wrap.innerHTML = Array.from(_storyChips).map(function(n){
    return '<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 12px;background:var(--bg);border:1px solid var(--bd2);border-radius:20px;font-size:11px;font-weight:600;color:var(--tx2)">' +
      n + '<button onclick="removeChip(\'' + t + '\',\'' + n + '\')" style="background:none;border:none;cursor:pointer;color:var(--tx3);font-size:13px;line-height:1;padding:0 0 0 2px">×</button></span>';
  }).join('');
}
window.removeChip = function(t, n){
  _storyChips.delete(n);
  syncSearchUI();
};
function applyFilter(t){
  var chips = Array.from(_storyChips);
  document.querySelectorAll('#story-cards-' + t + ' .story-ep-card').forEach(function(card){
    var nums = (card.dataset.cast||'').split(',').filter(Boolean);
    var match = !chips.length || chips.every(function(q){ return nums.some(function(n){ return n.indexOf(q) !== -1; }); });
    card.style.opacity = match ? '' : '0.2';
    card.style.pointerEvents = match ? '' : 'none';
    card.querySelectorAll('img[data-cast]').forEach(function(img){
      var hit = chips.length && chips.some(function(q){ return img.dataset.cast.indexOf(q) !== -1; });
      img.style.outline = hit ? '2px solid #5a90b0' : '';
      img.style.outlineOffset = hit ? '1px' : '';
    });
  });
}

/* ══════ 세계관 리더 (EP.00) ══════
   에피소드 리더와 같은 뷰 전환을 재사용해서
   "이것도 읽는 콘텐츠"라는 인식을 만든다. */
window.openWorld = function(push){
  var listEl = document.getElementById('story-list');
  var readEl = document.getElementById('story-reader');
  if(push !== false) route('world');

  readEl.innerHTML =
    '<div class="reader-topbar">' +
      '<button onclick="backToStoryList()">← 목록</button>' +
      '<div style="width:1px;height:14px;background:var(--bd);margin:0 2px"></div>' +
      '<div style="font-size:12px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">EP.00 · 공식 원작 설정</div>' +
    '</div>' +
    '<div class="world-read">' +
      '<div class="world-read-inner">' +
        '<div class="world-read-eyebrow">' + WORLDVIEW.eyebrow + '</div>' +
        '<div class="world-read-title">' + WORLDVIEW.title + '</div>' +

/* ══════ 스토리 리더 ══════ */
var _epIdx = -1;
var _epKeyStr = '';

/* 잠금은 오직 여기 한 곳에서만 확인한다.
   이전/다음 버튼 · 주소 직접 입력 · 부모창 메시지가 전부 이 문을 지난다. */
window.openEp = async function(idx, push){
  var data = await fetchStory(); if(!data) return;
  var eps = data.episodes || [];
  var e = eps[idx];
  if(!e){ backToStoryList(push); return; }

  if(!canRead(e)){
    backToStoryList(push);
    toast('아직 공개 전인 화입니다.');
    return;
  }

  /* 다른 편의 링크로 들어왔으면 그 편으로 자동 전환 */
  if(!epInEd(e, _ed)){ _ed = epEd(e); saveEd(); renderStoryList(); }

  _epIdx = idx;
  _epKeyStr = epKey(e, _ed);
  if(push !== false) route(_epKeyStr);
  renderReader(idx);
};
window.backToStoryList = function(push){
  bars(false);
  if(push !== false) route('');
  document.getElementById('story-reader').classList.remove('show');
  document.getElementById('story-list').style.display = 'block';
  window.scrollTo(0, 0);
};

async function renderReader(idx){
  var listEl = document.getElementById('story-list');
  var readEl = document.getElementById('story-reader');
  var data = await fetchStory();
  if(!data) return;
  var eps = data.episodes || [];
  var e = eps[idx];
  if(!e){ backToStoryList(); return; }

  /* 같은 편 · 같은 종류 안에서만 이동. 목록에 보이는 순서와 동일하다. */
  var sibs = siblings(eps, e);
  var pos = -1;
  for(var si=0; si<sibs.length; si++){ if(sibs[si].i === idx) pos = si; }
  var prevS = (pos > 0) ? sibs[pos-1] : null;
  var nextS = (pos >= 0 && pos < sibs.length-1) ? sibs[pos+1] : null;

  function navBtn(sb, dir){
    var arrow = dir < 0 ? '<span>←</span>' : '<span>→</span>';
    if(!sb){
      var endTxt = dir < 0 ? '처음 화' : '마지막 화';
      return '<button class="ep-nav-btn disabled">' +
             (dir<0 ? arrow + '<span class="ep-nav-title">' + endTxt + '</span>'
                    : '<span class="ep-nav-title">' + endTxt + '</span>' + arrow) + '</button>';
    }
    var ok = canRead(sb.e);
    var t  = (sb.e.title || '') + (ok ? '' : ' · ' + stLabel(sb.e.status));
    var op = ok ? ' onclick="openEp(' + sb.i + ')"' : '';
    return '<button class="ep-nav-btn' + (ok ? '' : ' disabled') + '"' + op + '>' +
           (dir<0 ? arrow + '<span class="ep-nav-title">' + t + '</span>'
                  : '<span class="ep-nav-title">' + t + '</span>' + arrow) + '</button>';
  }

  var cl = e.castList || [];
  var castHtml = cl.length
    ? '<div class="doll-cast-wrap"><div class="doll-cast-label">CAST</div><div class="doll-cast">' +
      cl.map(function(c){
        return '<div class="doll-cast-item"><div class="doll-cast-icon">' +
          '<img src="images/simple_profile/' + (c.charNum||'001') + '.png" alt="" onerror="this.style.display=\'none\'">' +
          '</div><div class="doll-cast-num">' + (c.charNum||'?') + '</div></div>';
      }).join('') + '</div></div>'
    : '';

  readEl.innerHTML =
    '<div class="reader-topbar">' +
      '<button onclick="backToStoryList()">← 목록</button>' +
      '<div style="width:1px;height:14px;background:var(--bd);margin:0 2px"></div>' +
      '<div style="font-size:12px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (e.title||'스토리 읽기') + '</div>' +
    '</div>' +
    '<div class="doll-reader-wrap">' +
      tlBarHtml() +
      '<div class="doll-reader-header">' +
        '<div><span class="doll-ep-eyebrow">' + (e.eyebrow||'') + '</span>' +
        (e.num ? '<span class="doll-ep-num"> · ' + e.num + '</span>' : '') + '</div>' +
        '<div class="doll-ep-title">' + (e.title||'') + '</div>' +
      '</div>' +
      castHtml +
      '<div id="doll-blocks-wrap">' + bbDoll(e.blocks||[]) + '</div>' +
      '<div class="ep-nav-outer"><div class="ep-nav">' +
        navBtn(prevS, -1) +
        '<button class="ep-picker-btn" onclick="openEpPicker()">&#9776; 목록</button>' +
        navBtn(nextS, 1) +
      '</div></div>' +
    '</div>';

  listEl.style.display = 'none';
  readEl.classList.add('show');
  window.scrollTo(0, 0);
  bars(false);

  _dollOrigBlocks = e.blocks || [];
  _dollOrigTitle  = e.title || '';
  syncDollTlBar();
}

/* ── 블록 렌더러 ── */
function bbDoll(blocks){
  var last = null;
  return blocks.map(function(b){
    var d = b.data || {};
    if(b.type === 'cast'){
      last = null;
      var ms = d.members || [];
      if(!ms.length) return '';
      return '<div class="doll-cast-wrap"><div class="doll-cast-label">Cast</div><div class="doll-cast">' +
        ms.map(function(m){
          return '<div class="doll-cast-item"><div class="doll-cast-icon">' +
            '<img src="images/simple_profile/' + (m.charNum||'001') + '.png" alt="" onerror="this.style.display=\'none\'">' +
            '</div><div class="doll-cast-num">' + (m.charNum||'?') + '</div></div>';
        }).join('') + '</div></div>';
    }
    if(b.type === 'scene'){
      last = null;
      var s = d.filename ? 'images/ep_cover_sc/' + d.filename : '';
      return '<div class="doll-script-block"><div class="doll-script-img">' +
        (s ? '<img src="' + s + '" alt="">' : '') + '</div></div>';
    }
    if(b.type === 'speech' || b.type === 'thought'){
      var same = d.exprFilename && d.exprFilename === last;
      last = d.exprFilename || null;
      var img = d.exprFilename ? 'images/simple_profile/' + d.exprFilename : '';
      var th = (b.type === 'thought') ? ' thought' : '';
      var conn = (b.type === 'thought')
        ? '<div class="doll-tail-thought"><div class="doll-tail-dot doll-tail-dot1"></div><div class="doll-tail-dot doll-tail-dot2"></div></div>'
        : '<div class="doll-tail-speech"></div>';
      return '<div class="doll-script-block"><div class="doll-script-line">' +
        '<div class="doll-line-icon' + (same?' hidden':'') + '"><img src="' + img + '" alt="" onerror="this.parentNode.style.background=\'#eef6fa\'"></div>' +
        '<div class="doll-line-connector">' + conn + '</div>' +
        '<div class="doll-bubble' + th + '"><div class="doll-line-speaker">' + (d.charNum||'') + '</div>' +
        '<div class="doll-line-text">' + (d.text||'') + '</div></div></div></div>';
    }
    if(b.type === 'narration'){ last = null;
      return '<div class="doll-script-block"><div class="doll-narration"><div class="doll-line-text">' + (d.text||'') + '</div></div></div>'; }
    if(b.type === 'system'){ last = null;
      return '<div class="doll-script-block"><div class="doll-system"><span class="doll-system-text">' + (d.text||'') + '</span></div></div>'; }
    if(b.type === 'sfx'){ last = null;
      return '<div class="doll-script-block"><div class="doll-sfx"><div class="doll-sfx-text">' + (d.text||'') + '</div></div></div>'; }
    if(b.type === 'chat'){ last = null;
      return '<div class="doll-script-block"><div class="doll-chat"><div class="doll-chat-header">' + (d.header||'') + '</div>' +
        (d.msgs||[]).map(function(m){
          return '<div class="doll-chat-bubble' + (m.dir==='right'?' right':'') + '">' + m.text + '</div>';
        }).join('') + '</div></div>'; }
    if(b.type === 'divider'){ last = null;
      return '<div class="doll-script-block"><div class="doll-divider">· · ·</div></div>'; }
    return '';
  }).join('');
}

/* ── 에피소드 피커 ── */
window.openEpPicker = async function(){
  var data = await fetchStory();
  if(!data) return;
  var eps = data.episodes || [];
  var cur = eps[_epIdx];
  var list = cur ? siblings(eps, cur) : eps.map(function(e,i){ return {e:e, i:i}; });
  document.getElementById('ep-picker-list').innerHTML = list.map(function(sb){
    var e = sb.e, i = sb.i;
    var read = canRead(e);
    return '<div class="ep-picker-item' + (i === _epIdx ? ' current' : '') + (read ? '' : ' locked') + '"' +
      (read ? ' onclick="closeEpPicker();openEp(' + i + ')"' : '') + '>' +
      '<span class="ep-picker-num">' + (e.num || (i+1)) + '</span>' +
      '<span class="ep-picker-t">' + (e.title||'') + '</span>' +
      '<span class="ep-picker-st ' + stClass(e.status) + '">' + stLabel(e.status) + '</span>' +
    '</div>';
  }).join('');
  document.getElementById('ep-picker').classList.remove('hidden');
};
window.closeEpPicker = function(){ document.getElementById('ep-picker').classList.add('hidden'); };
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape') closeEpPicker();
});

/* ══════════════════════════════════════════════════
   스토리 본문 DeepL 번역
   · 공용 번역 엔진은 이 파일 위쪽 공용 블록 (TL.lang / TL.onChange / TL.badge)
   · 3단계에서 story.html 로 함께 이사할 부분
   ══════════════════════════════════════════════════ */

var _dollOrigBlocks = [];
var _dollOrigTitle  = '';

function _dlCfg(){ return (typeof CONFIG !== 'undefined' && CONFIG.DEEPL) ? CONFIG.DEEPL : {}; }

/* 언어가 바뀌면 본문을 원본으로 되돌리고 번역바 상태를 다시 계산 */
TL.onChange(function(lang){
  var wrap = document.getElementById('doll-blocks-wrap');
  if(wrap && _dollOrigBlocks.length){
    wrap.innerHTML = bbDoll(_dollOrigBlocks);
    wrap.classList.remove('notranslate');
  }
  var titleEl = document.querySelector('.doll-ep-title');
  if(titleEl && _dollOrigTitle){ titleEl.textContent = _dollOrigTitle; titleEl.classList.remove('notranslate'); }
  syncDollTlBar();
});

/* ══ 스토리 본문 DeepL ══ */
function _dlLangCode(lang){
  return (lang === 'zh-CN' || lang === 'zh-TW') ? 'ZH' : (lang || '').split('-')[0].toUpperCase();
}
function _dollCacheKey(){ return 'dl_doll_' + (_epKeyStr || _epIdx) + '_' + _dlLangCode(TL.lang); }

function tlBarHtml(){
  var cfg = _dlCfg();
  if(!cfg.enabled || !cfg.proxyUrl) return '';
  return '<div id="doll-tl-bar">' +
    '<button id="doll-dl-btn" onclick="onDollDeepL()">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>' +
      ' DeepL로 번역</button>' +
    '<button id="doll-dl-rebtn" onclick="onDollDeepLRe()">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>' +
      ' 재번역</button>' +
  '</div>';
}

function _dollBtn(){   return document.getElementById('doll-dl-btn'); }
function _dollRebtn(){ return document.getElementById('doll-dl-rebtn'); }
function _dollWrap(){  return document.getElementById('doll-blocks-wrap'); }

function _dollBtnReset(){
  var b = _dollBtn(); if(!b) return;
  b.classList.remove('done');
  b.style.opacity = ''; b.style.pointerEvents = '';
  b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg> DeepL로 번역';
}
function _dollTlDone(){
  var b = _dollBtn(), r = _dollRebtn();
  if(b){
    b.classList.add('done');
    b.style.opacity = ''; b.style.pointerEvents = '';
    b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> DeepL 번역됨';
  }
  if(r) r.style.display = 'flex';
  TL.badge('deepl');
}

/* 언어·에피소드가 바뀔 때 바 상태 동기화 */
function syncDollTlBar(){
  var bar = document.getElementById('doll-tl-bar');
  if(!bar) return;
  var on = TL.lang && TL.lang !== 'ko';
  bar.style.display = on ? 'flex' : 'none';
  if(!on){ _dollBtnReset(); var r0 = _dollRebtn(); if(r0) r0.style.display = 'none'; return; }

  var cached = null;
  try{ cached = localStorage.getItem(_dollCacheKey()); }catch(e){}
  if(cached){
    try{
      var obj = JSON.parse(cached);
      var wrap = _dollWrap();
      if(wrap){ wrap.innerHTML = bbDoll(obj.blocks); wrap.classList.add('notranslate'); }
      var t = document.querySelector('.doll-ep-title');
      if(t && obj._title){ t.textContent = obj._title; t.classList.add('notranslate'); }
      _dollTlDone();
      return;
    }catch(e){}
  }
  _dollBtnReset();
  var r = _dollRebtn(); if(r) r.style.display = 'none';
}

window.onDollDeepL = async function(){
  var btn = _dollBtn();
  if(!btn || btn.classList.contains('done')) return;
  var cfg = _dlCfg();
  var url = cfg.proxyUrl || ''; if(!url) return;
  if(!TL.lang || TL.lang === 'ko') return;

  var key = _dollCacheKey();
  try{
    var cached = localStorage.getItem(key);
    if(cached){
      var obj = JSON.parse(cached);
      var wrap = _dollWrap();
      if(wrap){ wrap.innerHTML = bbDoll(obj.blocks); wrap.classList.add('notranslate'); }
      var t = document.querySelector('.doll-ep-title');
      if(t && obj._title) t.textContent = obj._title;
      _dollTlDone(); return;
    }
  }catch(e){}

  var data = await fetchStory(); if(!data) return;
  var ep = (data.episodes || [])[_epIdx]; if(!ep) return;
  _doDollTranslate(url, key, ep.blocks || [], ep.title || '', _dlLangCode(TL.lang));
};

window.onDollDeepLRe = async function(){
  var key = _dollCacheKey();
  try{ localStorage.removeItem(key); }catch(e){}
  var r = _dollRebtn(); if(r) r.style.display = 'none';
  _dollBtnReset();
  var wrap = _dollWrap();
  if(wrap && _dollOrigBlocks.length){ wrap.innerHTML = bbDoll(_dollOrigBlocks); wrap.classList.remove('notranslate'); }
  var t = document.querySelector('.doll-ep-title');
  if(t && _dollOrigTitle){ t.textContent = _dollOrigTitle; t.classList.remove('notranslate'); }
  var cfg = _dlCfg();
  var url = cfg.proxyUrl || ''; if(!url) return;
  var data = await fetchStory(); if(!data) return;
  var ep = (data.episodes || [])[_epIdx]; if(!ep) return;
  _doDollTranslate(url, key, ep.blocks || [], ep.title || '', _dlLangCode(TL.lang));
};

function _doDollTranslate(url, cacheKey, blocks, origTitle, dlLang){
  var btn = _dollBtn();
  var targets = [];
  blocks.forEach(function(b, i){
    if(['system','narration','sfx','speech','thought'].indexOf(b.type) === -1) return;
    var t = (b.data && b.data.text) ? b.data.text : '';
    var clean = t.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').trim();
    if(clean) targets.push({idx:i, text:clean});
  });
  var titleClean = (origTitle || '').trim();
  var allTexts = (titleClean ? [titleClean] : []).concat(targets.map(function(t){ return t.text; }));
  if(!allTexts.length) return;

  if(btn){ btn.innerHTML = '번역 중…'; btn.style.opacity = '0.6'; btn.style.pointerEvents = 'none'; }

  var BATCH = 50, batches = [];
  for(var i = 0; i < allTexts.length; i += BATCH) batches.push(allTexts.slice(i, i + BATCH));

  Promise.all(batches.map(function(batch){
    return fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text:batch, target_lang: dlLang || 'JA'})
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      return d.translations.map(function(t){ return t.text; });
    });
  })).then(function(results){
    var translated = [].concat.apply([], results);
    var offset = titleClean ? 1 : 0;
    var tlTitle = titleClean ? (translated[0] || titleClean) : '';
    var tlBody = translated.slice(offset);
    var tlBlocks = JSON.parse(JSON.stringify(blocks));
    targets.forEach(function(t, i){ if(tlBody[i]) tlBlocks[t.idx].data.text = tlBody[i]; });
    try{ localStorage.setItem(cacheKey, JSON.stringify({blocks:tlBlocks, _title:tlTitle})); }catch(e){}
    var wrap = _dollWrap();
    if(wrap){ wrap.innerHTML = bbDoll(tlBlocks); wrap.classList.add('notranslate'); }
    var titleEl = document.querySelector('.doll-ep-title');
    if(titleEl && tlTitle){ titleEl.textContent = tlTitle; titleEl.classList.add('notranslate'); }
    _dollTlDone();
  }).catch(function(err){
    console.warn('[DeepL doll]', err);
    _dollBtnReset();
  });
}

/* ══════════════════════════════════════════════════
   부모 프레임(index.html)과의 통신 — 3단계에서 새로 생긴 부분

   story.html → 부모
     biz-doll-route  현재 위치(''|'world'|숫자) → 부모 주소창 갱신
     biz-doll-bars   상단바 숨김/표시
     biz-doll-go     캐릭터 탭으로 이동 요청
   부모 → story.html
     biz-doll-nav    뒤로가기·딥링크로 위치 이동
     biz-tl-lang     언어 변경 (위쪽 공용 블록이 처리)

   단독으로 열면(EMBED=false) 전부 자기 주소(#3, #world)로 처리합니다.
   ══════════════════════════════════════════════════ */
var EMBED = (function(){ try{ return window.parent !== window; }catch(e){ return true; } })();

function toParent(msg){ if(EMBED){ try{ parent.postMessage(msg, '*'); }catch(e){} } }

function route(r){
  if(EMBED){ toParent({type:'biz-doll-route', route:r}); return; }
  history.pushState(null, '', (r === '' || r === null) ? location.pathname : '#' + r);
}

var _barsHidden = false;
function bars(hide){
  if(_barsHidden === hide) return;
  _barsHidden = hide;
  var rt = document.querySelector('#story-reader.show .reader-topbar');
  if(rt) rt.classList.toggle('hidden', hide);
  var solo = document.getElementById('solo-topbar');
  if(solo) solo.classList.toggle('hidden', hide);
  if(!hide) document.querySelectorAll('.reader-topbar.hidden').forEach(function(el){ el.classList.remove('hidden'); });
  toParent({type:'biz-doll-bars', hide:hide});
}

/* 스크롤로 상단바 자동 숨김 (모바일) */
(function(){
  var last = 0;
  window.addEventListener('scroll', function(){
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if(window.innerWidth > 768){ bars(false); last = 0; return; }
    if(y > last && y > 70)      bars(true);
    else if(y < last - 10)      bars(false);
    last = y <= 0 ? 0 : y;
  }, {passive:true});
  window.addEventListener('resize', function(){ if(window.innerWidth > 768) bars(false); });
})();

/* 위치 이동 한 곳으로 모음 */
async function navTo(r, push){
  r = String(r == null ? '' : r);
  if(r === 'world'){ openWorld(push); return; }
  if(!r){ backToStoryList(push); return; }

  var data = await fetchStory();
  var eps = (data && data.episodes) || [];
  var idx = findEpIdx(r, eps);

  /* 옛 주소(#3 처럼 칸 번호만) 호환 — 공개 전이라 쓰일 일은 거의 없다 */
  if(idx < 0 && /^\d+$/.test(r)) idx = parseInt(r, 10);

  if(idx < 0 || !eps[idx]){ backToStoryList(push); return; }
  openEp(idx, push);
}

window.addEventListener('message', function(ev){
  var d = ev.data;
  if(!d || d.type !== 'biz-doll-nav') return;
  navTo(d.route, false);
});

if(!EMBED){
  window.addEventListener('popstate', function(){
    navTo((location.hash || '').replace(/^#/, ''), false);
  });
}

/* ── 초기화 ── */
(function init(){
  renderStoryList();
  var h = (location.hash || '').replace(/^#/, '');
  if(h) setTimeout(function(){ navTo(h, false); }, 0);

  /* 단독 열람일 때만 구글 번역 위젯을 직접 로드 (iframe 안에서는 부모가 주입) */
  if(!EMBED){
    var slot = document.createElement('div');
    slot.id = 'google_translate_element'; slot.style.display = 'none';
    document.body.appendChild(slot);
    var sc = document.createElement('script');
    sc.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    document.body.appendChild(sc);
  }
})();
</script>
</body>
</html>
