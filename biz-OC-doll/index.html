<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════
  ⚠ 파일명 안내 — 고치지 마세요

  로컬 작업용 파일명 : bizocdoll_index.html
  실제 배포 파일명   : index.html   (GitHub 업로드 시 이 이름으로)

  이 프로젝트 폴더 안의 다른 파일들이 참조하는 'index.html' 은
  배포 기준 이름이라 정상입니다. bizocdoll_index.html 로 바꾸면
  배포 후에 링크가 전부 깨집니다.

  (로컬에서 index.html 이 프로젝트마다 겹치는 걸 피하려고
   작업 파일에만 프로젝트 이름을 붙여 두는 방식입니다.)
  ══════════════════════════════════════════════════════════════
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>biz-OC-doll</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══ 공용 컴포넌트 스타일 (구 common.css — 이 파일 안으로 합침) ═══
   상단바 문의 버튼 · 언어 안내 각주 · 제작자 소개/문의 오버레이
   ※ story.html 에도 같은 블록이 있습니다. 한쪽 고치면 반대쪽도. */
#tb-contact-btn{display:flex;align-items:center;justify-content:center;width:30px;height:28px;padding:0;border:1px solid #e2e2e2;border-radius:6px;background:transparent;color:#5f5f5f;cursor:pointer;transition:all .12s;flex-shrink:0}
#tb-contact-btn:hover{background:#fafafa;color:#1a1a1a;border-color:#c6c6c6}

/* 번역 안내 각주 — 언어를 궁금해하는 바로 그 순간에만 보이게 */
.tb-lang-note{padding:10px 14px 11px;border-top:1px solid #ececec;background:#fafafa;font-size:10.5px;line-height:1.7;color:#8a8a8a;letter-spacing:-.01em}
.tb-lang-note b{color:#5f5f5f;font-weight:600}

/* ── 제작자 소개 · 비즈니스 문의 오버레이 (허브와 동일 컴포넌트) ── */
#contact-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
#contact-overlay.hidden{display:none}
.contact-card{position:relative;background:#fff;border:1px solid #e2e2e2;border-radius:14px;padding:28px 30px;max-width:440px;width:100%;box-shadow:0 12px 40px #00000026;font-family:var(--fn)}
.contact-close{position:absolute;top:14px;right:14px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #e2e2e2;border-radius:6px;color:#5f5f5f;cursor:pointer;transition:all .12s}
.contact-close:hover{background:#fafafa;border-color:#c6c6c6}
.contact-who{display:flex;align-items:center;gap:14px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid #ececec}
.contact-who-thumb{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid #e2e2e2;background:#fafafa}
.contact-who-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.contact-who-name{font-size:15px;font-weight:700;color:#111;letter-spacing:-.02em;margin-bottom:3px}
.contact-who-tag{font-size:12px;color:#5f5f5f;line-height:1.6}
.contact-eyebrow{font-size:10px;font-weight:600;letter-spacing:2px;color:#a0a0a0;text-transform:uppercase;margin-bottom:8px}
.contact-title{font-size:20px;font-weight:700;color:#111;letter-spacing:-.04em}
.contact-desc{font-size:13px;color:#5f5f5f;margin-top:8px;line-height:1.8}
.contact-mailrow{margin-top:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.contact-mailrow span.mail{font-size:13px;font-weight:600;color:#1a1a1a;font-family:'Inter',sans-serif}
.biq-copy-btn{background:transparent;border:1px solid #e2e2e2;border-radius:6px;padding:4px 7px;display:flex;align-items:center;gap:4px;font-family:var(--fn);font-size:11px;font-weight:500;color:#a0a0a0;cursor:pointer;transition:all .15s;flex-shrink:0}
.biq-copy-btn:hover{background:#fafafa;color:#1a1a1a;border-color:#c6c6c6}
</style>
<script src="../config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--sb:#fff;--sm:#fafafa;--bd:#e2e2e2;--bd2:#c6c6c6;
  --tx:#1a1a1a;--tx2:#5f5f5f;--tx3:#a0a0a0;
  --blue:#5a90b0;--blue-d:#4a7a98;
  --fn:'Inter','Noto Sans KR',-apple-system,sans-serif;
  --h-top:46px;--h-tab:44px;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--fn);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--fn);cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

#app{display:flex;flex-direction:column;height:100%}

/* ── 상단바 ── */
#topbar{
  height:var(--h-top);flex-shrink:0;background:var(--sb);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;padding:0 16px;
  transition:margin-top .26s ease;z-index:100;
}
#topbar.hidden{margin-top:calc(var(--h-top) * -1)}
.tb-back{background:transparent;border:none;color:var(--tx3);font-size:12px;padding:5px 8px;border-radius:6px;transition:all .12s;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tb-back:hover{background:var(--sm);color:var(--tx)}
.tb-sep{width:1px;height:14px;background:var(--bd);flex-shrink:0}
.diamond-i{position:relative;display:inline-block}
.diamond-i::after{content:'';position:absolute;top:-.18em;left:50%;transform:translateX(-50%) rotate(45deg);width:.18em;height:.18em;background:currentColor}
.diamond-o{position:relative;display:inline-block}
.diamond-o::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-55%) rotate(45deg);width:.18em;height:.18em;background:currentColor}
.tb-title{font-family:'Josefin Sans',sans-serif;font-weight:300;letter-spacing:.16em;font-size:14px;color:#4a5560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-mini{font-size:11px;color:var(--tx3);border:1px solid var(--bd);background:transparent;border-radius:6px;padding:5px 10px;transition:all .12s}
.tb-mini:hover{background:var(--sm);color:var(--tx)}
@media(max-width:520px){.tb-mini{display:none}}

/* ── 번역 뱃지 · 언어 드롭다운 ── */
#tl-badge{font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;border:1px solid;transition:opacity .2s,background .2s;opacity:0;pointer-events:none}
#tl-badge.deepl{background:#e8f0fe;color:#1a4c9e;border-color:#b5d4f4}
#tl-badge.google{background:#e8f7f2;color:#0a6e56;border-color:#9fe1cb}
#tl-badge.show{opacity:1}
#tb-lang-drop-btn{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx2);font-size:12px;font-weight:500;transition:all .12s;white-space:nowrap}
#tb-lang-drop-btn:hover{background:var(--sm);color:var(--tx)}
#tb-lang-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;width:280px;background:var(--sb);border:1px solid var(--bd);border-radius:10px;z-index:9999;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.12)}
@media(max-width:420px){
  #tb-lang-dropdown{width:min(280px,calc(100vw - 24px))}
  #tb-lang-drop-btn .tb-btn-txt{display:none}
}
/* 구글 번역 위젯 잔재 숨김 */
.goog-te-banner-frame,.skiptranslate{display:none !important}
body{top:0 !important}
#google_translate_element{display:none}

/* 스토리 리더 DeepL 바 */
#doll-tl-bar{display:none;justify-content:center;align-items:center;gap:6px;padding:8px 0 16px}
#doll-dl-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;font-size:11px;font-weight:600;border:1px solid #b5d4f4;border-radius:6px;background:#e8f0fe;color:#1a4c9e;transition:all .12s}
#doll-dl-btn.done{border-color:#93c5fd;background:#dbeafe;color:#1e40af;cursor:default}
#doll-dl-rebtn{display:none;align-items:center;gap:4px;padding:6px 10px;font-size:11px;font-weight:600;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx3);transition:all .12s}
#doll-dl-rebtn:hover{color:var(--tx);border-color:var(--bd2)}

/* ── 탭바 ── */
#tabbar{
  height:var(--h-tab);flex-shrink:0;background:var(--sb);border-bottom:1px solid var(--bd);
  display:flex;align-items:stretch;padding:0 12px;overflow-x:auto;overflow-y:hidden;
  white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:90;
  transition:margin-top .26s ease;
}
#tabbar.hidden{margin-top:calc(var(--h-tab) * -1)}
#tabbar::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:0 16px;background:transparent;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:500;color:var(--tx3);transition:color .12s,border-color .12s}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--blue-d);border-bottom-color:var(--blue-d);font-weight:700}

/* ── 패널 ── */
#stage{flex:1;position:relative;min-height:0;background:var(--bg);z-index:1;overflow:hidden}
.panel{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.panel.active{display:block}
.panel.tx-keep{display:block}
.panel iframe{width:100%;height:100%;border:none;display:block;background:var(--bg)}

.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:3;transition:opacity .25s}
.loading.gone{opacity:0;pointer-events:none}
.spin{width:22px;height:22px;border:2px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 당겨서 새로고침 ── */
#ptr{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50;transform:translateY(-56px)}
#ptr .ptr-ico{width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--blue);border-radius:50%}
#ptr.spin .ptr-ico{animation:sp .6s linear infinite}

@media(max-width:600px){
  :root{--h-tab:42px}
  #tabbar{padding:0 8px}
  .tab{padding:0 12px;font-size:12px}
}
</style>
</head>
<body>

<div id="app">

  <div id="topbar">
    <a class="tb-back" href="../index.html">← rrkt.biz</a>
    <div class="tb-sep"></div>
    <a class="tb-title" href="https://rrktbiz.github.io/rrkt.biz/biz-OC-doll" style="text-decoration:none;color:inherit">b<span class="diamond-i">&#x131;</span>z-OC-d<span class="diamond-o">o</span>ll</a>
    <div class="tb-right" style="position:relative"><!-- 아래 공용 블록이 채웁니다 --></div>
  </div>

  <div id="tabbar">
    <button class="tab active" data-tab="intro">소개</button>
    <button class="tab" data-tab="chars">캐릭터</button>
    <button class="tab" data-tab="story">스토리</button>
    <button class="tab" data-tab="event">이벤트</button>
  </div>

  <div id="stage">

    <div id="ptr"><div class="ptr-ico"></div></div>

    <div class="panel active" id="panel-intro"></div>

    <div class="panel" id="panel-chars"></div>

    <div class="panel" id="panel-story">
    </div>

    <div class="panel" id="panel-event"></div>

  </div>
</div>




<script>
/* ═══════════════════════════════════════════════════════════
   공용 UI + 번역 엔진  (구 common.js / tl.js — 이 파일 안으로 합침)

   ⚠ 같은 블록이 story.html 에도 들어 있습니다.
     특히 아래 두 가지는 index(부모) ↔ story(자식) 사이의 약속이라
     한쪽만 고치면 화면은 멀쩡한데 번역만 조용히 안 먹습니다.
       · postMessage 타입 문자열  'biz-tl-lang'
       · _injectGT / _setIframeLang 동작
     번역 관련을 건드리면 반드시 양쪽 다 같은 내용으로 맞추세요.

   ── 값만 바꿀 거면 바로 아래 BIZ.MAIL / PROFILE_IMG / WHO_* / TL_NOTE ──
   ═══════════════════════════════════════════════════════════ */

var BIZ = window.BIZ = {

  MAIL:        'rrkt.biz@proton.me',
  PROFILE_IMG: '../profile.png',
  WHO_NAME:    'rrkt.biz',
  WHO_TAG:     '스토리 / 캐릭터를 기반으로 IP로 확장 가능한 원작을 만듭니다.',


  /* 언어 드롭다운 하단 안내문 — ⚠ story.html 에도 같은 값이 있음. 한쪽 고치면 반대쪽도 */
  TL_NOTE:
    '이 페이지는 <b>Google 번역</b>으로 표시됩니다.<br>' +
    '번역이 어색하면 <b>DeepL</b>로 다시 번역할 수 있습니다.',

  /* ── 상단바 우측 ── */
  topbarRightHtml: function(){
    return `      <span id="tl-badge"></span>
      <button id="tb-contact-btn" onclick="openContactOverlay()" title="제작자 소개 · 비즈니스 문의" aria-label="제작자 소개 · 비즈니스 문의">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
      </button>
      <button id="tb-lang-drop-btn" onclick="tbLangToggle()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="flex-shrink:0"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="2.6" ry="6.5"/><path d="M1.5 6h13M1.5 10h13"/></svg>
        <span id="tb-lang-label" class="tb-btn-txt">Language</span>
        <span id="tb-lang-caret" class="tb-btn-txt" style="font-size:8px;transition:transform .15s;display:inline-block">&#9660;</span>
      </button>
      <div id="tb-lang-dropdown">
        <div style="padding:12px 14px 10px;border-bottom:1px solid var(--bd)">
          <div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px">Language</div>
          <input id="tb-lang-search" type="text" placeholder="Search language..." oninput="tbLangFilter()" style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;font-size:12px;background:var(--bg);color:var(--tx);outline:none;font-family:var(--fn)">
        </div>
        <div id="tb-lang-list" style="max-height:260px;overflow-y:auto"></div>
        <div class="tb-lang-note">${BIZ.TL_NOTE}</div>
      </div>`;
  },

  /* ── 문의 오버레이 ── */
  contactHtml: function(){
    return `<!-- ===== 제작자 소개 · 비즈니스 문의 ===== -->
<div id="contact-overlay" class="hidden" onclick="if(event.target===this)closeContactOverlay()">
  <div class="contact-card">
    <button class="contact-close" onclick="closeContactOverlay()" aria-label="닫기">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="contact-who">
      <div class="contact-who-thumb"><img src="${BIZ.PROFILE_IMG}" alt="${BIZ.WHO_NAME}" onerror="this.style.display='none'"></div>
      <div>
        <div class="contact-who-name">${BIZ.WHO_NAME}</div>
        <div class="contact-who-tag">${BIZ.WHO_TAG}</div>
      </div>
    </div>
    <div class="contact-eyebrow">Contact</div>
    <div class="contact-title">비즈니스 문의</div>
    <div class="contact-desc">제안서 또는 구체적인 협업 내용이 포함된 메일만 검토합니다.<br>응답까지 시간이 걸릴 수 있으며, 모든 문의에 회신하기 어려울 수 있습니다.</div>
    <div class="contact-mailrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
      <span class="mail">${BIZ.MAIL}</span>
      <button class="biq-copy-btn" onclick="biqCopyEmail(this)" title="복사">
        <svg class="biq-copy-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        <span class="biq-copy-txt">복사</span>
      </button>
    </div>
  </div>
</div>`;
  },

  openContact:  function(){ var o = document.getElementById('contact-overlay'); if(o) o.classList.remove('hidden'); },
  closeContact: function(){ var o = document.getElementById('contact-overlay'); if(o) o.classList.add('hidden'); },

  copyEmail: function(btn){
    navigator.clipboard.writeText(BIZ.MAIL).then(function(){
      var svg = btn.querySelector('.biq-copy-svg'), txt = btn.querySelector('.biq-copy-txt');
      if(svg) svg.outerHTML = '<svg class="biq-copy-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      if(txt) txt.textContent = '완료';
      btn.style.borderColor = '#bbf7d0'; btn.style.background = '#f0fdf4'; btn.style.color = '#22c55e';
      setTimeout(function(){
        var s2 = btn.querySelector('.biq-copy-svg');
        if(s2) s2.outerHTML = '<svg class="biq-copy-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
        var t2 = btn.querySelector('.biq-copy-txt');
        if(t2) t2.textContent = '복사';
        btn.style.borderColor = ''; btn.style.background = ''; btn.style.color = '';
      }, 1800);
    });
  },

  /* ── 초기 주입 ── */
  mount: function(){
    var tbr = document.querySelector('.tb-right');
    if(tbr && !tbr.children.length) tbr.innerHTML = BIZ.topbarRightHtml();
    if(!document.getElementById('contact-overlay'))
      document.body.insertAdjacentHTML('beforeend', BIZ.contactHtml());
  }
};

/* 기존 onclick / 기존 코드 호환 */
window.openContactOverlay  = BIZ.openContact;
window.closeContactOverlay = BIZ.closeContact;
window.biqCopyEmail        = BIZ.copyEmail;

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') BIZ.closeContact();
});

BIZ.mount();


/* ══ 번역 엔진 ══ */

var TL = window.TL = {
  lang:  'ko',
  hooks: [],
  onChange:   function(fn){ if(typeof fn === 'function') TL.hooks.push(fn); },
  badge:      function(engine){ _tlBadge(engine); },
  badgeReset: function(){ _tlBadgeReset(); },
  set:        function(lang){ setLang(lang); }
};

/* ── 번역 뱃지 ── */
function _tlBadge(engine){
  var el = document.getElementById('tl-badge'); if(!el) return;
  el.className = engine + ' show';
  el.textContent = (engine === 'deepl') ? 'DeepL' : 'Google';
}
function _tlBadgeReset(){
  var el = document.getElementById('tl-badge'); if(!el) return;
  el.className = ''; el.textContent = '';
}

/* ── Google Translate ── */
function googleTranslateElementInit(){
  new google.translate.TranslateElement({pageLanguage:'ko', autoDisplay:false}, 'google_translate_element');
}
function _tlGoogle(lang){
  _tlBadge('google');
  var sel = document.querySelector('.goog-te-combo');
  if(sel){ sel.value = lang; sel.dispatchEvent(new Event('change')); return; }
  /* 위젯 미로드 시 쿠키 방식 */
  document.cookie = 'googtrans=/ko/' + lang + ';path=/';
  document.cookie = 'googtrans=/ko/' + lang + ';path=/;domain=.' + location.hostname;
  location.reload();
}

/* ── iframe 탭에도 번역 적용 (같은 출처일 때만) ── */
function _injectGT(fr){
  try{
    var d = fr.contentDocument, w = fr.contentWindow;
    if(!d || !w || w.__gtInjected) return;
    w.__gtInjected = true;
    var slot = d.createElement('div');
    slot.id = 'google_translate_element';
    slot.style.display = 'none';
    d.body.appendChild(slot);
    w.googleTranslateElementInit = function(){
      new w.google.translate.TranslateElement({pageLanguage:'ko', autoDisplay:false}, 'google_translate_element');
    };
    var sc = d.createElement('script');
    sc.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    d.body.appendChild(sc);
  }catch(e){}
}
function _setIframeLang(fr, lang, tries){
  tries = tries || 0;
  try{
    var d = fr.contentDocument; if(!d) return;
    var sel = d.querySelector('.goog-te-combo');
    if(sel){ sel.value = lang; sel.dispatchEvent(new Event('change')); return; }
  }catch(e){ return; }
  if(tries < 20) setTimeout(function(){ _setIframeLang(fr, lang, tries + 1); }, 350);
}
function _applyLangToIframes(lang){
  document.querySelectorAll('.panel iframe').forEach(function(fr){
    if(lang === 'ko') return;
    _injectGT(fr);
    _setIframeLang(fr, lang);
    /* 자체 tl.js 를 가진 하위 페이지(story.html 등)에 언어를 알려줌 */
    try{ fr.contentWindow.postMessage({type:'biz-tl-lang', lang:lang}, '*'); }catch(e){}
  });
}
window._applyLangToIframes = _applyLangToIframes;

/* 부모 프레임이 언어를 바꿨을 때 — 구글 위젯은 부모가 이미 주입하므로 상태만 맞춘다 */
window.addEventListener('message', function(ev){
  var d = ev.data;
  if(!d || d.type !== 'biz-tl-lang' || d.lang === TL.lang) return;
  TL.lang = d.lang;
  TL.hooks.forEach(function(fn){ try{ fn(d.lang); }catch(e){ console.warn('[TL hook]', e); } });
  _tlBadge('google');
});

/* ── 언어 전환 진입점 ── */
function setLang(lang){
  TL.lang = lang;

  if(lang === 'ko'){
    document.cookie = 'googtrans=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
    document.cookie = 'googtrans=;path=/;domain=.' + location.hostname + ';expires=Thu, 01 Jan 1970 00:00:00 GMT';
    location.reload();
    return;
  }

  /* 페이지별 훅 — 스토리 본문 DeepL 등 (TL.onChange 로 등록) */
  TL.hooks.forEach(function(fn){
    try{ fn(lang); }catch(e){ console.warn('[TL hook]', e); }
  });

  _tlGoogle(lang);
  _applyLangToIframes(lang);
}
window.setLang = setLang;
window.googleTranslateElementInit = googleTranslateElementInit;

<script>
/* ══════════════════════════════════════════════════
   biz-OC-doll SPA
   - 탭 전환·에피소드 읽기 모두 새로고침 없음
   - 소개/캐릭터/투표/아카이브/이벤트 = 기존 파일 iframe 지연 로드
   - 스토리 = story_editor.json 직접 렌더 (네이티브)
   ══════════════════════════════════════════════════ */

var TABS = {
  intro:   { src:'doll_intro.html'               },
  chars:   { src:'doll_charlist.html'            },
  story:   { src:'story.html'                    },
  event:   { src:'event.html'                    }
};
var DEFAULT_TAB = 'intro';
var current = null;



/* ── 라우팅 ──
   #/chars        캐릭터 목록
   #/chars/042    042번 캐릭터 (딥링크)
   #/story        스토리 목록
   #/story/3      3화
   #/story/world  세계관

   iframe 안쪽 주소는 주소창에 안 나옵니다.
   그래서 '지금 뭘 보고 있는지'를 여기서 대신 적어 줍니다.
   ── */
var SUB_TABS = { story:true, chars:true };

function parseHash(){
  var raw = (location.hash || '').replace(/^#\/?/, '');
  var parts = raw.split('/');
  var tab = TABS[parts[0]] ? parts[0] : DEFAULT_TAB;
  var sub = (SUB_TABS[tab] && parts[1] !== undefined) ? decodeURIComponent(parts[1]) : '';
  return { tab: tab, sub: sub };
}

function go(tab, push){
  if(!TABS[tab]) tab = DEFAULT_TAB;
  document.querySelectorAll('.tab').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.toggle('active', p.id === 'panel-' + tab);
  });
  var changed = (tab !== current);
  current = tab;
  if(push !== false && location.hash !== '#/' + tab){
    history.pushState(null, '', '#/' + tab);
  }
  setBarsHidden(false);
  if(changed) mount(tab);
  else if(SUB_TABS[tab] && push !== false) frameNav(tab, '');   /* 같은 탭 재클릭 = 목록으로 */

  var btn = document.querySelector('.tab[data-tab="' + tab + '"]');
  if(btn && btn.scrollIntoView) btn.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
}

function mount(tab){
  var cfg = TABS[tab];
  var panel = document.getElementById('panel-' + tab);
  if(!cfg || !panel) return;

  if(panel.dataset.mounted === '1') return;
  panel.dataset.mounted = '1';

  var load = document.createElement('div');
  load.className = 'loading';
  load.innerHTML = '<div class="spin"></div>';
  panel.appendChild(load);

  var fr = document.createElement('iframe');
  fr.src = cfg.src + (SUB_TABS[tab] ? subHash(tab) : '');
  fr.title = tab;
  fr.addEventListener('load', function(){
    load.classList.add('gone');
    setTimeout(function(){ if(load.parentNode) load.parentNode.removeChild(load); }, 300);
    if(tab !== 'story') hookScroll(fr.contentWindow, fr.contentDocument);  /* story.html 은 자체 처리 후 postMessage */
    hookSwipe(fr.contentDocument);
    hookPTR(fr.contentDocument, function(){
      var d = fr.contentDocument;
      return d ? (d.scrollingElement || d.documentElement) : null;
    });
    if(TL.lang !== 'ko') _applyLangToIframes(TL.lang);                      /* 늦게 뜬 탭에도 현재 언어 적용 */
  });
  panel.appendChild(fr);
}

/* ── 상단바 자동 숨김 (상단바 + 탭바 + 리더 상단바 모두) ── */
var _barsHidden = false;
function setBarsHidden(hide){
  if(_barsHidden === hide) return;
  _barsHidden = hide;
  var top = document.getElementById('topbar');
  var tabs = document.getElementById('tabbar');
  if(top)  top.classList.toggle('hidden', hide);
  if(tabs) tabs.classList.toggle('hidden', hide);
}

/* ── 자식 프레임과의 다리 ── */
function subHash(tab){
  var h = parseHash();
  if(h.tab !== tab || !h.sub) return '';
  return '#' + encodeURIComponent(h.sub);
}
function frameOf(tab){ return document.querySelector('#panel-' + tab + ' iframe'); }
function frameNav(tab, route){
  var fr = frameOf(tab);
  if(fr && fr.contentWindow) try{ fr.contentWindow.postMessage({type:'biz-doll-nav', tab:tab, route:route}, '*'); }catch(e){}
}
function storyNav(route){ frameNav('story', route); }
function _onScrollY(y, lastRef){
  if(window.innerWidth > 768){ setBarsHidden(false); lastRef.y = 0; return; }
  if(y > lastRef.y && y > 70)      setBarsHidden(true);
  else if(y < lastRef.y - 10)      setBarsHidden(false);
  lastRef.y = y <= 0 ? 0 : y;
}
function hookScroll(win, doc){
  try{
    if(!win || !doc) return;
    var ref = {y:0};
    win.addEventListener('scroll', function(){
      _onScrollY(win.scrollY || doc.documentElement.scrollTop || 0, ref);
    }, {passive:true});
  }catch(e){ /* file:// 로 열면 브라우저가 막습니다 */ }
}
function hookPanelScroll(panel){
  var ref = {y:0};
  panel.addEventListener('scroll', function(){
    _onScrollY(panel.scrollTop, ref);
  }, {passive:true});
}

/* ── 탭 순서 (탭바 DOM 기준으로 자동 동기화) ── */
function tabOrder(){
  return [].slice.call(document.querySelectorAll('#tabbar .tab'))
           .map(function(b){ return b.dataset.tab; });
}

/* ── 모바일 한정: 캐러셀 방식 탭 전환 ── */
var _txBusy = false;
function goAnimated(tab){
  if(!TABS[tab]) tab = DEFAULT_TAB;

  var order   = tabOrder();
  var fromIdx = order.indexOf(current);
  var toIdx   = order.indexOf(tab);

  var isMobile = window.matchMedia('(max-width: 768px)').matches;
  var reduce   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canAnim  = isMobile && !reduce && !_txBusy
                 && typeof document.body.animate === 'function'
                 && fromIdx !== -1 && toIdx !== -1 && toIdx !== fromIdx;

  if(!canAnim){ go(tab); return; }

  var dir = (toIdx > fromIdx) ? 1 : -1;
  var fromPanel = document.getElementById('panel-' + current);
  if(!fromPanel){ go(tab); return; }

  _txBusy = true;
  fromPanel.classList.add('tx-keep');
  go(tab);

  var toPanel = document.getElementById('panel-' + tab);
  var DUR = 320, EASE = 'cubic-bezier(.22,1,.36,1)';

  function cleanup(){
    fromPanel.getAnimations().forEach(function(a){ a.cancel(); });
    fromPanel.classList.remove('tx-keep');
    _txBusy = false;
  }

  if(toPanel){
    toPanel.animate(
      [{transform:'translateX(' + (100 * dir) + '%)'},{transform:'translateX(0)'}],
      {duration:DUR, easing:EASE}
    );
  }
  var a = fromPanel.animate(
    [{transform:'translateX(0)'},{transform:'translateX(' + (-100 * dir) + '%)'}],
    {duration:DUR, easing:EASE, fill:'forwards'}
  );
  a.onfinish = cleanup;
  setTimeout(function(){ if(_txBusy) cleanup(); }, DUR + 150);
}

/* ── 좌우 스와이프로 탭 이동 (모바일) ── */
function swipeStep(k){
  var order = tabOrder();
  var i = order.indexOf(current);
  if(i === -1) return;
  var n = i + k;
  if(n < 0 || n >= order.length) return;
  goAnimated(order[n]);
}
function hookSwipe(doc){
  try{
    if(!doc || doc._bizSwipeHooked) return;
    doc._bizSwipeHooked = true;
    var sx = 0, sy = 0, on = false;
    var THRESHOLD = 60, MAX_VERTICAL = 60;

    doc.addEventListener('touchstart', function(e){
      if(!window.matchMedia('(max-width: 768px)').matches){ on = false; return; }
      if(e.touches.length !== 1){ on = false; return; }
      if(e.target.closest && e.target.closest('#tabbar')){ on = false; return; }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      on = true;
    }, {passive:true});

    doc.addEventListener('touchend', function(e){
      if(!on) return;
      on = false;
      var dx = e.changedTouches[0].clientX - sx;
      var dy = e.changedTouches[0].clientY - sy;
      if(Math.abs(dx) < THRESHOLD || Math.abs(dy) > MAX_VERTICAL) return;
      swipeStep(dx < 0 ? 1 : -1);
    }, {passive:true});
  }catch(e){ /* file:// 로 열면 브라우저가 막습니다 */ }
}

/* ── 당겨서 새로고침 (iframe 안쪽 스크롤까지 감지) ── */
var PTR_H = 56, PTR_THRESH = 58;
var ptrEl, ptrIco, _ptrDist = 0, _ptrRefreshing = false;
function ptrInit(){
  ptrEl = document.getElementById('ptr');
  ptrIco = ptrEl ? ptrEl.querySelector('.ptr-ico') : null;
}
function setPTR(dist, animate){
  if(_ptrRefreshing || !ptrEl) return;
  _ptrDist = dist;
  ptrEl.style.transition = animate ? 'transform .18s ease' : 'none';
  ptrEl.style.transform = 'translateY(' + (dist - PTR_H) + 'px)';
  if(ptrIco) ptrIco.style.transform = 'rotate(' + Math.min(dist * 3, 360) + 'deg)';
}
function triggerPTR(){
  if(_ptrRefreshing) return;
  _ptrRefreshing = true;
  if(ptrEl){
    ptrEl.style.transition = 'transform .15s ease';
    ptrEl.style.transform = 'translateY(0)';
    ptrEl.classList.add('spin');
  }
  setTimeout(function(){ location.reload(); }, 280);
}
function hookPTR(doc, getScrollEl){
  try{
    if(!doc || doc._bizPtrHooked) return;
    doc._bizPtrHooked = true;
    var sy = 0, active = false, pulling = false;

    doc.addEventListener('touchstart', function(e){
      if(_ptrRefreshing || e.touches.length !== 1){ active = false; return; }
      if(window.innerWidth > 768){ active = false; return; }
      var el = getScrollEl();
      var top = el ? (el.scrollTop || 0) : 0;
      if(top > 0){ active = false; return; }
      sy = e.touches[0].clientY;
      active = true;
      pulling = false;
    }, {passive:true});

    doc.addEventListener('touchmove', function(e){
      if(!active || _ptrRefreshing) return;
      var dy = e.touches[0].clientY - sy;
      if(dy <= 0){ if(pulling) setPTR(0, false); pulling = false; return; }
      var el = getScrollEl();
      var top = el ? (el.scrollTop || 0) : 0;
      if(top > 0){ active = false; setPTR(0, false); return; }
      pulling = true;
      setPTR(Math.min(dy * 0.5, PTR_H + 24), false);
    }, {passive:true});

    doc.addEventListener('touchend', function(){
      if(!active) return;
      active = false;
      if(pulling && _ptrDist >= PTR_THRESH){ triggerPTR(); }
      else{ setPTR(0, true); }
      pulling = false;
    }, {passive:true});

    doc.addEventListener('touchcancel', function(){
      active = false; pulling = false;
      if(!_ptrRefreshing) setPTR(0, true);
    }, {passive:true});
  }catch(e){ /* file:// 로 열면 브라우저가 막습니다 */ }
}

/* ── 초기화 ── */
ptrInit();
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){ goAnimated(b.dataset.tab); });
});
hookSwipe(document);
hookPTR(document, function(){ return document.querySelector('.panel.active'); });

window.addEventListener('popstate', function(){
  var h = parseHash();
  go(h.tab, false);
  if(SUB_TABS[h.tab]) frameNav(h.tab, h.sub);
});

window.addEventListener('resize', function(){
  if(window.innerWidth > 768) setBarsHidden(false);
});

/* ── iframe(doll_intro) → 부모 탭 전환 요청 ── */
window.addEventListener('message', function(ev){
  var d = ev.data;
  if(!d) return;

  if(d.type === 'biz-doll-go'){
    if(d.target === 'worldview'){
      go('story');
      setTimeout(function(){ storyNav('world'); }, 80);
    } else if(d.target === 'chars'){
      go('chars');
    }
    return;
  }

  /* 자식 프레임이 알려주는 현재 위치를 주소창에 반영
     (story.html 은 tab 을 안 보내던 옛 버전이라 기본값을 story 로 둡니다) */
  if(d.type === 'biz-doll-route'){
    var rtab = TABS[d.tab] ? d.tab : 'story';
    var h = (!d.route) ? '#/' + rtab : '#/' + rtab + '/' + encodeURIComponent(d.route);
    if(location.hash !== h) history.pushState(null, '', h);
    return;
  }

  /* story.html 스크롤에 맞춰 부모 상단바도 숨김 */
  if(d.type === 'biz-doll-bars'){ setBarsHidden(!!d.hide); return; }
});

document.querySelectorAll('.panel').forEach(hookPanelScroll);

(function init(){
  var h = parseHash();
  current = null;
  go(h.tab, false);   /* 딥링크는 mount() 가 자식 파일 해시로 넘깁니다 */
  if(!location.hash) history.replaceState(null, '', '#/' + h.tab);
})();
</script>
