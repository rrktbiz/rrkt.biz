<!-- ══════════════════════════════════════════════════════════════
     biz-OC-doll — character name tag (for link previews)

     ── Why this file exists ──
     Inside the site, a character's address ends in #/chars/000.
     Everything after # never reaches the server, so pasting that
     address into social media shows the site's front card, not the character.

     This "name tag" fixes that. Visiting .../c/000.html
       → the preview shows that character's picture
       → people are sent straight to that character inside the site

     ── Making a new name tag (about 20 seconds) ──
     ① Copy this file and save it under the number (e.g. 042.html)
     ② Use Replace All in your editor: change this file's number to 042
        (7 places change at once:
          title / og:title / og:image / og:url /
          location.replace in the script / body link address / body link text)
        This note never writes the number itself,
        so Replace All won't break it.
     ③ Upload images/og/042.png (1200 x 630)

     Past about 50 characters, generate these with a script instead of by hand.

     ── About the picture ──
     Some apps crop the middle into a square.
     Keep the face inside the central 630 x 630 and leave only background on the sides.

     ── No picture yet? ──
     The picture area is just empty; title and description still show.
     ══════════════════════════════════════════════════════════════ -->

<title>BIZOCDOLL001</title>

<!-- Tab icon — the gem (same as the main page).
     This is the tab people actually see after tapping a shared link. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M8 3H24L31 13L16 31L1 13Z' fill='%23cfe6f4' stroke='%231a1a1a' stroke-width='1.2' stroke-linejoin='round'/><g stroke='%231a1a1a' stroke-width='0.9' fill='none' stroke-linejoin='round' opacity='0.6'><path d='M1 13H31'/><path d='M8 3L11.5 13L16 31L20.5 13L24 3'/></g></svg>">
