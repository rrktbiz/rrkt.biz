<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>rrkt.biz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='white' stroke='%23111' stroke-width='1.5'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23111'>B</text></svg>">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500&family=Nanum+Myeongjo:wght@400;700;800&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--sb:#fff;--sm:#fafafa;--bd:#e2e2e2;--bd2:#c6c6c6;
  --tx:#1a1a1a;--tx2:#5f5f5f;--tx3:#a0a0a0;
  --fn:'Inter','Noto Sans KR',sans-serif;
  --sm-w:240px;
}
html{height:100%;overflow:hidden;font-size:14px}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--fn);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
button{font-family:var(--fn);cursor:pointer}a{text-decoration:none}
/* ── HOME HEADER CONTROLS ── */
.topbar-right{display:flex;align-items:center;gap:8px}
#tl-badge{font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;border:1px solid;transition:opacity .2s,background .2s;opacity:0;pointer-events:none}
#tl-badge.deepl{background:#e8f0fe;color:#1a4c9e;border-color:#b5d4f4}
#tl-badge.google{background:#e8f7f2;color:#0a6e56;border-color:#9fe1cb}
#tl-badge.jp{background:#fdeef2;color:#9e2b50;border-color:#f4c2d2}
#tl-badge.show{opacity:1}
#topbar-cal-btn{font-size:12px;padding:5px 10px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx2);display:flex;align-items:center;gap:5px;transition:all .12s}
#topbar-cal-btn:hover{background:var(--bg);color:var(--tx)}

/* ── FLOATING NAV ── */

/* Sub panel */


#sm-inner{flex:1;overflow-y:auto;min-width:0}

/* Nav items */

/* Sub panel header */

/* Intro/char links */
.vol-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:13px 11px}
.vol-card{cursor:pointer;transition:transform .14s ease}
.vol-card:hover{transform:translateY(-2px)}
.vol-thumb{aspect-ratio:3/4;border-radius:6px;border:1px solid var(--bd);position:relative;overflow:hidden;margin-bottom:7px}
.vol-thumb.yt{aspect-ratio:16/9}
.vol-badge{position:absolute;top:6px;right:6px;font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px}
.vol-type-chip{position:absolute;top:6px;left:6px;font-size:8px;font-weight:600;padding:2px 5px;border-radius:3px;background:#00000060;color:#fff}
.vol-num{position:absolute;bottom:0;left:0;right:0;padding:20px 8px 7px;background:linear-gradient(to top,#00000075,transparent);font-size:9px;font-weight:600;color:#ffffffb0}
.vol-title{font-size:11px;font-weight:500;color:var(--tx);line-height:1.4;margin-bottom:4px}
.vol-tags{display:none}
.vol-tag{display:none}
.doll-banners{display:flex;flex-direction:column;gap:8px;padding:12px 11px}
.doll-banner{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 16px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer;transition:background .12s;min-height:80px}
.doll-banner:hover{background:var(--bg)}
.doll-banner-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.doll-banner-label{font-size:14px;font-weight:700;color:var(--tx)}
.doll-banner-count{font-size:11px;color:var(--tx3);margin-top:auto}

/* ── CONTENT ── */
#content{display:block;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
body.nav-pinned #nav-backdrop{display:none!important}

/* ── HERO ── */
.home-hero{background:var(--sb);border:1px solid #fff;border-radius:12px;overflow:hidden;margin-bottom:18px;position:relative}
.home-hero-inner{padding:22px 24px 20px}
.home-hero-top{display:flex;align-items:flex-start;gap:18px;margin-bottom:16px}
.home-hero-info{flex:1;min-width:0}
.home-hero-name{font-size:20px;font-weight:700;color:#111;letter-spacing:-.04em;margin-bottom:4px}
.home-hero-tagline{font-size:12px;color:var(--tx2);line-height:1.65}
.home-hero-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.home-hero-tag{font-size:10px;padding:2px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--bd);color:var(--tx3)}
.home-hero-tag.acc{background:#fff5f5;border-color:#ffd0d0;color:#c0392b}
.home-hero-divider{border:none;border-top:1px solid var(--bd);margin:0 0 14px}
.home-hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:14px}
.home-hero-stat{background:var(--bg);padding:12px 0;text-align:center}
.home-hero-stat-n{font-size:18px;font-weight:700;color:var(--tx);letter-spacing:-.04em;line-height:1}
.home-hero-stat-l{font-size:9px;color:var(--tx3);margin-top:3px;font-weight:500}
.home-hero-markets{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.home-hero-market-lbl{font-size:10px;color:var(--tx3);margin-right:2px}
.home-hero-market{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid}
.home-hero-cta{display:flex;gap:8px}
.home-hero-btn-p{flex:1;background:#111;color:#fff;border:none;border-radius:7px;padding:9px 0;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:background .12s}
.home-hero-btn-p:hover{background:#333}
.home-hero-btn-s{flex:1;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:9px 0;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--fn);transition:all .12s}
.home-hero-btn-s:hover{border-color:var(--bd2);background:var(--bg)}

/* ── HOME ── */
.home-page{padding:40px 18px 20px;max-width:950px;margin:0 auto}
.home-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.home-logo-big{font-size:28px;font-weight:700;color:#111;letter-spacing:-.04em;padding-left:10px;transition:opacity .12s}
.home-logo-big:hover{opacity:.65}
.home-clock{font-size:28px;font-weight:300;color:var(--tx2);letter-spacing:.02em;font-variant-numeric:tabular-nums}
/* 2-column: recent-work | right-panel (status + visitors) */
.home-body{display:grid;grid-template-columns:1fr 240px;gap:18px;align-items:start}
/* ── About card (left) ── */
.home-about-card{background:var(--sb);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 12px #0000000a}
.home-about-card-hd{padding:8px 12px;border-bottom:1px solid var(--bd);font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase}
.home-about-avatar-wrap{width:100%;padding:16px;display:flex;justify-content:center;background:var(--bg)}
.home-about-popart{width:160px;height:160px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 4px 20px #0003,0 0 0 3px #111}
.home-about-info{padding:12px 14px 14px}
.home-about-name{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:5px;text-align:center}
.home-about-bio{font-size:10px;color:var(--tx3);line-height:1.6;text-align:center}
.home-about-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.home-about-tag{font-size:8px;padding:2px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);color:var(--tx3)}
/* ── Recent work panel (center) ── */
.home-recent-panel{background:var(--sb);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px #0000000a}
.home-recent-panel-hd{padding:12px 16px 11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.home-recent-panel-lbl{font-size:12px;font-weight:700;letter-spacing:0.5px;color:var(--tx2);text-transform:none}
.home-recent-body{padding:8px}
.home-recent-grid{display:grid;grid-template-columns:1fr;gap:4px}
.home-r-item{padding:6px 12px;background:var(--bg);border:1px solid var(--bd);border-left-width:3px;border-radius:7px;cursor:default;transition:all .12s}
.home-r-item.is-done{cursor:pointer}
.home-r-item.is-done:hover{background:color-mix(in srgb,var(--bd) 30%,var(--bg));transform:translateX(2px)}
.home-r-top{display:flex;justify-content:space-between;margin-bottom:3px;align-items:center}
.home-r-proj{font-size:11px;font-weight:500}.home-r-date{font-size:10px;color:var(--tx3)}
.home-r-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.home-r-title{font-size:13px;font-weight:400;color:var(--tx3);line-height:1.4}
.home-r-status{font-size:9px;font-weight:600;padding:1px 6px;border-radius:3px;display:inline-block;flex-shrink:0}
.home-r-status.done{background:#ffe4e4;color:#c0392b}
.home-r-item.is-wip .home-r-proj{color:#bbb!important}
.home-r-item.is-wip .home-r-date{color:#bbb}
.home-r-item.is-wip .home-r-title{color:#bbb}
.home-r-item.is-done .home-r-title{color:#1a1a1a;font-weight:500}
.home-r-reltime{font-size:9px;color:var(--tx3);margin-left:3px}
.home-r-status.wip{background:#fff9e0;color:#d4a017}
.home-r-status.plan{background:var(--bg);color:var(--tx3);border:1px solid var(--bd)}
.home-r-empty{padding:28px;text-align:center;font-size:11px;color:var(--tx3)}
/* 홈 Project Report 카드 클릭 가능 */
.home-proj-card{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease;position:relative}
.home-proj-card .proj-thumb-img{transition:transform .3s ease}
.home-proj-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.10);z-index:2}
.home-proj-card:hover .proj-thumb-img{transform:scale(1.04)}
.home-proj-card:hover .proj-illust-overlay::after{content:"소개글 보기 →";position:absolute;top:10px;right:10px;font-size:9px;font-weight:600;letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.42);padding:3px 8px;border-radius:20px;backdrop-filter:blur(2px)}
/* ── Right column ── */
.home-right{display:flex;flex-direction:column;gap:14px}
.home-mini-cal{background:var(--sb);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.hmc-head{padding:10px 14px 8px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.hmc-month{font-size:11px;font-weight:700;color:var(--tx)}
.hmc-nav{display:flex;gap:2px}
.hmc-btn{background:transparent;border:none;color:var(--tx3);font-size:13px;padding:1px 5px;line-height:1}
.hmc-btn:hover{color:var(--tx)}
.hmc-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 8px 8px;gap:1px}
.hmc-dn{text-align:center;font-size:8px;font-weight:600;color:var(--tx3);padding:3px 0}
.hmc-dn.sun{color:#d04040}.hmc-dn.sat{color:#4065c0}
.hmc-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;gap:2px;font-size:9px;color:var(--tx3)}
.hmc-cell.has-w{cursor:pointer;color:var(--tx)}
.hmc-cell.has-w:hover{background:var(--bg)}
.hmc-cell.today{font-weight:800;color:#fff}
.hmc-cell.today span:first-child{background:#3558c0;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.hmc-cell.sun-c{color:#c03030}.hmc-cell.sat-c{color:#3a5cb0}
.hmc-dot{width:4px;height:4px;border-radius:50%}
.home-widget{background:var(--sb);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.hw-label{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--tx3);text-transform:uppercase;margin-bottom:10px}
.hw-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}
.hw-stat:last-child{border-bottom:none}
.hw-stat-l{font-size:11px;color:var(--tx2)}.hw-stat-n{font-size:13px;font-weight:700;color:var(--tx)}
.home-twitter-btn{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#000;color:#fff;border-radius:10px;border:none;font-size:12px;font-weight:500;cursor:pointer;width:100%;justify-content:center}
.home-twitter-btn:hover{background:#1a1a1a}
/* ── FOCUS WIDGET ── */
.focus-widget-inner{padding:12px 14px 14px}
.focus-widget-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.focus-widget-lbl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--tx3);text-transform:uppercase}
.focus-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fff4e0;color:#c47a0a;border:1px solid #ffe0a0;white-space:nowrap;flex-shrink:0}
.focus-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.focus-row:last-child{margin-bottom:0}
.focus-lbl{font-size:11px;color:var(--tx2);width:74px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focus-bar-wrap{flex:1;background:var(--bd);border-radius:3px;height:5px;overflow:hidden}
.focus-bar{height:5px;border-radius:3px;transition:width .3s ease}
.focus-cnt{min-width:14px;text-align:right;font-size:12px;color:var(--tx3)}
/* ── LAST UPDATE WIDGET ── */
.last-update-widget{background:var(--sb);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.last-update-hd{padding:8px 12px;border-bottom:1px solid var(--bd);font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase}
.last-update-body{padding:14px 14px 16px}
.last-update-num-row{display:flex;align-items:baseline;gap:4px;margin-bottom:8px}
.last-update-num{font-size:40px;font-weight:300;color:var(--tx);line-height:1;letter-spacing:-0.04em}
.last-update-unit{font-size:14px;color:var(--tx2)}
.last-update-dot-row{display:flex;align-items:center;gap:6px}
.last-update-dot{width:5px;height:5px;border-radius:50%;background:var(--bd2);flex-shrink:0}
.last-update-date{font-size:11px;color:var(--tx3)}
.eval-chip{font-size:9px;font-weight:600;padding:2px 7px;border-radius:10px;background:#fff;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
/* ── HOME UPDATES CARD ── */
.home-fc{position:relative;overflow:hidden}
.home-fc-sep{height:1px;background:var(--bd);margin:0 0 12px}
.home-fc-list-hd{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase;margin-bottom:8px}
.home-fc-li{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;transition:all .12s;border-left:3px solid transparent;border-radius:0}
.home-fc-li:hover{background:var(--bg);padding-left:15px}
.home-fc-li-last{border-bottom:none}
.home-fc-li-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.home-fc-li-series{font-size:11px;color:var(--tx3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.home-fc-li-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.home-fc-li-date{font-size:11px;color:var(--tx3)}
.home-fc-li-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;background:#ffe4e4;color:#c0392b}
.home-fc-li-title{font-size:14px;font-weight:500;color:var(--tx);line-height:1.4}
.home-fc-wip-sep{height:1px;background:var(--bd);margin:6px 0 12px}
.home-fc-wip-hd{display:flex;justify-content:space-between;margin-bottom:8px}
.home-fc-wip-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase}
.home-fc-wip-hint{font-size:9px;color:var(--tx3)}
.home-fc-wi{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--bd)}
.home-fc-wi:last-of-type{border-bottom:none}
.home-fc-wi-name{font-size:12px;color:var(--tx2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-fc-wi-ep{font-size:12px;color:var(--tx3);flex-shrink:0}
.home-fc-wi-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;background:#fff9e0;color:#d4a017;flex-shrink:0}

/* ── HOME WIP SIMPLE LIST ── */
.home-r-empty{padding:28px;text-align:center;font-size:11px;color:var(--tx3)}

/* ── HOME AUTHOR NOTE ── */
.home-author-note{background:var(--sb);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.home-author-note-hd{padding:7px 12px;border-bottom:1px solid var(--bd);font-size:9px;font-weight:700;letter-spacing:1px;color:var(--tx3);text-transform:uppercase}
.home-author-note-body{padding:12px 14px}
.home-author-note-text{font-size:12px;color:var(--tx2);line-height:1.75}
.home-author-note-date{font-size:9px;color:var(--tx3);margin-top:8px}

/* ── HOME TRANSLATION NOTICE ── */
.home-trans-notice{
  box-shadow:0 2px 12px #0000000a;
  background:var(--sb);border:1px solid var(--bd);border-radius:10px;
  overflow:hidden;margin-bottom:0;
}
.home-trans-notice.notice-collapsed{
  background:transparent;border-color:transparent;
}
.home-trans-notice-wrap{position:relative;margin-bottom:18px}
.home-notice-toggle{
  position:absolute;top:-11px;right:14px;z-index:2;
  width:22px;height:22px;border-radius:50%;
  background:var(--sb);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s,border-color .12s;
  box-shadow:0 1px 4px #0000000f;
  overflow:hidden;white-space:nowrap;
}
.home-notice-toggle:hover{background:var(--bg);border-color:var(--bd2)}
.home-notice-toggle svg{display:block;flex-shrink:0}
.home-notice-toggle.expanded{
  width:auto;height:auto;border-radius:6px;
  padding:6px 12px;gap:6px;font-size:12px;font-weight:500;
  color:var(--tx);top:0;
}
.home-notice-toggle .notice-btn-label{
  display:none;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--tx);
}
.home-notice-toggle.expanded .notice-btn-label{display:flex}
.notice-btn-div{color:var(--bd2);font-weight:300;font-size:11px}
.notice-btn-icons{display:none;align-items:center;gap:5px;font-size:14px;line-height:1}
@media(max-width:480px){
  .home-notice-toggle.expanded .notice-btn-label{display:none}
  .home-notice-toggle.expanded .notice-btn-icons{display:flex}
}
.home-notice-row{display:flex;align-items:flex-start;gap:14px;padding:16px 20px}
.home-notice-sep{height:1px;background:var(--bd);margin:0}
.home-trans-icon{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px}
.home-trans-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.home-trans-title{font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--tx3);text-transform:uppercase}
.home-trans-body{font-size:13px;color:#2a2a3a;line-height:1.8;margin:0}
.home-trans-body strong{font-weight:700;color:#1a1a1a}
/* ── COPYRIGHT NOTICE ── */
.home-copy-notice{display:none}
.home-copy-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.home-copy-title{font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--tx3);text-transform:uppercase}
.home-copy-body{font-size:13px;color:#2a2a3a;line-height:1.8;margin:0}
.home-copy-links{display:flex;gap:10px;margin-top:5px;flex-wrap:wrap}
.home-copy-link{font-size:11px;color:var(--tx2);text-decoration:none;border-bottom:1px solid var(--bd2);padding-bottom:1px;transition:color .12s}
.home-copy-link:hover{color:var(--tx)}
#lang-detect-banner{
  display:none;align-items:center;gap:12px;
  background:#e8f0fe;border:1px solid #b5d4f4;border-radius:10px;
  padding:12px 16px;margin-bottom:12px;
}
#lang-detect-banner .ldb-text{flex:1;font-size:16px;color:#1a3a6e;line-height:1.6}
#lang-detect-banner .ldb-btns{display:flex;gap:6px;flex-shrink:0}
#lang-detect-banner .ldb-yes{font-size:13px;font-weight:600;padding:5px 12px;border-radius:6px;border:none;background:#1a4c9e;color:#fff;cursor:pointer;transition:background .12s}
#lang-detect-banner .ldb-yes:hover{background:#123978}
#lang-detect-banner .ldb-no{font-size:13px;font-weight:500;padding:5px 10px;border-radius:6px;border:1px solid #b5d4f4;background:transparent;color:#1a4c9e;cursor:pointer;transition:all .12s}
#lang-detect-banner .ldb-no:hover{background:#d0e3fc}

/* ── HOME VISITOR COUNTRY WIDGET ── */
.vis-widget{background:var(--sb);border:1px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:0 2px 12px #0000000a}
.vis-hd{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.vis-hd-lbl{font-size:9px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--tx3)}
.vis-hd-total{font-size:13px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.vis-list{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.vis-row{display:grid;grid-template-columns:14px 20px 1fr 36px;align-items:center;gap:6px}
.vis-rank{font-size:10px;color:var(--tx3);text-align:right}
.vis-flag{width:16px;height:12px;border-radius:1px;object-fit:cover;display:block}
.vis-right{display:flex;flex-direction:column;gap:2px}
.vis-meta{display:flex;justify-content:space-between;align-items:baseline}
.vis-name{font-size:11px;font-weight:500;color:var(--tx)}
.vis-pct{font-size:8px;color:var(--tx3)}
.vis-track{width:100%;background:var(--bd);border-radius:2px;height:3px;overflow:hidden}
.vis-fill{height:3px;border-radius:2px;background:var(--tx)}
.vis-n{font-size:10px;font-weight:500;color:var(--tx2);text-align:right;font-variant-numeric:tabular-nums}
.vis-sep{height:1px;background:var(--bd);margin:2px 0}
.vis-ft{padding:8px 14px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.vis-ft-l{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.vis-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;display:inline-block;animation:visPulse 2.4s ease-in-out infinite}
@keyframes visPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── CALENDAR ── */
.cal-page{padding:24px 20px 28px;max-width:calc(100% - 160px);margin:0 auto}
.cal-page-title{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:16px}
/* 연도 탭 */
.cal-year-row{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.cal-year-tab{padding:5px 14px;border:1px solid var(--bd);border-radius:20px;font-size:12px;font-weight:600;color:var(--tx3);background:transparent;cursor:pointer;transition:all .14s}
.cal-year-tab:hover{border-color:var(--bd2);color:var(--tx)}
.cal-year-tab.active{background:#3558c0;color:#fff;border-color:#3558c0}
.cal-year-overview-btn{padding:5px 12px;border:1px solid var(--bd);border-radius:20px;font-size:11px;font-weight:600;color:var(--tx3);background:transparent;cursor:pointer;transition:all .14s;display:flex;align-items:center;gap:4px}
.cal-year-overview-btn:hover{border-color:#3558c0;color:#3558c0}
.cal-year-overview-btn.active{background:#3558c0;color:#fff;border-color:#3558c0}
/* 연간 요약 그리드 */
.cal-year-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:24px}
.cal-mini-month{background:var(--sb);border:1px solid var(--bd);border-radius:8px;overflow:hidden;cursor:pointer;transition:box-shadow .14s}
.cal-mini-month:hover{box-shadow:0 2px 10px #0001}
.cal-mini-month.cur-month{border-color:#3558c0;box-shadow:0 0 0 1px #3558c0}
.cal-mm-head{padding:7px 9px 5px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.cal-mm-lbl{font-size:11px;font-weight:700;color:var(--tx)}
.cal-mm-count{font-size:8px;font-weight:600;color:var(--tx3);background:var(--bg);padding:1px 6px;border-radius:10px}
.cal-mm-count.has{background:#eef2ff;color:#3558c0}
.cal-mm-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 5px 5px;gap:1px}
.cal-mm-dn{text-align:center;font-size:6.5px;font-weight:600;color:var(--tx3);padding:1px 0}
.cal-mm-dn.s{color:#c03030}.cal-mm-dn.sa{color:#3a5cb0}
.cal-mm-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:7.5px;color:var(--tx3)}
.cal-mm-cell.hw-bh{background:color-mix(in srgb,#c0392b 15%,transparent);color:#c0392b;font-weight:700}
.cal-mm-cell.hw-biz{background:color-mix(in srgb,#3a9ed4 15%,transparent);color:#1a7aaa;font-weight:700}
.cal-mm-cell.hw-both{background:linear-gradient(135deg,color-mix(in srgb,#c0392b 15%,transparent) 50%,color-mix(in srgb,#3a9ed4 15%,transparent) 50%);color:#7a3a7a;font-weight:700}
.cal-mm-cell.td{background:#3558c0;color:#fff;font-weight:800;border-radius:50%}
/* ── TIMELINE VIEW ── */
.cal-timeline{padding-bottom:32px}
.cal-tl-year-block{margin-bottom:40px}
.cal-tl-multi-grid{display:grid;align-items:start;gap:0 32px}
.cal-tl-year-col{display:flex;flex-direction:column}
.cal-tl-year-col .cal-tl-year-hd{padding:0 0 14px 0;margin-bottom:0;display:flex;align-items:center;gap:10px}
.cal-tl-year-col .cal-tl-year-hd .cal-tl-year-line{flex:1;height:1px;background:var(--bd)}
.cal-tl-year-col .cal-tl-month-row{border-bottom:1px solid var(--bd)}
.cal-tl-year-col .cal-tl-entries{padding:7px 6px}
.cal-tl-year-col .cal-tl-entry-title{max-width:140px}
.cal-tl-year-hd{display:flex;align-items:center;gap:12px;margin-bottom:18px;cursor:pointer}
.cal-tl-year-label{font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.03em}
.cal-tl-year-count{font-size:11px;font-weight:600;color:var(--tx3);background:var(--bg);border:1px solid var(--bd);padding:2px 10px;border-radius:12px}
.cal-tl-year-line{flex:1;height:1px;background:var(--bd)}
.cal-tl-months{display:flex;flex-direction:column;gap:0}
.cal-tl-month-row{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--bd);background:transparent}
.cal-tl-month-row:first-child{border-top:1px solid var(--bd)}
.cal-tl-month-row.empty{opacity:.38}
.cal-tl-month-label{width:46px;flex-shrink:0;padding:8px 0 8px 0;font-size:11px;font-weight:600;color:var(--tx3);display:flex;align-items:center}
.cal-tl-month-row.cur-mo .cal-tl-month-label{color:#3558c0;font-weight:700}
.cal-tl-entries{flex:1;display:flex;flex-wrap:nowrap;gap:4px;padding:7px 10px;min-height:32px;align-items:center;overflow:hidden}
.cal-tl-entry{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;transition:opacity .12s;border:1px solid transparent}
.cal-tl-entry:hover{opacity:.75}
.cal-tl-entry-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-tl-entry-title{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-tl-entry-st{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;flex-shrink:0}
.cal-tl-empty-lbl{font-size:11px;color:var(--tx3);padding:2px 0}
.cal-top-row{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.cal-nav-btn{background:transparent;border:1px solid var(--bd);border-radius:6px;color:var(--tx2);font-size:16px;padding:4px 12px;line-height:1;transition:all .12s}
.cal-nav-btn:hover{background:var(--bg);color:var(--tx)}
.cal-month-lbl{font-size:15px;font-weight:700;color:var(--tx)}
.cal-layout{display:grid;grid-template-columns:1fr 210px;gap:20px;align-items:start}
.cal-full{background:var(--sb);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.cal-dnames{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--bd)}
.cal-dn{padding:9px 6px;font-size:12px;font-weight:700;color:var(--tx3);text-align:center}
.cal-dn.sun{color:#d04040}.cal-dn.sat{color:#4065c0}
.cal-grid-rows{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:110px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:6px 6px}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.empty{background:transparent}
.cal-cell.today{background:#eef2ff;border-top:2px solid #3558c0}
.cal-cell.sel{background:#f0f0f0}
.cal-cell.has-work{cursor:pointer}
.cal-cell.has-work:hover{background:#ebebeb}
.cal-day-num{font-size:13px;font-weight:600;color:var(--tx3);margin-bottom:5px;display:block}
.cal-cell.today .cal-day-num{color:#fff!important;font-weight:800;background:#3558c0;border-radius:50%;width:26px;height:26px;display:inline-flex!important;align-items:center;justify-content:center;font-size:13px;line-height:1}
.cal-cell.sun-col .cal-day-num{color:#c03030}
.cal-cell.sat-col .cal-day-num{color:#3a5cb0}
.cal-cell.has-work .cal-day-num,.cal-cell.sel .cal-day-num{color:var(--tx)}
.cal-cell.today.has-work .cal-day-num,.cal-cell.today.sel .cal-day-num{color:#fff!important}
.cal-work-item{display:block;font-size:11px;font-weight:500;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;color:#fff}
.day-detail{margin-top:14px;background:var(--sb);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.dd-hd{padding:10px 14px;border-bottom:1px solid var(--bd);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--tx3);text-transform:uppercase}
.dd-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--bd)}
.dd-row:last-child{border-bottom:none}
.dd-bar{width:3px;height:30px;border-radius:2px;flex-shrink:0}
.dd-proj{font-size:9px;font-weight:600;color:var(--tx3);margin-bottom:2px}
.dd-name{font-size:12px;color:var(--tx)}
.dd-st{margin-left:auto;font-size:9px;font-weight:700}
.dd-st.done{color:#c0392b}.dd-st.plan{color:var(--tx3)}
.dd-empty{padding:14px;text-align:center;font-size:11px;color:var(--tx3)}
.recent-hd{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--tx3);text-transform:uppercase;margin-bottom:10px}
.recent-list{display:flex;flex-direction:column;gap:5px}
.r-item{padding:9px 11px;background:var(--sb);border:1px solid var(--bd);border-left-width:3px;border-radius:7px}
.r-top{display:flex;justify-content:space-between;margin-bottom:3px}
.r-proj{font-size:9px;font-weight:600}.r-date{font-size:9px;color:var(--tx3)}
.r-title{font-size:11px;color:var(--tx2)}

/* ── TOP BAR (page) ── */
.top-bar{padding:10px 20px;background:var(--sb);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tb-back{background:transparent;border:none;color:var(--tx3);font-size:12px;padding:4px 8px;border-radius:5px;transition:all .12s;font-family:var(--fn)}
.tb-back:hover{background:var(--bg);color:var(--tx)}
.tb-sep{width:1px;height:14px;background:var(--bd)}
.tb-crumb{font-size:10px;font-weight:500;color:var(--tx3)}
.tb-arr{font-size:10px;color:var(--bd2)}
.tb-cur{font-size:12px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.tb-sub-btn{margin-left:auto;background:transparent;border:1px solid var(--bd);border-radius:5px;color:var(--tx3);font-size:10px;font-weight:500;padding:4px 10px;transition:all .12s}
.tb-sub-btn:hover{border-color:var(--bd2);color:var(--tx)}
.tb-sub-btn.on{background:var(--bg);color:var(--tx);border-color:var(--bd2)}

/* ── INTRO ── */
.intro-hero{padding:32px 36px 26px;border-bottom:1px solid var(--bd);background:var(--sb)}
.intro-hero-inner{max-width:700px;margin:0 auto}
.intro-body{padding:24px 36px;max-width:700px;margin:0 auto}
.intro-eyebrow{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--tx3);text-transform:uppercase;margin-bottom:8px}
.intro-title{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.intro-desc{font-size:14px;color:var(--tx2);line-height:1.85;max-width:520px;margin-bottom:18px}
.intro-tags{display:flex;gap:6px;flex-wrap:wrap}
.intro-tag{font-size:11px;padding:4px 10px;border-radius:20px}
.intro-sec{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--tx3);text-transform:uppercase;margin-bottom:12px;margin-top:24px}
.intro-ph{height:12px;border-radius:4px;background:var(--bd);margin-bottom:10px}
.cb-hint{margin-top:20px;padding:18px;border:1px dashed var(--bd2);border-radius:8px;font-size:11px;color:var(--tx3);text-align:center}

/* ── VOL BANNER ── */
.vol-banner{display:flex;gap:20px;padding:20px 0 24px;align-items:flex-start;background:var(--sb);max-width:700px;margin:0 auto;width:calc(100% - 40px)}
.vol-banner-thumb{width:150px;height:200px;border-radius:8px;flex-shrink:0;border:1px solid var(--bd)}
.vol-banner-thumb.yt{width:180px;height:102px}
.vb-lbl{font-size:9px;font-weight:600;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase;margin-bottom:4px}
.vb-title{font-size:17px;font-weight:700;margin-bottom:3px}
.vb-sub{font-size:12px;color:var(--tx2);margin-bottom:9px}
.vb-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.vb-tag{font-size:10px;padding:2px 8px;border-radius:4px}
.vb-synopsis{margin-top:12px;padding:0;background:transparent;border-radius:0;border:none}
.vb-synopsis-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--tx3);text-transform:uppercase;margin-bottom:8px}
.vb-synopsis-text{font-size:12px;color:var(--tx2);line-height:1.7}

/* ── EPISODE LIST (default board) ── */
.ep-board{margin:16px auto 24px;max-width:700px;width:calc(100% - 40px);background:var(--sb);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.ep-board-head{display:grid;grid-template-columns:44px 1fr 90px auto;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--tx3);text-transform:uppercase}
.ep-row{display:grid;grid-template-columns:44px 1fr 90px auto;padding:11px 16px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s;align-items:center}
.ep-row:last-child{border-bottom:none}
.ep-row:hover{background:#ebebeb}
.ep-row-locked{cursor:default}
.ep-row-locked:hover{background:transparent}
.ep-num{font-size:11px;color:var(--tx3);font-weight:500}
.ep-title-col{font-size:13px;color:var(--tx);display:flex;align-items:center;gap:7px}
.ep-status-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.ep-status-badge.done{background:#ffe4e4;color:#c0392b}
.ep-status-badge.wip{background:#F9F4CA;color:#F9CB4C}
.ep-status-badge.plan{background:#f0f0f0;color:#aaa}
.ep-date-col{font-size:10px;color:var(--tx3);text-align:right;white-space:nowrap}
.ep-status{font-size:10px;font-weight:700;text-align:right}
.ep-status.done{color:#c0392b}.ep-status.plan{color:var(--tx3)}

/* ── YOUTUBE-STYLE EPISODE LIST ── */
.yt-ep-list{display:flex;flex-direction:column;gap:0;padding:12px 0 24px;max-width:700px;margin:0 auto;width:calc(100% - 40px)}
.yt-ep-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;align-items:flex-start;transition:opacity .12s}
.yt-ep-item:last-child{border-bottom:none}
.yt-ep-item:hover{opacity:.75}
.yt-ep-thumb{width:160px;height:90px;flex-shrink:0;border-radius:8px;border:1px solid var(--bd);position:relative;overflow:hidden}
.yt-ep-info{flex:1;min-width:0}
.yt-ep-num{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--tx3);text-transform:uppercase;margin-bottom:4px}
.yt-ep-title{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:6px;line-height:1.4}
.yt-ep-meta{font-size:11px;color:var(--tx3)}
.yt-ep-status{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;margin-top:6px}
.yt-ep-status.done{background:#ffe4e4;color:#c0392b}
.yt-ep-status.wip{color:#666}
.yt-ep-status.plan{background:#f0f0f0;color:#999}

/* ── POSTYPE-STYLE CONTENT ── */
.postype-wrap{max-width:700px;margin:0 auto;padding:40px clamp(16px,4vw,40px) 60px;min-width:0;width:100%}
.postype-header{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--bd)}
.postype-series-lbl{font-size:13px;color:var(--tx3);margin-bottom:8px;font-family:var(--fn);cursor:pointer;display:inline-block}
.postype-series-lbl:hover{color:var(--tx)}
.postype-title{font-size:22px;font-weight:700;line-height:1.4;margin-bottom:14px;font-family:var(--fn);color:#111;letter-spacing:-.02em}
.postype-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.postype-date{font-size:12px;color:var(--tx3)}
.postype-status-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px}
.postype-body{font-family:var(--fn);font-size:16px;line-height:2.0;color:#1a1a1a;letter-spacing:.01em;word-break:normal;overflow-wrap:break-word}
.postype-body p{margin-bottom:1.6em}
.postype-body .pt-para{padding-bottom:1.4em}
.postype-body .pt-blank{height:.9em}
.postype-body h2{font-size:18px;font-weight:700;margin:2em 0 0.8em;padding-left:12px;border-left:3px solid currentColor}
.postype-placeholder{color:var(--tx3);font-size:14px;line-height:2;font-family:var(--fn)}
.postype-placeholder p{margin-bottom:1.4em}
.postype-hint{margin-top:32px;padding:20px;border:1px dashed var(--bd2);border-radius:10px;font-size:12px;color:var(--tx3);text-align:center;font-family:var(--fn)}

/* ── EP NAV (prev/next + picker) ── */
.ep-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px clamp(12px,3vw,24px);max-width:700px;margin:0 auto;width:100%;min-width:0}
.ep-nav-outer{border-top:1px solid var(--bd);background:var(--sb);padding-bottom:32px}
/* ── VOL NAV BAR ── */
.vol-nav-outer{background:var(--sb);padding:14px 0 28px}
.vol-nav-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;max-width:700px;width:calc(100% - 40px);margin:0 auto}
.vol-nav-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:12px;font-weight:500;transition:all .12s;cursor:pointer;font-family:var(--fn);white-space:nowrap;overflow:hidden;max-width:220px}
.vol-nav-btn:hover:not(.disabled){background:var(--bg);border-color:var(--bd2);color:var(--tx)}
.vol-nav-btn.disabled{opacity:.3;cursor:default;pointer-events:none}
.vol-nav-btn.prev{justify-self:start}
.vol-nav-btn.next{justify-self:end}
.vol-nav-btn-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol-list-btn{justify-self:center;display:flex;align-items:center;gap:5px;padding:9px 18px;background:var(--sb);border:1px solid var(--bd2);border-radius:8px;font-size:11px;font-weight:600;color:var(--tx2);transition:all .12s;cursor:pointer;font-family:var(--fn)}
.vol-list-btn:hover{background:var(--bg);color:var(--tx)}
/* Vol picker modal */
.vol-picker-modal{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;background:#00000050}
.vol-picker-modal.hidden{display:none}
.vol-picker-inner{background:var(--sb);border-radius:14px;box-shadow:0 8px 40px #0000002a;width:min(400px,90vw);max-height:60vh;display:flex;flex-direction:column;overflow:hidden}

  function playClick(){
    try{
      const ctx=getCtx();
      // Windows XP click: two quick tones like old UI feedback
      function tone(freq,start,dur,vol){
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';
        o.frequency.setValueAtTime(freq,ctx.currentTime+start);

        o.start(ctx.currentTime+start);
        o.stop(ctx.currentTime+start+dur+0.01);
      }
      tone(1200,0,0.05,0.12);

function fetchGlobalVisits(){
  if(_visFetched) return;
  _visFetched = true;
  fetch(VIS_WORKER_URL + '/hit', {method:'POST'})
    .then(r=>r.json())
    .then(d=>_renderVisWidget(d))
    .catch(()=>_renderVisWidget(null));
}

function _renderVisWidget(d){
  const totalEl = document.getElementById('vis-total');
  const listEl  = document.getElementById('vis-list');
  const ccEl    = document.getElementById('vis-country-count');
  if(!d || !d.countries){
    if(listEl) listEl.innerHTML='<div style="padding:14px 0;text-align:center;font-size:10px;color:var(--tx3)">—</div>';
    return;
  }
  if(totalEl) totalEl.textContent = Number(d.total).toLocaleString();
  const countries = d.countries.slice(0,8);
  const max = countries[0] ? countries[0].count : 1;
  const BAR_COLORS = ['#3a86ff','#06d6a0','#ffbe0b','#fb5607','#8338ec','#ff006e','#0096c7','#adb5bd'];
  let html = '';
  countries.forEach((c,i)=>{
    const cc   = (c.code||'').toUpperCase();
    const name = VIS_NAMES[cc] || cc;
    const pct  = d.total ? Math.round(c.count/d.total*100) : 0;
    const w    = Math.round(c.count/max*100);
    const flag = `https://flagcdn.com/16x12/${cc.toLowerCase()}.png`;
    if(i===3) html += '<div class="vis-sep"></div>';
    html += `<div class="vis-row">
      <span class="vis-rank">${i+1}</span>
      <img class="vis-flag" src="${flag}" alt="${cc}" loading="lazy">
      <div class="vis-right">
        <div class="vis-meta">
          <span class="vis-name">${name}</span>
          <span class="vis-pct">${pct}%</span>
        </div>
        <div class="vis-track"><div class="vis-fill" style="width:${w}%;background:${BAR_COLORS[i]||'#888'}"></div></div>
      </div>
      <span class="vis-n">${Number(c.count).toLocaleString()}</span>
    </div>`;
  });
  if(listEl) listEl.innerHTML = html || '<div style="padding:14px 0;text-align:center;font-size:10px;color:var(--tx3)">방문자 없음</div>';
  if(ccEl) ccEl.textContent = d.countries.length;
}

/* ── 번역 캐시 (DeepL 결과 저장 → 재호출 방지) ── */
var _tlCache = {};
var _currentLang = 'ko';
var _epOriginalLines = null; /* 에피소드 원본 줄 배열 — 재번역 시 사용 */

function setLang(lang){
  _currentLang = lang;
  if(lang==='ko'){
    /* KO: data-orig 원본 복원 후 Google 쿠키 삭제 → 리로드 */
    document.querySelectorAll('[data-orig]').forEach(function(n){
      n.textContent = n.dataset.orig;
    });
    document.cookie='googtrans=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
    document.cookie='googtrans=;path=/;domain=.'+location.hostname+';expires=Thu, 01 Jan 1970 00:00:00 GMT';
    location.reload();
    return;
  }

  /* DeepL 설정 확인 */
  var cfg = (typeof CONFIG !== 'undefined' && CONFIG.DEEPL) ? CONFIG.DEEPL : {};

  /* 캐시 히트 → 즉시 적용 (API 호출 없음) */
  if(_tlCache[lang]){
    _tlApply(_tlCache[lang]);
    return;
  }

  if(cfg.enabled && cfg.proxyUrl){
    _tlDeepL(lang, cfg);
  } else {
    /* DeepL 미설정 → Google 바로 사용 */
    _tlGoogle(lang);
  }
}

/* ── ① DeepL 번역 시도 ── */
function _tlDeepL(lang, cfg){
  var nodes = Array.prototype.slice.call(document.querySelectorAll('[data-i18n]'));
  if(!nodes.length){ _tlGoogle(lang); return; }

  /* 원본 텍스트 보존 */
  nodes.forEach(function(n){
    if(!n.dataset.orig) n.dataset.orig = n.textContent.trim();
  });
  var texts = nodes.map(function(n){ return n.dataset.orig; });

  /* DeepL 언어 코드 변환 (zh-CN/zh-TW → ZH, 나머지 대문자) */
  var dlLang = (lang==='zh-CN'||lang==='zh-TW') ? 'ZH' : lang.split('-')[0].toUpperCase();

  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, cfg.timeout || 5000);

  fetch(cfg.proxyUrl, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text: texts, target_lang: dlLang }),
    signal: ctrl.signal
  })
  .then(function(res){
    clearTimeout(timer);
    /* 456 = 쿼터 초과, 5xx = 서버 오류 → 폴백 */
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  })
  .then(function(data){
    var dict = {};
    nodes.forEach(function(n, i){
      dict[n.dataset.i18n] = data.translations[i].text;
    });
    _tlCache[lang] = dict;
    _tlApply(dict);
    _tlBadge('deepl');
    /* DeepL 성공 시 Google도 함께 구동 (동적 콘텐츠 커버) */
    _tlGoogle(lang);
  })
  .catch(function(err){
    clearTimeout(timer);
    console.warn('[DeepL] 실패 → Google 폴백:', err.message);
    _tlGoogle(lang);
  });
}

/* ── DOM에 번역 딕셔너리 적용 ── */
function _tlApply(dict){
  document.querySelectorAll('[data-i18n]').forEach(function(n){
    var k = n.dataset.i18n;
    if(dict[k]) n.textContent = dict[k];
  });
}

}

/* ── CALENDAR ── */
function renderCalendar(){
  const{calY:y,calM:m,calOverview:ov,calTimeline:tl,calSpan:span}=S;
  const firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate();
  const monthStr=new Date(y,m,1).toLocaleDateString("ko-KR",{year:"numeric",month:"long"});
  const DNAMES=["일","월","화","수","목","금","토"],DCLS=["sun","","","","","","sat"];

  // 연도 목록
  const curY=new Date().getFullYear();
  const allYears=[...new Set(Object.keys(WORK_LOG).map(d=>parseInt(d.slice(0,4))).filter(yr=>yr<=curY))];
  if(!allYears.includes(curY)) allYears.push(curY);
  allYears.sort((a,b)=>b-a);
  const yearTabs = allYears.map(yr=>`<button class="cal-year-tab${yr===y&&!ov&&!tl?" active":""}" onclick="goYear(${yr})">${yr}년</button>`).join("");

  // N년씩 보기 버튼
  const spanBtns = [1,2,3].map(n=>`<button class="cal-year-overview-btn${(ov&&!tl&&span===n)?" active":""}" onclick="setCalSpan(${n})">${n}년씩 보기</button>`).join("");

  // 연간 요약 미니캘
  function buildMiniMonth(yr,mo){
    const fd=new Date(yr,mo,1).getDay(), days=new Date(yr,mo+1,0).getDate();
    const _tn=new Date();
    const isCurMo=yr===y&&mo===m;
    let cnt=0;
    let cells="";
    for(let i=0;i<fd;i++) cells+=`<div class="cal-mm-cell"></div>`;
    for(let d=1;d<=days;d++){
      const ds_=ds(yr,mo,d);
      const _entries=WORK_LOG[ds_]||[];
      const hasBH=_entries.some(e=>e.projId==="blood-highschool");
      const hasBiz=_entries.some(e=>e.projId==="biz-oc-doll");
      const hw=hasBH||hasBiz;
      const hwCls=hw?(hasBH&&hasBiz?" hw-both":hasBH?" hw-bh":" hw-biz"):"";
      const isToday=yr===_tn.getFullYear()&&mo===_tn.getMonth()&&d===_tn.getDate();
      if(hw) cnt++;
      cells+=`<div class="cal-mm-cell${hwCls}${isToday?" td":""}">${d}</div>`;
    }
    return`<div class="cal-mini-month${isCurMo?" cur-month":""}" onclick="goMonth(${yr},${mo})">
      <div class="cal-mm-head"><span class="cal-mm-lbl">${mo+1}월</span><span class="cal-mm-count${cnt?" has":""}">${cnt?cnt+"건":"없음"}</span></div>
      <div class="cal-mm-grid">${DNAMES.map((n,i)=>`<div class="cal-mm-dn${i===0?" s":i===6?" sa":""}">${n}</div>`).join("")}${cells}</div>
    </div>`;
  }

  // 멀티 연도 그리드 (span 적용)
  function buildMultiYearGrid(){
    const cols = span > 1 ? 12 : 6;
    const gap  = span > 1 ? 6 : 10;
    let html="";
    for(let offset=0;offset<span;offset++){
      const yr=y+offset;
      html+=`<div style="margin-bottom:${span>1?24:0}px">
        ${span>1?`<div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid var(--bd)">${yr}년</div>`:""}
        <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:${gap}px;margin-bottom:0">${Array.from({length:12},(_,mo)=>buildMiniMonth(yr,mo)).join("")}</div>
      </div>`;
    }
    return html;
  }
  const overviewHtml = buildMultiYearGrid();
  const _curY_ov = new Date().getFullYear();
  const _minY_ov_arr = Object.keys(WORK_LOG).map(d=>parseInt(d.slice(0,4))).filter(yr=>yr<=_curY_ov);
  const _minY_ov = _minY_ov_arr.length ? Math.min(..._minY_ov_arr) : _curY_ov;
  const _atMaxOv = y >= _curY_ov + 2 - span + 1;
  const _atMinOv = y <= _minY_ov;

  // ── 타임라인 뷰 ──
  function buildTimeline(){
    const _tn=new Date();
    const allEntries=Object.entries(WORK_LOG).flatMap(([date,ws])=>ws.map(w=>({date,...w})));
    // 전체 연도 목록 구성
    const allYrs=[...new Set(allEntries.map(e=>e.date.slice(0,4)))];
    const curYstr=String(_tn.getFullYear());
    if(!allYrs.includes(curYstr)) allYrs.push(curYstr);
    allYrs.sort((a,b)=>b.localeCompare(a));

    // span 적용: calY 기준으로 span개 연도만 표시
    const startY=S.calY, endY=S.calY+span-1;
    const years=allYrs.filter(yr=>parseInt(yr)>=startY&&parseInt(yr)<=endY);
    // 해당 범위 연도가 없어도 최소 startY는 표시
    for(let i=startY;i<=endY;i++){
      const s=String(i);
      if(!years.includes(s)) years.push(s);
    }
    years.sort((a,b)=>span>1?a.localeCompare(b):b.localeCompare(a));

    const _atMaxTl = startY >= _tn.getFullYear() + 2 - span + 1;
    const _minY_tl_arr = Object.keys(WORK_LOG).map(d=>parseInt(d.slice(0,4))).filter(yr=>yr<=_tn.getFullYear());
    const _minY_tl = _minY_tl_arr.length ? Math.min(..._minY_tl_arr) : _tn.getFullYear();
    const _atMinTl = startY <= _minY_tl;

    const stBg={완료:"#ffe4e4",작업중:"#fff9e0",예정:"#f0f0f0"};
    const stClr={완료:"#c0392b",작업중:"#d4a017",예정:"#aaa"};

    // 타임라인 헤더 (N년씩 보기 드롭다운 + 연도 네비)
    const tlHeader=`
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:20px;gap:12px">
        <div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="cal-nav-btn" onclick="prevTlYear()" ${_atMinTl?'disabled style="opacity:.3;cursor:default;pointer-events:none"':''}>&#8249;</button>
          <span style="font-size:16px;font-weight:700;color:var(--tx);min-width:${span>1?'150px':'72px'};text-align:center">
            ${span===1?`${startY}년`:`${startY}년 ~ ${endY}년`}
          </span>
          <button class="cal-nav-btn" onclick="nextTlYear()" ${_atMaxTl?'disabled style="opacity:.3;cursor:default;pointer-events:none"':''}>&#8250;</button>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <div style="position:relative;display:inline-block" id="tl-span-dropdown-wrap">
            <button onclick="toggleTlSpanDropdown()" style="display:flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--sb);color:var(--tx2);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s" onmouseover="this.style.borderColor='var(--bd2)'" onmouseout="this.style.borderColor='var(--bd)'">
              ${span}년씩 보기 <span style="font-size:9px;opacity:.6">▼</span>
            </button>
            <div id="tl-span-dropdown" style="display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--sb);border:1px solid var(--bd);border-radius:8px;box-shadow:0 4px 16px #0000001a;z-index:300;overflow:hidden;min-width:110px">
              ${[1,2,3].map(n=>`<button onclick="setTlSpan(${n})" style="display:block;width:100%;padding:9px 16px;border:none;background:${n===span?'var(--bg)':'transparent'};color:${n===span?'var(--tx)':'var(--tx2)'};font-size:12px;font-weight:${n===span?700:400};text-align:left;cursor:pointer" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='${n===span?'var(--bg)':'transparent'}'">
                ${n}년씩 보기${n===span?' ✓':''}
              </button>`).join("")}
            </div>
          </div>
        </div>
      </div>`;

    const buildYearHtml = (yr) => {
      const yearEntries=allEntries.filter(e=>e.date.startsWith(yr));
      const yearCount=yearEntries.length;
      const navCall=w=>w.isChar
        ?`goDollChar()`
        :w.projId==="biz-oc-doll"
        ?`goRecentWork('${w.projId}',null,${w.epId},'${w.dollCatId||""}')`
        :`goRecentWork('${w.projId}','${w.volId}',${w.epId},null)`;
      const months=Array.from({length:12},(_,mo)=>{
        const moStr=`${yr}-${String(mo+1).padStart(2,"0")}`;
        const moEntries=yearEntries.filter(e=>e.date.startsWith(moStr))
          .sort((a,b)=>a.date.localeCompare(b.date));
        const isCurMo=yr===String(_tn.getFullYear())&&mo===_tn.getMonth();
        // 볼륨별 그룹핑
        const groups=[];
        moEntries.forEach(w=>{
          const key=w.projId+'||'+(w.volId||w.dollCatId||'');
          const g=groups.find(g=>g.key===key);
          if(g){g.entries.push(w);}
          else{groups.push({key,proj:w.proj,volSub:w.volSub||'',volType:w.volType||'',acc:w.acc,status:w.status,projId:w.projId,volId:w.volId,epId:w.epId,dollCatId:w.dollCatId||'',entries:[w]});}
        });
        const chips = groups.length
          ? groups.map(g=>{
              const count=g.entries.length;
              const nav=navCall(g.entries[0]);
              const typeBadge=g.volType==='웹소설'
                ?`<span style="font-size:9px;font-weight:500;padding:1px 4px;border-radius:3px;background:#f0f0f0;color:#888;flex-shrink:0">웹소설</span>`
                :g.volType==='웹툰'
                ?`<span style="font-size:9px;font-weight:500;padding:1px 4px;border-radius:3px;background:#f0f0f0;color:#888;flex-shrink:0">웹툰</span>`
                :'';
              const volLabel=g.volSub?` ${g.volSub}`:'';
              return`<span class="cal-tl-entry" onclick="${nav}" title="${g.proj}${volLabel} · ${count}화">
                <span class="cal-tl-entry-dot" style="background:${g.acc}"></span>
                ${typeBadge}
                <span class="cal-tl-entry-title">${g.proj}${volLabel}</span>
                <span style="font-size:10px;color:var(--tx3);flex-shrink:0">×${count}화</span>
                <span class="cal-tl-entry-st" style="background:${stBg[g.status]||'#f0f0f0'};color:${stClr[g.status]||'#aaa'}">${g.status}</span>
              </span>`;
            }).join("")
          : `<span class="cal-tl-empty-lbl">—</span>`;
        return`<div class="cal-tl-month-row${moEntries.length===0?" empty":""}${isCurMo?" cur-mo":""}">
          <div class="cal-tl-month-label">${mo+1}월</div>
          <div class="cal-tl-entries">${chips}</div>
        </div>`;
      });
      return { yearCount, months };
    };

    let body;
    if(span === 1){
      const yr = years[0];
      const { yearCount, months } = buildYearHtml(yr);
      body = `<div class="cal-tl-year-block">
        <div class="cal-tl-year-hd">
          <span class="cal-tl-year-label">${yr}</span>
          <span class="cal-tl-year-count">${yearCount}건</span>
          <div class="cal-tl-year-line"></div>
        </div>
        <div class="cal-tl-months">${months.join("")}</div>
      </div>`;
    } else {
      // span > 1: 연도별로 좌우 나란히 배치
      const cols = years.map(yr=>{
        const { yearCount, months } = buildYearHtml(yr);
        return `<div class="cal-tl-year-col">
          <div class="cal-tl-year-hd" style="padding:0 0 14px 0;margin-bottom:0;display:flex;align-items:center;gap:10px">
            <span class="cal-tl-year-label">${yr}</span>
            <span class="cal-tl-year-count">${yearCount}건</span>
            <div class="cal-tl-year-line"></div>
          </div>
          <div class="cal-tl-months" style="border-top:1px solid var(--bd)">${months.join("")}</div>
        </div>`;
      }).join("");
      body = `<div class="cal-tl-multi-grid" style="grid-template-columns:repeat(${span},1fr)">${cols}</div>`;
    }

    return `<div class="cal-timeline">${tlHeader}${body}</div>`;
  }

  // 월간 뷰
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++){const ds_=ds(y,m,d);cells.push({d,work:WORK_LOG[ds_]||[],dow:(firstDay+d-1)%7});}
  const cellsHtml=cells.map(c=>{
    if(!c)return`<div class="cal-cell empty"></div>`;
    const _tn=new Date(),isToday=y===_tn.getFullYear()&&m===_tn.getMonth()&&c.d===_tn.getDate(),isSel=S.selDay===c.d;
    let cls="cal-cell";

/* ── Sheets 불러오기 (공개 CSV — API 키 불필요) ── */
async function loadEpDataFromSheets(){
  try{
    // 시트 이름으로 직접 fetch — gid 불필요
    const url = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:csv&sheet=episodes`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("CSV fetch 실패 " + res.status);
    const csv = await res.text();

    // CSV 파싱
    const rows = csv.trim().split("\n").map(r=>{
      // 쉼표 구분, 큰따옴표 처리
      const cols=[];let cur="",inQ=false;
      for(const ch of r){
        if(ch==='"'){inQ=!inQ;}
        else if(ch===','&&!inQ){cols.push(cur.trim());cur="";}
        else cur+=ch;
      }
      cols.push(cur.trim());
      return cols;
    });
    if(rows.length < 2) return false;

    // 프로젝트 이름 → ID 매핑
    const projMap = {
      "블러드하이스쿨": "blood-highschool",
      "biz-OC-doll":    "biz-oc-doll",
      "biz-oc-doll":    "biz-oc-doll",
    };

    // 날짜 정규화
    function normalizeDate(v){
      if(!v) return null;
      if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
      const m = v.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
      if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
      return null;
    }

    // 데이터 파싱 (1행 헤더 건너뜀)
    // 시트 구조: A=프로젝트 B=종류 C=권수 D=N화 E=상태 F=날짜 (왼쪽)
    //           G=프로젝트 H=종류 I=권수 J=N화 K=상태 L=날짜 (오른쪽)
    function applyRow(p,t,vn,en,s,d){
      const volNum=parseInt(vn), epId=parseInt(en);
      if(!p||isNaN(volNum)||isNaN(epId)) return;
      const pid=projMap[p]; if(!pid) return;
      const vols=VOLUMES[pid]; if(!Array.isArray(vols)) return;
      const vol=vols.find(v=>v.type===t&&v.num===volNum); if(!vol) return;
      const ep=vol.episodes.find(e=>e.id===epId); if(!ep) return;
      if(s) ep.status=s;
      const nd=normalizeDate(d); if(nd) ep.date=nd;
    }
    rows.slice(1).forEach(row=>{
      applyRow((row[0]||'').trim(),(row[1]||'').trim(),(row[2]||'').trim(),(row[3]||'').trim(),(row[4]||'').trim(),(row[5]||'').trim());
      if((row[6]||'').trim()) applyRow((row[6]||'').trim(),(row[7]||'').trim(),(row[8]||'').trim(),(row[9]||'').trim(),(row[10]||'').trim(),(row[11]||'').trim());
    });

    return true;
  }catch(e){
    console.warn("Sheets CSV 불러오기 실패:", e.message);
    return false;
  }
}

/* ── 캐릭터 시트 불러오기 (OC-characters 탭 CSV) ── */
async function loadCharDataFromSheets(){
  try{
    const _csvFn = (typeof SHEET_CSV === 'function')
      ? SHEET_CSV
      : (t => `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(t)}`);
    const url = _csvFn('OC-characters');
    const res = await fetch(url);
    if(!res.ok) throw new Error('CSV fetch 실패 ' + res.status);
    const csv = await res.text();

    // CSV 파싱 (쉼표+따옴표 처리)
    const rows = csv.trim().split('\n').map(r=>{
      const cols=[]; let cur='', inQ=false;
      for(const ch of r){
        if(ch==='"'){inQ=!inQ;}
        else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
        else cur+=ch;
      }
      cols.push(cur.trim());
      return cols;
    });
    if(rows.length < 2) return false;

    // 헤더: code / type / holder / status / updated
    window._CHAR_DATA = rows.slice(1).map(r=>({
      code:    (r[0]||'').trim(),
      type:    (r[1]||'').trim(),
      holder:  (r[2]||'').trim(),
      status:  (r[3]||'').trim(),
      updated: (r[4]||'').trim(),
    })).filter(c=>c.code);

    return true;
  }catch(e){
    console.warn('캐릭터 CSV 불러오기 실패:', e.message);
    return false;
  }
}

/* ── 캐릭터 updated 날짜 → WORK_LOG 주입 ── */
function injectCharDatesIntoWorkLog(){
  const chars = window._CHAR_DATA || [];
  const dollProj = PROJECTS.find(p=>p.id==='biz-oc-doll');
  const acc = dollProj ? dollProj.acc : '#5a90b0';
  // 기존 char 항목 제거 (중복 방지)
  Object.keys(WORK_LOG).forEach(k=>{
    WORK_LOG[k] = WORK_LOG[k].filter(w=>!w.isChar);
    if(!WORK_LOG[k].length) delete WORK_LOG[k];
  });
  chars.forEach(c=>{
    if(!c.updated) return;
    // 날짜 정규화: "2026. 4. 9." → "2026-04-09"
    let dateStr = c.updated;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)){
      const mm = dateStr.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
      if(!mm) return;
      dateStr = `${mm[1]}-${mm[2].padStart(2,'0')}-${mm[3].padStart(2,'0')}`;
    }
    if(!WORK_LOG[dateStr]) WORK_LOG[dateStr] = [];
    WORK_LOG[dateStr].push({
      proj: 'biz-OC-doll',
      title: c.code,
      status: c.status || '완료',
      acc,
      projId: 'biz-oc-doll',
      isChar: true,
      charCode: c.code,
    });
  });
}

// ══════════════════════════════════════════════
//  # HASH NAVIGATION — history.pushState 방식
//  pushState는 이벤트를 발생시키지 않으므로
//  메뉴 동작과 100% 충돌 없음
// ══════════════════════════════════════════════

function stateToHash(){
  const v = S.view;
  if(v === "calendar"){
    if(S.calTimeline) return `#calendar/${S.calY}/timeline`;
    if(S.calOverview) return `#calendar/${S.calY}/overview`;
    return `#calendar/${S.calY}/${S.calM+1}`;
  }
  return "#home";
}

function applyHash(hash){
  if(!hash || hash === "#" || hash === "#home"){ S.view="home"; S.activeProj=null; return; }
  const parts = hash.replace(/^#/,"").split("/");
  const p0 = parts[0];
  if(p0 === "about"){ setTimeout(openContactOverlay,0); return; }
  if(p0 === "calendar"){
    S.view="calendar";
    if(parts[1]) S.calY = parseInt(parts[1]);
    if(parts[2] === "overview"){ S.calOverview=true; S.calTimeline=false; }
    else if(parts[2] === "timeline"){ S.calTimeline=true; S.calOverview=false; }
    else if(parts[2]){ S.calM=parseInt(parts[2])-1; S.calOverview=false; S.calTimeline=false; }
    return;
  }
  /* 구버전 #proj/... 링크 → 해당 프로젝트 사이트로 이관 */
  if(p0 === "proj" && parts[1]){
    const site = (typeof PROJECT_SITES!=="undefined") ? PROJECT_SITES[parts[1]] : null;
    if(site){ location.replace(site); return; }
  }
  S.view="home"; S.activeProj=null;
}

// pushState는 이벤트를 발생시키지 않으므로 메뉴에 영향 없음
// iframe(Claude 미리보기) 등 제한 환경에서는 try-catch로 무시
function pushHash(){
  try {
    history.pushState(null, '', stateToHash());

}

      card && card.classList.remove('notice-collapsed');
      if(wrap) wrap.style.marginBottom='18px';
      if(btn)  { btn.style.top='-11px'; btn.classList.remove('expanded'); }
      body.style.maxHeight='';
      if(chev) chev.style.transform='';
    } else {
      body.style.maxHeight='0';
      if(chev) chev.style.transform='rotate(180deg)';
      setTimeout(function(){
        card && card.classList.add('notice-collapsed');
        if(wrap) wrap.style.marginBottom='-20px';
        if(btn)  { btn.style.top='-65px'; btn.classList.add('expanded'); }
      },0);
    }
  }

  window._applyNoticeState=applyState;

  window.toggleNotice=function(){
    var body=document.getElementById('noticeBody');
    var chev=document.getElementById('noticeChevron');
    var card=document.getElementById('noticeCard');
    var wrap=document.querySelector('.home-trans-notice-wrap');
    var btn=document.getElementById('noticeToggle');
    if(!body) return;
    var opening=!isOpen();
    localStorage.setItem(STORE_KEY, opening);
    if(opening){
      card && card.classList.remove('notice-collapsed');
      if(wrap) wrap.style.marginBottom='18px';
      if(btn)  { btn.style.top='-11px'; btn.classList.remove('expanded'); }
      body.style.maxHeight='';
      if(chev) chev.style.transform='';
    } else {
      body.style.maxHeight='0';
      if(chev) chev.style.transform='rotate(180deg)';
      card && card.classList.add('notice-collapsed');
      if(wrap) wrap.style.marginBottom='-20px';
      if(btn)  { btn.style.top='-65px'; btn.classList.add('expanded'); }
    }
  };
})();

</script>
