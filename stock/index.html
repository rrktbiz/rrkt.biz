<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI글창고 · rrkt.biz</title>

<!-- ════════════════════════════════════════════════════════════
     AI글창고 (stock)

     이 파일 하나가 목록 + 읽기 화면 전부입니다.

     ── 어디서 무엇을 읽어오나 ──
       목록 : 공용 구글시트의  stock  탭  (../config.js 의 SHEETS_ID)
              열 순서 →  id / 제목 / 날짜 / 공개 / 씨앗 / 장르태그
       본문 : texts/{id}.txt      (예: id 가 001 이면 texts/001.txt)

     ⚠ 본문 파일 이름은 시트의 id 를 그대로 씁니다.
       시트에 001 이라 적었으면 파일도 001.txt 여야 합니다.
       시트에는 적었는데 파일이 없으면 열었을 때 안내문이 나옵니다.

     ── 글 한 편 올리는 순서 ──
       1. texts/ 에 000.txt 를 올린다  (UTF-8, 그냥 줄바꿈으로 문단 구분)
       2. 시트 stock 탭에 한 줄 적는다
       3. 끝. 이 파일은 안 건드립니다.

     ── 장르태그 (F열) ──
       씨앗 배너에 뜨는 태그입니다. 시트 F열에 적습니다.
         적는 법:  #현대판타지 #SF #BL     (또는  현대판타지, SF, BL)
       # 은 있어도 되고 없어도 됩니다. 화면에는 항상 # 이 붙어 나옵니다.
       같은 씨앗 줄 중 한 줄에만 적어도 됩니다.
       여러 줄에 나눠 적으면 다 합쳐서 보여주고, 겹치는 건 한 번만 나옵니다.
       빈 칸이면 태그 줄 자체가 안 나옵니다.

     ── 씨앗(세계) 하나에 표지를 붙이고 싶을 때 ──
       1. images/seed/ 에 그림을 올린다  (3:4 비율, 600×800 정도)
       2. 이 파일 안 SEED_THUMB 에 한 줄 적는다
       표지는 없어도 됩니다. 안 적으면 표지 자리 없이 그냥 나옵니다.
       글마다 붙이는 게 아니라 씨앗(세계)마다 한 장입니다.

     ── config.js ──
       읽기만 합니다. 고칠 필요 없습니다.
       (SHEET_CSV('stock') 이 알아서 주소를 만듭니다)
     ════════════════════════════════════════════════════════════ -->

<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--sb:#fff;--sm:#fafafa;--bd:#e8e8e8;--bd2:#c6c6c6;
  --tx:#111111;--tx2:#525252;--tx3:#a3a3a3;
  --blue:#5a90b0;--blue-ink:#477693;--ink:#4a5560;
  --fn:'Inter','Noto Sans KR',-apple-system,sans-serif;
  --h-top:46px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);-webkit-font-smoothing:antialiased}
button{font-family:var(--fn);cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

/* ── 상단바 ── */
#topbar{
  height:var(--h-top);background:var(--sb);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;padding:0 16px;
  position:sticky;top:0;z-index:120;
}
.tb-back{background:transparent;border:none;color:var(--tx3);font-size:12px;padding:5px 8px;border-radius:6px;transition:all .12s;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tb-back:hover{background:var(--sm);color:var(--tx)}
.tb-sep{width:1px;height:14px;background:var(--bd);flex-shrink:0}
.tb-title{font-family:'Josefin Sans',sans-serif;font-weight:300;letter-spacing:.16em;font-size:14px;color:var(--ink)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
#tb-pd-btn{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;
  border:1px solid var(--bd);border-radius:6px;background:transparent;
  font-family:'Josefin Sans',sans-serif;font-weight:300;letter-spacing:.1em;
  font-size:11px;color:var(--tx2);transition:all .12s;white-space:nowrap;
}
#tb-pd-btn:hover{background:var(--sm);color:var(--blue-ink);border-color:var(--blue)}
#tb-sound-btn{display:flex;align-items:center;justify-content:center;width:30px;height:28px;padding:0;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx2);transition:all .12s}
#tb-sound-btn:hover{background:var(--sm);color:var(--tx);border-color:var(--bd2)}
#tb-sound-btn.is-off{color:var(--tx3)}

/* ══════════════════════════════════════════
   읽기 화면 크롬 자동 숨김  (블러드하이스쿨에서 옮겨옴)

   모바일에서 글을 내리는 동안 상단바를 접습니다.
   위로 올리면 다시 나옵니다. 데스크탑에서는 항상 보입니다.
   높이는 JS 가 실측해서 --st-tbh 로 넣습니다.
   ══════════════════════════════════════════ */
#topbar{transition:transform .28s ease;will-change:transform}

/* ── 본문 글자 크기 (읽기 화면에서만 상단바에 나타남) ──
   실제 크기는 JS 가 #reader 에 --rd-fs / --rd-lh 로 넣습니다. */
#tb-fs-wrap{position:relative;display:none;align-items:center;flex-shrink:0}
body.reading #tb-fs-wrap{display:inline-flex}
.tb-fs-toggle{
  font-size:12px;font-weight:700;line-height:1.4;
  height:28px;padding:0 9px;border:1px solid var(--bd);border-radius:6px;
  background:transparent;color:var(--tx2);transition:all .12s;white-space:nowrap;
}
.tb-fs-toggle:hover{background:var(--sm);color:var(--tx);border-color:var(--bd2)}
.tb-fs-toggle.on{background:var(--tx);color:#fff;border-color:var(--tx)}

#rd-fs-panel{
  position:absolute;top:calc(100% + 9px);right:0;
  width:186px;padding:12px;
  background:#fff;border:1px solid var(--bd);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.13);
  z-index:400;text-align:left;
}
#rd-fs-panel.hidden{display:none}
.rd-fs-hd{font-size:9px;font-weight:700;letter-spacing:1.2px;color:var(--tx3);text-transform:uppercase;margin-bottom:9px}
.rd-fs-row{display:flex;align-items:center;gap:8px}
.rd-fs-btn{
  width:32px;height:32px;flex-shrink:0;
  border:1px solid var(--bd);border-radius:7px;background:#fff;color:var(--tx);
  font-size:15px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.rd-fs-btn:hover:not(:disabled){background:var(--sm);border-color:var(--bd2)}
.rd-fs-btn:disabled{opacity:.28;cursor:default}
.rd-fs-val{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.rd-fs-val small{font-size:10px;font-weight:500;color:var(--tx3);margin-left:1px}
.rd-fs-bar{margin-top:10px;height:4px;border-radius:4px;background:#eee;overflow:hidden}
.rd-fs-bar span{display:block;height:100%;width:0;background:var(--tx);border-radius:4px;transition:width .18s ease}
.rd-fs-reset{
  width:100%;margin-top:10px;padding:6px 0;border:none;border-radius:6px;
  background:var(--sm);color:var(--tx2);font-size:10.5px;font-weight:600;transition:all .12s;
}
.rd-fs-reset:hover{background:#ececec;color:var(--tx)}

/* ── 대문 ── */
.wrap{max-width:720px;margin:0 auto;padding:0 24px 80px}
.head{padding:44px 0 26px;border-bottom:1px solid var(--bd)}
.head-eyebrow{font-family:'Josefin Sans',sans-serif;font-size:10px;font-weight:300;letter-spacing:2.6px;color:var(--blue-ink);margin-bottom:11px}
.head-title{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--tx);margin-bottom:12px}
.head-desc{font-size:13.5px;line-height:1.85;color:var(--tx);letter-spacing:-.015em;font-weight:500}

/* AI 고지 — 대문에서 유일하게 상자로 둘러싸는 부분입니다.
   의무 고지라서 시선이 한 번은 걸리게 둡니다. */
.ai-note{
  margin:15px 0 0;padding:13px 15px;border-radius:9px;
  background:var(--sm);border:1px solid var(--bd);
  font-size:12px;line-height:1.85;color:var(--tx2);letter-spacing:-.012em;
}
.ai-note b{color:var(--tx);font-weight:600}

/* 왜 이렇게 하는가 — 한 줄. 조용히 둡니다. */
.head-why{margin-top:13px;font-size:11.5px;line-height:1.8;color:var(--tx3);letter-spacing:-.01em}
.rd-ainote{
  margin-top:24px;padding-top:16px;border-top:1px solid var(--bd);
  font-size:11px;line-height:1.8;color:var(--tx3);letter-spacing:-.01em;
}

/* ── 씨앗 칩 ── */
.seed-row{display:flex;gap:7px;padding:20px 0 4px;flex-wrap:wrap}
.seed-chip{
  padding:6px 14px;border-radius:100px;border:1px solid var(--bd);
  background:transparent;font-size:12px;font-weight:500;color:var(--tx3);
  transition:all .13s;white-space:nowrap;
}
.seed-chip:hover{border-color:var(--bd2);color:var(--tx2)}
.seed-chip.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.seed-chip .cnt{font-size:10px;opacity:.7;margin-left:4px}

/* ── 목록 ── */
/* ── 씨앗 배너 ──
   씨앗 하나를 골랐을 때만 목록 위에 뜹니다.

   표지는 웹소설 표지와 같은 3:4 비율입니다.
   블러드하이스쿨 표지(150×200)와 같은 비율이라,
   나중에 씨앗 하나가 독립 프로젝트로 나가도
   그때 만든 표지를 그대로 쓸 수 있습니다. */
.seed-banner{
  display:flex;gap:15px;align-items:flex-start;
  margin:16px 0 2px;padding:14px 15px;border-radius:11px;
  background:var(--sm);border:1px solid var(--bd);
}
.seed-thumb{
  width:108px;height:144px;flex-shrink:0;          /* 3:4 */
  border-radius:7px;border:1px solid var(--bd);background:#fff;
  overflow:hidden;
}
.seed-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.seed-bn-body{flex:1;min-width:0;padding-top:2px}
.seed-bn-name{font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.025em;margin-bottom:7px;line-height:1.4}
.seed-bn-desc{font-size:12px;line-height:1.8;color:var(--tx2);letter-spacing:-.01em}
.seed-bn-desc a{color:var(--blue-ink);font-weight:600;text-decoration:none}
.seed-bn-desc a:hover{text-decoration:underline}
/* ── 씨앗 장르태그 ──
   배너 안내문 아래에 붙습니다. 시트 F열(장르태그)에서 읽어옵니다.
   태그가 없으면 이 줄은 아예 안 그려집니다.

   align-items:baseline —
     영문은 Inter, 한글은 Noto Sans KR 로 그려지는데 두 폰트의 기준선이 달라서
     그냥 두면 #SF 와 #현대판타지 의 줄이 어긋납니다. 글자 밑선을 맞춰 줍니다.
   font-weight:500 —
     Noto Sans KR 은 이 페이지에서 400·500·700 만 불러옵니다.
     600 으로 두면 한글만 700 으로 대체돼 영문보다 두꺼워집니다. */
.seed-bn-tags{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:8px}
.seed-tag{
  font-size:11.5px;font-weight:500;color:var(--blue-ink);
  letter-spacing:-.01em;white-space:nowrap;line-height:1.6;
}
.order-note{padding:14px 2px 8px;font-size:11px;color:var(--tx3);letter-spacing:-.01em}

/* ══════════════════════════════════════════════════
   표지 선반 — 씨앗을 안 고른 첫 화면

   글을 한 편씩 늘어놓는 대신 '세계'를 표지로 늘어놓습니다.
   한 줄에 5개. 최근에 업데이트된 세계가 앞에 옵니다.
   표지 비율은 3:4 로, 씨앗 배너 표지와 같습니다.
   ══════════════════════════════════════════════════ */
.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:18px 14px;padding-top:4px}
.shelf-item{
  display:block;width:100%;text-align:left;padding:0;
  background:none;border:none;
}
.shelf-cover{
  position:relative;
  aspect-ratio:3/4;border-radius:8px;overflow:hidden;
  background:var(--sm);border:1px solid var(--bd);
  transition:border-color .12s,box-shadow .12s,transform .12s;
}
/* 표지 왼쪽 위에 붙는 딱지. 가장 최근에 손댄 세계에만 붙습니다.
   Josefin Sans 는 이 페이지에서 100·300 만 불러와서
   작은 딱지에 쓰면 흐려집니다. 그래서 Inter 를 씁니다. */
.shelf-new{
  position:absolute;top:8px;left:8px;z-index:1;
  font-family:'Inter',sans-serif;font-size:8.5px;font-weight:600;
  letter-spacing:.12em;color:#fff;background:var(--blue);
  padding:3px 7px;border-radius:4px;line-height:1;
}
.shelf-item:hover .shelf-cover{border-color:var(--bd2);box-shadow:0 3px 14px #0000000f;transform:translateY(-2px)}
.shelf-cover img{width:100%;height:100%;object-fit:cover;display:block}
.shelf-name{font-size:13px;font-weight:700;color:var(--tx);letter-spacing:-.025em;line-height:1.45;margin-top:9px}
.shelf-meta{font-size:10.5px;color:var(--tx3);letter-spacing:-.01em;margin-top:3px;line-height:1.5}
/* 가장 최근에 손댄 세계 하나만 색을 줍니다. 다 칠하면 티가 안 납니다 */
.shelf-meta.fresh{color:var(--blue-ink);font-weight:500}
.shelf-tags{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:5px}
.shelf-tags span{font-size:10.5px;font-weight:500;color:var(--blue-ink);letter-spacing:-.01em;white-space:nowrap;line-height:1.6}

/* 씨앗을 안 적은 글은 선반에 설 자리가 없습니다.
   사라지면 안 되니 선반 아래에 따로 깔아 둡니다. */
.unsorted-head{padding:30px 2px 10px;font-size:11px;color:var(--tx3);letter-spacing:-.01em;border-top:1px solid var(--bd);margin-top:26px}

.list{padding-top:6px}
.card{
  width:100%;text-align:left;display:block;
  background:var(--sb);border:1px solid var(--bd);border-radius:11px;
  padding:16px 19px;margin-bottom:9px;
  transition:border-color .12s,box-shadow .12s,transform .12s;
}
.card:hover{border-color:var(--bd2);box-shadow:0 2px 12px #0000000d;transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.card-date{font-family:'Inter',sans-serif;font-size:11px;color:var(--tx3);letter-spacing:.02em;flex-shrink:0}
.card-seed{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;
  background:rgba(90,144,176,.10);border:1px solid rgba(90,144,176,.26);color:var(--blue-ink);
  white-space:nowrap;
}
.card-title{font-size:15.5px;font-weight:700;color:var(--tx);letter-spacing:-.025em;line-height:1.5;margin-bottom:6px}
.card-ex{font-size:12.5px;line-height:1.8;color:var(--tx3);letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 상태 안내 ── */
.state{padding:60px 10px;text-align:center;font-size:13px;line-height:1.9;color:var(--tx3)}
.state b{display:block;font-size:14px;color:var(--tx2);font-weight:600;margin-bottom:8px}
.state button{margin-top:16px;padding:8px 20px;border-radius:100px;border:1px solid var(--bd);background:transparent;font-size:12px;font-weight:600;color:var(--tx2);transition:all .12s}
.state button:hover{border-color:var(--bd2);color:var(--tx)}

/* ── 읽기 화면 ── */
#reader{display:none}
#reader.show{display:block}
.rd-bar{display:flex;align-items:center;gap:10px;padding:26px 0 0}
.rd-back{background:transparent;border:none;font-size:12px;color:var(--tx3);padding:5px 0;transition:color .12s}
.rd-back:hover{color:var(--tx)}
.rd-head{
  padding:22px 0 30px;border-bottom:1px solid var(--bd);
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
}
.rd-head-l{flex:1;min-width:0}
.rd-meta{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.rd-title{font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1.45;color:var(--tx)}
/* 글자 크기 기본값. JS 가 저장된 값으로 덮어씁니다.
   ⚠ 여기 숫자를 고쳐도 저장값이 있으면 그 값이 이깁니다.
     기본값을 바꾸려면 아래 STOCK_FS_STEPS 쪽을 고치세요. */
#reader{--rd-fs:16px;--rd-lh:2.05}
.rd-body{
  padding:36px 0 20px;
  font-size:var(--rd-fs);line-height:var(--rd-lh);color:#2a2a2a;letter-spacing:-.012em;
  white-space:pre-wrap;word-break:keep-all;
}
.rd-foot{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:26px 0 0;border-top:1px solid var(--bd)}
.rd-nav{
  min-width:0;padding:12px;border-radius:10px;border:1px solid var(--bd);
  background:transparent;font-size:12.5px;font-weight:600;color:var(--tx2);transition:all .12s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rd-nav:hover:not(:disabled){border-color:var(--blue);color:var(--blue-ink)}
.rd-nav:disabled{color:var(--bd2);cursor:default}
.rd-pick{
  justify-self:center;display:flex;align-items:center;gap:5px;
  padding:12px 16px;border-radius:10px;border:1px solid var(--bd2);
  background:var(--sm);font-size:11.5px;font-weight:600;color:var(--tx2);
  transition:all .12s;white-space:nowrap;
}
.rd-pick:hover{background:#fff;color:var(--tx)}
.rd-copy{
  margin-top:22px;display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:100px;border:1px solid var(--bd);
  background:transparent;font-size:11.5px;font-weight:500;color:var(--tx3);transition:all .12s;
}
.rd-copy:hover{border-color:var(--bd2);color:var(--tx2)}

/* ── 원문 보기 ──
   texts_raw/{id}.txt 가 올라가 있는 글에만 버튼이 나타납니다.

   자리를 제목 옆으로 올려 둔 이유:
     본문을 다 읽고 맨 아래까지 내려가야 보이는 자리에 있으면
     "읽기 전에 원문부터 볼까" 를 고를 수가 없습니다.
     AI 고지와 짝이 되는 버튼이라 글 시작 지점에 있는 게 맞습니다. */
#rd-raw-btn{
  display:none;align-items:center;gap:6px;flex-shrink:0;
  padding:7px 14px;border-radius:100px;border:1px solid var(--bd);
  background:transparent;font-size:11.5px;font-weight:500;color:var(--tx3);
  transition:all .12s;white-space:nowrap;margin-bottom:3px;
}
#rd-raw-btn.on{display:inline-flex}
#rd-raw-btn:hover{border-color:var(--bd2);color:var(--tx2)}
#rd-raw-btn.open{background:var(--sm);border-color:var(--bd2);color:var(--tx2)}
.rd-raw-wrap{display:none;margin-top:24px}
.rd-raw-wrap.open{display:block}
.rd-raw-label{
  font-size:11px;font-weight:600;color:var(--blue-ink);letter-spacing:-.01em;
  margin-bottom:10px;line-height:1.7;
}
.rd-raw-body{
  padding:18px 20px;border-radius:11px;
  background:var(--sm);border:1px solid var(--bd);
  font-size:calc(var(--rd-fs) - 2px);line-height:var(--rd-lh);color:var(--tx2);letter-spacing:-.012em;
  white-space:pre-wrap;word-break:keep-all;
}

/* ── PD · 기획 문의용 화면 (#/pd) ──
   일반 독자 화면에는 끼어들지 않습니다.
   대문 맨 아래 작은 링크 하나로만 들어갑니다.
   PD 에게는 주소를 직접 보내는 쪽을 씁니다 →  .../stock/#/pd */
#pdview{display:none}
#pdview.show{display:block}
.pd-head{padding:44px 0 24px;border-bottom:1px solid var(--bd)}
.pd-eyebrow{font-family:'Josefin Sans',sans-serif;font-size:10px;font-weight:300;letter-spacing:2.6px;color:var(--blue-ink);margin-bottom:11px}
.pd-title{font-size:23px;font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.pd-lead{font-size:13px;line-height:1.85;color:var(--tx2);letter-spacing:-.01em}
.pd-sec{padding:26px 0;border-bottom:1px solid var(--bd)}
.pd-sec:last-of-type{border-bottom:none}
.pd-h{font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--blue-ink);text-transform:uppercase;margin-bottom:14px}
.pd-row{display:flex;gap:14px;padding:7px 0;font-size:13px;line-height:1.8;letter-spacing:-.012em}
.pd-row dt{flex:0 0 128px;color:var(--tx3);font-weight:500}
.pd-row dd{flex:1;color:var(--tx);min-width:0}
.pd-p{font-size:13px;line-height:1.9;color:var(--tx2);letter-spacing:-.012em;margin-bottom:11px}
.pd-p:last-child{margin-bottom:0}
.pd-p b{color:var(--tx);font-weight:600}
.pd-mail{display:inline-block;margin-top:4px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--tx)}
@media(max-width:520px){
  .pd-head{padding:32px 0 20px}
  .pd-title{font-size:20px}
  .pd-row{flex-direction:column;gap:2px;padding:9px 0}
  .pd-row dt{flex:none;font-size:11.5px}
}

/* ══════════════════════════════════════════
   플로팅 네비 (읽기 화면 전용)  — 블러드하이스쿨에서 옮겨옴

   글을 읽는 중에 화면 오른쪽 아래에 떠 있는 작은 막대입니다.
   ‹ 이전  /  목록  /  다음 ›
   글에 들어온 직후에는 숨어 있다가,
   아래로 내렸다 다시 위로 올릴 때 나타납니다.
   ══════════════════════════════════════════ */
#float-nav{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  right:16px;
  z-index:200;
  display:none;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--bd);border-radius:30px;
  box-shadow:0 4px 16px #00000018;
  padding:6px 8px;
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
}
#float-nav.active{display:flex}
#float-nav.visible{opacity:1;transform:translateY(0);pointer-events:all}
.fn-btn{
  background:transparent;border:none;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--tx2);transition:background .12s,color .12s;flex-shrink:0;
}
.fn-btn:hover{background:var(--sm);color:var(--tx)}
.fn-btn.disabled{opacity:.3;pointer-events:none}
.fn-mid{font-size:11px;font-weight:600;color:var(--tx2);padding:0 6px;cursor:pointer;white-space:nowrap;transition:color .12s}
.fn-mid:hover{color:var(--tx)}
.fn-div{width:1px;height:18px;background:var(--bd);flex-shrink:0}
/* 목록 모달이 열려 있는 동안엔 플로팅 네비를 감춥니다 */
body.picker-open #float-nav{opacity:0;pointer-events:none}

/* ── 글 목록 모달 ── */
.pick-modal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:#00000050}
.pick-modal.hidden{display:none}
.pick-inner{background:#fff;border-radius:14px;box-shadow:0 8px 40px #0000002a;width:min(480px,90vw);max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
.pick-hd{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick-title{font-size:14px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-close{touch-action:manipulation;position:relative;background:transparent;border:none;color:var(--tx3);font-size:18px;padding:0 4px;line-height:1;transition:color .12s;flex-shrink:0}
.pick-close:hover{color:var(--tx)}
.pick-list{overflow-y:auto;flex:1}
.pick-item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s;text-align:left;width:100%;background:transparent;border-left:none;border-right:none;border-top:none}
.pick-item:last-child{border-bottom:none}
.pick-item:hover{background:var(--sm)}
.pick-item.current{background:rgba(90,144,176,.08);font-weight:600}
.pick-num{font-size:10px;color:var(--tx3);font-weight:500;min-width:30px;flex-shrink:0}
.pick-t{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-date{margin-left:auto;font-size:10px;color:var(--tx3);flex-shrink:0;padding-left:8px}

/* 손가락 터치 영역만 넓힙니다. 보이는 크기는 그대로입니다. */
@media(hover:none) and (pointer:coarse){
  .pick-close::after{content:'';position:absolute;top:-13px;right:-13px;bottom:-13px;left:-13px}
}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2b2b;color:#fff;font-size:12.5px;font-weight:500;padding:10px 18px;border-radius:20px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:.94}

@media(max-width:520px){
  .wrap{padding:0 16px 60px}
  .head{padding:32px 0 20px}
  .head-title{font-size:22px}
  .card{padding:14px 16px}
  .card-title{font-size:14.5px}
  .rd-title{font-size:19px}

  /* 좁은 화면에서는 제목 옆에 버튼을 두면 제목이 눌립니다.
     아래로 내려 왼쪽에 붙입니다. */
  .rd-head{flex-direction:column;align-items:flex-start;gap:14px}
  #rd-raw-btn{margin-bottom:0}

  /* 표지는 좁은 화면에서 한 단계 줄입니다. 비율(3:4)은 그대로입니다. */
  .seed-banner{gap:12px;padding:12px 13px}
  .seed-thumb{width:84px;height:112px}
  .seed-bn-name{font-size:14px}

  /* 선반 칸 수는 여기서 안 건드립니다.
     태블릿 폭까지는 5칸을 그대로 두고, 진짜 좁아지는 지점에서만 줄입니다.
     (아래 max-width:560px / 400px 블록) */
  .shelf-name{font-size:12.5px}

  /* ⚠ 예전에는 여기서 본문 크기를 15.5px 로 고정했습니다.
     지금은 글자 크기 조절이 붙어 있어서, 고정하면 조절이 먹지 않습니다.
     모바일 기본값은 JS 쪽 stFsDefault() 가 정합니다. */

  /* 읽는 중에는 좁은 상단바에서 FOR PD 를 접습니다.
     글자 크기 버튼 자리를 내주기 위해서입니다. */
  body.reading #tb-pd-btn{display:none}
  /* 플로팅 네비가 맨 아래 버튼을 가리지 않도록 */
  body.reading .wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .rd-nav{padding:12px 10px;font-size:11.5px}
  .rd-pick{padding:12px;font-size:10.5px}
}
/* ── 선반 칸 수 ──
   401px 위로는 어떤 폭에서도 5칸입니다. 창을 줄여도 안 바뀝니다.
   400px 이하에서만 4칸으로 내려갑니다. */
@media(max-width:400px){
  /* 아주 좁은 화면에서는 가운데 버튼을 "☰ 목록" 으로 줄입니다 */
  .rdp-long{display:none}
  .rd-foot{gap:6px}
  /* 4칸이면 한 칸이 아주 좁아지므로 간격과 글자도 같이 줄입니다.
     안 줄이면 표지보다 글자가 더 자리를 먹습니다. */
  .shelf{grid-template-columns:repeat(4,1fr);gap:14px 7px}
  .shelf-name{font-size:11px;line-height:1.35;margin-top:6px}
  .shelf-meta{font-size:9.5px;margin-top:2px}
  .shelf-tags{gap:5px;margin-top:3px}
  .shelf-tags span{font-size:9.5px}
  .shelf-new{top:5px;left:5px;font-size:7px;padding:2px 4px;letter-spacing:.08em}
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════
   AI 사용 표기 — 문구는 여기 한 곳에만 있습니다

   대문과 읽기 화면 아래에 같은 문장이 자동으로 들어갑니다.
   두 군데에 넣는 이유:
     글 하나를 링크로 공유하면 상대는 대문을 안 거치고 바로 들어옵니다.
     대문에만 적어두면 그 사람 눈에는 표기가 아예 안 보입니다.

   ⚠ 문구를 고칠 일이 생기면 여기만 고치세요.

   ⚠ 작업 방식이 달라지면 이 문장부터 고칩니다.
     지금 문장은 '무엇을 쓸지는 사람, 문장은 AI' 를 뜻합니다.
     AI 가 맡는 범위가 넓어지면 문장도 그만큼 넓혀 적습니다.
     여기 적힌 것과 실제가 어긋나지 않게 두는 것이 이 문장의 목적입니다.
   ══════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════
   대문 세 줄

   순서에 이유가 있습니다.
     ① 여기가 뭔지   — 독자가 제일 먼저 알아야 하는 것
     ② AI 고지       — 의무. 유일하게 상자로 둘러싼 부분
     ③ 왜 이렇게 하는지 — 궁금한 사람만 읽으면 되는 것

   ⚠ 같은 말을 두 줄에 겹쳐 쓰지 마세요.
     '초고입니다' 는 ①에만, 'AI 가 문장을 씁니다' 는 ②에만 있습니다.
     한쪽을 고칠 때 다른 쪽에 같은 말을 더하면 대문이 다시 지저분해집니다.

   ⚠ ②는 읽기 화면 맨 아래에도 그대로 들어갑니다.
     글 하나만 링크로 받아 들어온 사람은 대문을 안 거치기 때문입니다.
   ══════════════════════════════════════════════════ */

/* ① 여기가 뭔지 */
var WHAT_NOTE =
  '떠오른 소재를 짧은 소설로 적어 쌓아두는 창고입니다.';

/* ② AI 고지 — 실제 작업 비중이 달라지면 이 문장부터 고치세요 */
var AI_NOTE =
  '<b>소재와 전개는 제가 적고, 문장은 생성형 AI(Google Gemini)가 씁니다.</b><br>'
+ '각 글에는 AI 에 넣기 전 원문을 함께 둡니다.';

/* ③ 왜 이렇게 하는지 — 한 줄로 둡니다 */
var WHY_NOTE =
  '자기만족 창고...안 뱉어내면 죽을 것 같은.. 살아생전에 완성 못 할 것 같은..';

/* 원문 영역 위에 붙는 한 줄 */
var RAW_NOTE = 'AI 에 넣기 전, 제가 쓴 원문입니다.';


/* ══════════════════════════════════════════════════
   PD · 기획 문의용 안내  (#/pd)

   주소를 직접 보내면 이 화면만 열립니다 →  .../stock/#/pd

   ⚠ 여기에는 '변하지 않는 것'만 적습니다.
     편수 · 일정 · 진행 상황 같은 것을 적으면
     고치지 않으면 그대로 옛 정보가 됩니다.
     구조와 작업 방식만 적어두면 몇 년을 둬도 사실입니다.

   ⚠ 이 문서는 이 창고의 작업 방식만 다룹니다.
     다른 프로젝트의 작업 방식은 그 프로젝트 문서에서 적습니다.
     여기서 대신 적으면 그쪽을 고칠 때 이 문서만 옛말이 됩니다.

   ⚠ 나중에 따로 기획서를 만들게 되면 이 내용을 옮겨 적지 말고
     이 주소로 링크만 겁니다. 같은 말이 두 군데 있으면
     한쪽만 고쳤을 때 다른 쪽이 옛말로 남습니다.
   ══════════════════════════════════════════════════ */
var PD_MAIL = 'rrkt.biz@proton.me';

/* ══════════════════════════════════════════════════
   데이터

var ITEMS = null;      /* 시트에서 읽은 목록 */
var LOAD  = 'loading'; /* loading | ok | empty | error */
var SEED  = '';        /* 지금 고른 씨앗. '' 이면 전체 */

/* gviz 는 날짜를 "2026. 4. 9." 처럼 줍니다. 2026-04-09 로 맞춥니다. */
function normDate(v){
  v = (v||'').trim();
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  var m = v.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
  if(m) return m[1] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[3]).slice(-2);
  return v;
}

/* ══════════════════════════════════════════════════
   id 앞자리 0 되살리기

   구글시트는 001 을 '숫자 1' 로 봅니다.
   그래서 CSV 로 받으면 001 이 아니라 1 로 옵니다.
   그대로 두면 texts/1.txt 를 찾게 되어 본문이 안 열립니다.

   숫자로만 된 id 는 세 자리로 맞춥니다.  1 → 001,  42 → 042
   숫자가 아닌 id(예: a1)는 건드리지 않습니다.

   ※ 파일 이름은 세 자리로 지으세요.  texts/001.txt
     혹시 texts/1.txt 로 올렸더라도, 세 자리로 못 찾으면
     원래 값으로 한 번 더 찾아보므로 그것도 열립니다.
   ══════════════════════════════════════════════════ */
function padId(v){
  v = String(v == null ? '' : v).trim();
  return /^\d+$/.test(v) ? v.padStart(3, '0') : v;
}

/* 본문 파일 읽기.
   texts/001.txt 를 먼저 찾고, 없으면 texts/1.txt 도 한 번 봅니다.
   둘 다 없으면 null 을 돌려줍니다. */
async function fetchText(dir, x, timeout){
  var names = [x.id];
  if(x.rawId && x.rawId !== x.id) names.push(x.rawId);
  for(var i = 0; i < names.length; i++){
    try{
      var opt = {cache:'no-cache'};
      var timer = null;
      if(timeout){
        var ctrl = new AbortController();
        opt.signal = ctrl.signal;
        timer = setTimeout(function(){ ctrl.abort(); }, timeout);
      }
      var r = await fetch(dir + '/' + names[i] + '.txt', opt);
      if(timer) clearTimeout(timer);
      if(r.ok) return await r.text();
    }catch(e){ /* 다음 이름으로 넘어갑니다 */ }
  }
  return null;
}

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* CSV 한 줄을 칸으로 쪼갭니다. 따옴표 안의 쉼표는 그대로 둡니다. */
function splitRow(r){
  var cols=[], cur='', inQ=false;
  for(var i=0;i<r.length;i++){
    var ch = r[i];
    if(ch === '"'){
      if(inQ && r[i+1] === '"'){ cur += '"'; i++; }   /* "" 는 따옴표 한 개 */
      else inQ = !inQ;
    }
    else if(ch === ',' && !inQ){ cols.push(cur.trim()); cur=''; }
    else cur += ch;
  }
  cols.push(cur.trim());
  return cols;
}

async function loadList(){
  /* config.js 가 아직 안 붙었을 때 화면이 하얗게 멈추는 걸 막습니다 */
  await null;
  try{
    var url = (typeof SHEET_CSV === 'function') ? SHEET_CSV('stock') : null;
    if(!url) throw new Error('config.js 미로드');

    /* 10초 안에 응답이 없으면 포기합니다.
       없으면 구글이 응답을 물고 있을 때 '불러오는 중'이 영원히 남습니다. */
    var ctrl  = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 10000);
    var res   = await fetch(url, {signal: ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);

    var rows = (await res.text()).trim().split('\n').map(splitRow);
    if(rows.length < 2){ ITEMS = []; LOAD = 'empty'; render(); return; }

    /* 헤더: id / 제목 / 날짜 / 공개 / 씨앗 / 장르태그 */
    ITEMS = rows.slice(1)
      .filter(function(r){ return (r[0]||'').trim(); })
      .map(function(r){
        var raw = (r[0]||'').trim();
        return {
          id:    padId(raw),   /* 001 로 맞춘 값. 링크와 파일 이름에 씁니다 */
          rawId: raw,          /* 시트가 준 원래 값. 못 찾았을 때 한 번 더 시도합니다 */
          title: (r[1]||'').trim() || '무제',
          date:  normDate(r[2]),
          open:  (r[3]||'').trim().toUpperCase(),
          seed:  (r[4]||'').trim(),
          tags:  parseTags(r[5])
        };
      })
      /* 공개 칸이 O / o / Y / TRUE 인 것만 보여줍니다. 빈 칸은 안 보입니다. */
      .filter(function(x){ return x.open==='O' || x.open==='Y' || x.open==='TRUE' || x.open==='공개'; });

    LOAD = ITEMS.length ? 'ok' : 'empty';
    render();
    route();   /* 주소로 바로 들어온 경우를 여기서 처리합니다 */
  }catch(e){
    /* 화면에는 짧게, 자세한 원인은 콘솔(F12)에만 남깁니다.

       흔한 원인:
         · 구글시트 공유가 '링크가 있는 모든 사용자 → 뷰어' 가 아님
         · 시트 탭 이름이 stock 이 아님
         · 파일을 더블클릭(file://)해서 열었음 → 깃허브에 올려야 합니다 */
    console.warn('AI글창고 목록 불러오기 실패:', e && e.message);
    ITEMS = []; LOAD = 'error';
    render();
  }
}

/* ══════════════════════════════════════════════════
   씨앗 묶기

   씨앗 칸에 단어가 적혀 있으면 1편이어도 칩이 생깁니다.
   칩 순서는 편수가 많은 순, 같으면 가나다순이라
   한 편짜리 씨앗은 자연히 뒤쪽으로 밀립니다.
   ══════════════════════════════════════════════════ */
function seedCounts(){
  var m = {};
  (ITEMS||[]).forEach(function(x){
    if(!x.seed) return;
    m[x.seed] = (m[x.seed]||0) + 1;
  });
  return m;
}
function activeSeeds(){
  var m = seedCounts(), out = [];
  for(var k in m){ if(m[k] >= 1) out.push([k, m[k]]); }
  out.sort(function(a,b){ return b[1] - a[1] || a[0].localeCompare(b[0],'ko'); });
  return out;
}

/* ══════════════════════════════════════════════════
   장르태그

   시트 F열에 '#현대판타지 #SF #BL' 처럼 적습니다.
   쉼표로 나눠 적어도 되고, # 은 있어도 없어도 됩니다.
   ══════════════════════════════════════════════════ */
function parseTags(v){
  return String(v || '')
    .split(/[\s,·/|]+/)                     /* 띄어쓰기·쉼표·가운뎃점·슬래시 다 됩니다 */
    .map(function(t){ return t.replace(/^#+/, '').trim(); })
    .filter(function(t){ return t; });
}

/* 그 씨앗에 달린 태그 전부. 여러 줄에 나눠 적혀 있어도 합치고, 겹치면 한 번만 남깁니다. */
function seedTags(name){
  var seen = {}, out = [];
  (ITEMS||[]).forEach(function(x){
    if(x.seed !== name) return;
    (x.tags||[]).forEach(function(t){
      if(seen[t]) return;
      seen[t] = 1; out.push(t);
    });
  });
  return out;
}

/* ══════════════════════════════════════════════════
   업데이트 시점

   선반에 "3일 전 업데이트" 처럼 붙는 글자와, 선반 순서를 정하는 값입니다.
   기준은 그 씨앗에 속한 글 중 가장 최근 날짜입니다.

   ⚠ 날짜 칸이 비어 있는 글은 계산에서 빠집니다.
     한 씨앗의 글이 전부 날짜가 없으면 업데이트 글자가 안 나오고,
     선반에서도 날짜 있는 세계들 뒤로 갑니다.
     (없는 날짜를 오늘로 쳐서 맨 앞에 세우면 순서가 거짓말이 됩니다)
   ══════════════════════════════════════════════════ */

/* 그 씨앗에서 가장 최근 날짜. 없으면 '' */
function seedLatest(name){
  var best = '';
  (ITEMS||[]).forEach(function(x){
    if(x.seed !== name || !x.date) return;
    if(x.date > best) best = x.date;      /* YYYY-MM-DD 라 글자 비교로 충분합니다 */
  });
  return best;
}

/* 오늘로부터 며칠 전인지. 날짜가 아니면 null */
function daysSince(ymd){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd || '')) return null;
  var p = ymd.split('-');
  var then = new Date(+p[0], +p[1] - 1, +p[2]);
  var n = new Date();
  var today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((today - then) / 86400000);
}

/* 선반에 붙는 글자 */
function updText(ymd){
  var d = daysSince(ymd);
  if(d === null) return '';
  if(d <= 0)   return '오늘 업데이트';            /* 시트 날짜가 내일이어도 오늘로 봅니다 */
  if(d === 1)  return '어제 업데이트';
  if(d < 30)   return d + '일 전 업데이트';
  if(d < 365)  return Math.floor(d / 30) + '개월 전 업데이트';
  return Math.floor(d / 365) + '년 전 업데이트';
}

/* 선반에 세울 세계들. 최근에 업데이트된 순.
   날짜가 같거나 둘 다 없으면 편수 많은 순, 그다음 가나다순입니다. */
function shelfSeeds(){
  var m = seedCounts(), out = [];
  for(var k in m) out.push({ name:k, count:m[k], last:seedLatest(k) });
  out.sort(function(a, b){
    if(a.last !== b.last){
      if(!a.last) return 1;               /* 날짜 없는 세계는 뒤로 */
      if(!b.last) return -1;
      return b.last.localeCompare(a.last);
    }
    return b.count - a.count || a.name.localeCompare(b.name, 'ko');
  });
  return out;
}

/* 씨앗 칸이 빈 글. 선반에는 설 자리가 없어서 아래에 따로 깝니다. */
function unsortedItems(){
  return (ITEMS||[]).filter(function(x){ return !x.seed; })
    .sort(function(a, b){
      var d = String(a.date).localeCompare(String(b.date));
      return d !== 0 ? -d : b.id.localeCompare(a.id);
    });
}

/* 지금 화면에 보일 글들.
   전체는 최신순, 씨앗을 고른 상태는 오래된순입니다.
   같은 세계의 조각은 먼저 쓴 게 바탕이고 나중 게 덧붙는 경우가 많아서입니다. */
function visible(){
  var arr = (ITEMS||[]).slice();
  if(SEED) arr = arr.filter(function(x){ return x.seed === SEED; });
  arr.sort(function(a,b){
    var d = String(a.date).localeCompare(String(b.date));
    if(d !== 0) return SEED ? d : -d;
    return SEED ? a.id.localeCompare(b.id) : b.id.localeCompare(a.id);
  });
  return arr;
}

/* ══════════════════════════════════════════════════
   그리기
   ══════════════════════════════════════════════════ */
function render(){
  var row = document.getElementById('seed-row');
  var seeds = activeSeeds();
  if(LOAD !== 'ok' || !seeds.length){
    row.innerHTML = '';
  }else{
    row.innerHTML =
      '<button class="seed-chip' + (SEED===''?' active':'') + '" onclick="pickSeed(\'\')">세계'
      + '<span class="cnt">' + seeds.length + '</span></button>'
      + seeds.map(function(s){
          return '<button class="seed-chip' + (SEED===s[0]?' active':'') + '" '
               + 'onclick="pickSeed(\'' + esc(s[0]).replace(/'/g,"\\'") + '\')">'
               + esc(s[0]) + '<span class="cnt">' + s[1] + '</span></button>';
        }).join('');
  }

  /* 씨앗을 골랐을 때만 나오는 안내 */
  var note = document.getElementById('seed-banner-slot');
  var ord  = document.getElementById('order-note');
  if(SEED){
    var p   = SEED_PROMOTED[SEED];
    var th  = SEED_THUMB[SEED];
    var cnt = seedCounts()[SEED] || 0;
    var tg  = seedTags(SEED);
    note.innerHTML =
      '<div class="seed-banner">'
      + '<div class="seed-thumb">'
      +   (th ? '<img src="' + esc(th) + '" alt="" onerror="this.style.display=\'none\'">' : '')
      + '</div>'
      + '<div class="seed-bn-body">'
      +   '<div class="seed-bn-name">' + esc(SEED) + '</div>'
      +   '<div class="seed-bn-desc">'
      +   (cnt <= 1 ? '아직 한 편뿐인 세계입니다.'
                    : '같은 세계의 조각들입니다. 지금까지 ' + cnt + '편.')
      +   (p ? '<br>이 세계는 <a href="' + esc(p.url) + '">' + esc(p.label) + '</a> 로 이어졌습니다.' : '')
      +   '</div>'
      +   (tg.length
            ? '<div class="seed-bn-tags">'
              + tg.map(function(t){ return '<span class="seed-tag">#' + esc(t) + '</span>'; }).join('')
              + '</div>'
            : '')
      + '</div></div>';
    ord.textContent = '먼저 쓴 순서로 놓여 있습니다.';
  }else{
    note.innerHTML = '';
    ord.textContent = (LOAD==='ok') ? '최근에 손댄 세계부터 놓여 있습니다.' : '';
  }

  var list = document.getElementById('list');

  if(LOAD === 'loading'){
    list.innerHTML = '<div class="state">불러오는 중…</div>';
    return;
  }
  if(LOAD === 'error'){
    list.innerHTML = '<div class="state"><b>목록을 불러오지 못했습니다</b>'
      + '잠시 뒤에 다시 시도해 주세요.'
      + '<br><button onclick="retry()">다시 불러오기</button></div>';
    return;
  }
  if(LOAD === 'empty'){
    list.innerHTML = '<div class="state"><b>아직 쌓인 글이 없습니다</b>곧 채워집니다.</div>';
    return;
  }

  /* 씨앗을 안 고른 첫 화면은 글 목록이 아니라 표지 선반입니다 */
  if(!SEED){ renderShelf(list); return; }

  var arr = visible();
  list.innerHTML = arr.map(function(x){
    return '<button class="card" onclick="openItem(\'' + esc(x.id) + '\')">'
      + '<div class="card-top">'
        + (x.date ? '<span class="card-date">' + esc(x.date) + '</span>' : '')
        + (x.seed && !SEED ? '<span class="card-seed">' + esc(x.seed) + '</span>' : '')
      + '</div>'
      + '<div class="card-title">' + esc(x.title) + '</div>'
      + '<div class="card-ex" id="ex-' + esc(x.id) + '"></div>'
    + '</button>';
  }).join('');

  /* 발췌는 본문 파일에서 앞부분만 떼어 옵니다.
     목록에 소개 칸을 따로 두지 않는 이유가 이것입니다 — 시트에 적을 게 하나 줄어듭니다.
     한 번 읽은 건 기억해 두므로 목록을 오갈 때 다시 받지 않습니다. */
  arr.forEach(function(x){ fillExcerpt(x); });
}

/* ══════════════════════════════════════════════════
   표지 선반 그리기
   ══════════════════════════════════════════════════ */
function renderShelf(list){
  var seeds = shelfSeeds();
  var loose = unsortedItems();

  if(!seeds.length && !loose.length){
    list.innerHTML = '<div class="state"><b>아직 쌓인 글이 없습니다</b>곧 채워집니다.</div>';
    return;
  }

  /* 맨 앞 하나에만 색을 줍니다. 단, 날짜가 있을 때만 */
  var freshest = seeds.length && seeds[0].last ? seeds[0].last : null;

  var html = '<div class="shelf">' + seeds.map(function(s){
    var th = SEED_THUMB[s.name];
    var tg = seedTags(s.name);
    var up = updText(s.last);
    var isNew = !!(up && s.last === freshest);
    return '<button class="shelf-item" onclick="pickSeed(\'' + esc(s.name).replace(/'/g,"\\'") + '\')">'
      + '<div class="shelf-cover">'
      +   (isNew ? '<span class="shelf-new">UPDATE</span>' : '')
      +   (th ? '<img src="' + esc(th) + '" alt="" onerror="this.style.display=\'none\'">' : '')
      + '</div>'
      + '<div class="shelf-name">' + esc(s.name) + '</div>'
      + '<div class="shelf-meta' + (isNew ? ' fresh' : '') + '">'
      +   s.count + '편' + (up ? ' · ' + up : '')
      + '</div>'
      + (tg.length
          ? '<div class="shelf-tags">'
            + tg.slice(0, 3).map(function(t){ return '<span>#' + esc(t) + '</span>'; }).join('')
            + '</div>'
          : '')
    + '</button>';
  }).join('') + '</div>';

  /* 씨앗을 안 적은 글 — 선반에 안 보이니 아래에 그대로 깝니다 */
  if(loose.length){
    html += '<div class="unsorted-head">아직 씨앗을 안 적은 글 ' + loose.length + '편</div>'
      + loose.map(function(x){
          return '<button class="card" onclick="openItem(\'' + esc(x.id) + '\')">'
            + '<div class="card-top">'
            +   (x.date ? '<span class="card-date">' + esc(x.date) + '</span>' : '')
            + '</div>'
            + '<div class="card-title">' + esc(x.title) + '</div>'
            + '<div class="card-ex" id="ex-' + esc(x.id) + '"></div>'
          + '</button>';
        }).join('');
  }

  list.innerHTML = html;
  loose.forEach(function(x){ fillExcerpt(x); });
}

async function fillExcerpt(x){
  var el = document.getElementById('ex-' + x.id);
  if(!el) return;
  var t = BODY_CACHE[x.id];
  if(t === undefined){
    t = await fetchText('texts', x);
    BODY_CACHE[x.id] = t;
    el = document.getElementById('ex-' + x.id);   /* 기다리는 동안 화면이 바뀌었을 수 있음 */
    if(!el) return;
  }
  el.textContent = t ? t.replace(/\s+/g,' ').trim().slice(0,120) : '';
}

/* ══════════════════════════════════════════════════
   읽기
   ══════════════════════════════════════════════════ */
async function openItem(id){
  var x = (ITEMS||[]).filter(function(v){ return v.id === id; })[0];
  if(!x) return;
  CUR = x;

  showView('reader');
  resetChrome();   /* 접혀 있던 상단바 원복. 본문을 기다리기 전에 해둡니다 */

  document.getElementById('rd-title').textContent = x.title;
  document.getElementById('rd-meta').innerHTML =
    (x.date ? '<span class="card-date">' + esc(x.date) + '</span>' : '')
    + (x.seed ? '<span class="card-seed">' + esc(x.seed) + '</span>' : '');

  var body = document.getElementById('rd-body');
  body.textContent = '불러오는 중…';

  var t = BODY_CACHE[id];
  if(t === undefined){
    t = await fetchText('texts', x, 10000);
    BODY_CACHE[id] = t;
  }
  if(CUR !== x) return;   /* 읽는 동안 다른 글로 넘어갔으면 덮어쓰지 않습니다 */

  /* 본문 파일이 없을 때.
     시트에는 적었는데 texts/ 에 올리는 걸 잊은 경우가 대부분입니다. */
  body.textContent = t != null ? t
    : '본문을 찾지 못했습니다.\n(texts/' + id + '.txt 가 올라가 있는지 확인해 주세요)';

  var arr = visible();
  var i = arr.findIndex(function(v){ return v.id === id; });
  var pv = document.getElementById('rd-prev');
  var nx = document.getElementById('rd-next');
  pv.disabled = (i <= 0);
  nx.disabled = (i < 0 || i >= arr.length - 1);
  pv.textContent = pv.disabled ? '이전 글 없음' : '‹ ' + arr[i-1].title;
  nx.textContent = nx.disabled ? '다음 글 없음' : arr[i+1].title + ' ›';

  location.hash = '#/f/' + id;

  /* ── 읽기 보조 기능 켜기 ── */
  setupFloatNav(arr[i-1] || null, arr[i+1] || null);
  attachReaderScroll();
  stFsApply();

  loadRaw(x);
}

/* ══════════════════════════════════════════════════
   원문 보기

   texts_raw/{id}.txt 를 찾아봅니다.
   있으면 버튼이 나타나고, 없으면 버튼 자체가 안 생깁니다.

   원문은 파일을 올리는 것으로 공개됩니다.
   이 파일도 시트도 손댈 필요가 없습니다.
   아직 정리가 안 된 원고는 로컬 _draft/ 에 두었다가
   준비되면 texts_raw/ 로 옮깁니다.
   ══════════════════════════════════════════════════ */
async function loadRaw(x){
  var btn = document.getElementById('rd-raw-btn');
  var wrap = document.getElementById('rd-raw-wrap');
  btn.classList.remove('on');
  btn.classList.remove('open');
  wrap.classList.remove('open');
  btn.textContent = '원문 보기';

  var t = RAW_CACHE[x.id];
  if(t === undefined){
    t = await fetchText('texts_raw', x);
    RAW_CACHE[x.id] = t;
  }
  if(CUR !== x) return;          /* 그새 다른 글로 넘어갔으면 무시 */
  if(t == null || !t.trim()) return;   /* 원문 파일 없음 → 버튼 안 보임 */

  document.getElementById('rd-raw-label').textContent = RAW_NOTE;
  document.getElementById('rd-raw-body').textContent  = t;
  btn.classList.add('on');
}

function toggleRaw(){
  var wrap = document.getElementById('rd-raw-wrap');
  var btn  = document.getElementById('rd-raw-btn');
  var open = wrap.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '원문 닫기' : '원문 보기';
}

function goSib(step){
  if(!CUR) return;
  var arr = visible();
  var i = arr.findIndex(function(v){ return v.id === CUR.id; });
  var t = arr[i + step];
  if(t) openItem(t.id);
}

/* ══════════════════════════════════════════════════
   ▼▼▼ 읽기 보조 기능 — 블러드하이스쿨에서 옮겨온 묶음 ▼▼▼

   네 가지입니다.
     ① 상단바 자동 숨김 (모바일)
     ② 플로팅 네비 (‹ 이전 / 목록 / 다음 ›)
     ③ 글 목록 모달
     ④ 본문 글자 크기

   번역 기능은 옮기지 않았습니다. 이 창고에는 번역판 원고가 없습니다.

   ⚠ 넷 다 '읽기 화면에서만' 도는 것들입니다.
     목록·PD 화면으로 나갈 때 showView() 가 전부 꺼줍니다.
     새 화면을 추가하게 되면 그쪽도 showView() 를 거치게 하세요.
   ══════════════════════════════════════════════════ */

/* ── ① 상단바 자동 숨김 ──────────────────────────────
   내리는 중이면 접고, 올리는 중이면 폅니다.
   데스크탑(769px 이상)에서는 아무 일도 하지 않습니다.
   마우스로 읽을 때는 상단바가 사라지는 게 오히려 불편해서입니다. */
var ST_SC = { hidden:false, lastY:0, ticking:false, attached:false };

function syncTopbarH(){
  var tb = document.getElementById('topbar');
  var h = tb ? (tb.offsetHeight || 46) : 46;
  document.documentElement.style.setProperty('--st-tbh', h + 'px');
  return h;
}

function isReading(){ return !!CUR && document.getElementById('reader').classList.contains('show'); }

function applyHide(doHide){
  if(ST_SC.hidden === doHide) return;
  ST_SC.hidden = doHide;
  var tb = document.getElementById('topbar');
  var fn = document.getElementById('float-nav');
  if(doHide){
    if(tb) tb.style.transform = 'translateY(-' + (tb.offsetHeight || 46) + 'px)';
    if(fn) fn.classList.remove('visible');
    stFsClose();                    /* 상단바가 접히면 크기 패널도 닫습니다 */
  }else{
    if(tb) tb.style.transform = '';
    if(fn && fn.classList.contains('active')) fn.classList.add('visible');
  }
}

/* 화면을 옮기거나 다른 글로 넘어갈 때 강제로 원복 */
function resetChrome(){
  ST_SC.hidden = false;
  ST_SC.lastY  = 0;
  var tb = document.getElementById('topbar');
  if(tb) tb.style.transform = '';
}

function onReaderScroll(){
  ST_SC.ticking = false;
  if(!isReading() || window.innerWidth > 768){ applyHide(false); return; }
  var st = window.pageYOffset || document.documentElement.scrollTop || 0;
  if(st > ST_SC.lastY && st > 60)   applyHide(true);    /* 내리는 중 → 접기 */
  else if(st < ST_SC.lastY - 10)    applyHide(false);   /* 올리는 중 → 펴기 */
  ST_SC.lastY = st <= 0 ? 0 : st;
}

/* 스크롤 감시는 한 번만 답니다. 글을 몇 번 열어도 중복으로 안 붙습니다. */
function attachReaderScroll(){
  syncTopbarH();
  if(ST_SC.attached) return;
  window.addEventListener('scroll', function(){
    if(!ST_SC.ticking){ requestAnimationFrame(onReaderScroll); ST_SC.ticking = true; }
  }, {passive:true});
  window.addEventListener('resize', function(){
    syncTopbarH();
    if(window.innerWidth > 768) applyHide(false);
  });
  /* 모바일 주소창이 접혔다 펴질 때 높이가 달라집니다 */
  window.addEventListener('orientationchange', function(){ setTimeout(syncTopbarH, 200); });
  ST_SC.attached = true;
}

/* ── ② 플로팅 네비 ──────────────────────────────────
   글에 막 들어왔을 때는 숨어 있습니다.
   맨 위에서는 화면 아래 버튼이 이미 보이거나 곧 보이므로 겹칠 뿐입니다.
   내렸다가 다시 올릴 때 나타납니다. */
function setupFloatNav(prev, next){
  var fn = document.getElementById('float-nav');
  if(!fn) return;
  var pb = document.getElementById('fn-prev');
  var nb = document.getElementById('fn-next');
  if(pb) pb.classList.toggle('disabled', !prev);
  if(nb) nb.classList.toggle('disabled', !next);
  fn.classList.add('active');
  fn.classList.remove('visible');
}

function hideFloatNav(){
  var fn = document.getElementById('float-nav');
  if(!fn) return;
  fn.classList.remove('visible');
  fn.classList.remove('active');
  document.body.classList.remove('picker-open');
}

function floatNav(dir){
  if(dir === 'list'){ openPicker(); return; }
  goSib(dir === 'prev' ? -1 : 1);
}

/* ── ③ 글 목록 모달 ─────────────────────────────────
   지금 보고 있는 목록(visible())을 그대로 씁니다.
   씨앗을 골라 둔 상태면 그 씨앗의 글만, 정렬도 목록 화면과 같습니다.
   "읽는 중에 보는 목록"과 "나가서 보는 목록"이 어긋나지 않게 하려는 것입니다. */
function openPicker(){
  var arr = visible();
  document.getElementById('pick-title').textContent =
    SEED ? (SEED + ' — 글 목록') : '글 목록';
  document.getElementById('pick-list').innerHTML = arr.map(function(x){
    return '<button class="pick-item' + (CUR && x.id===CUR.id ? ' current' : '') + '" '
         + 'onclick="pickItem(\'' + esc(x.id) + '\')">'
         + '<span class="pick-num">' + esc(x.id) + '</span>'
         + '<span class="pick-t">' + esc(x.title) + '</span>'
         + (x.date ? '<span class="pick-date">' + esc(x.date) + '</span>' : '')
         + '</button>';
  }).join('') || '<div class="state">목록이 비어 있습니다</div>';
  document.getElementById('pick-modal').classList.remove('hidden');
  document.body.classList.add('picker-open');

  /* 글이 쌓이면 목록이 길어집니다. 지금 읽는 글이 보이는 자리로 옮겨 둡니다. */
  var cur = document.querySelector('#pick-list .pick-item.current');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'center'});
}
function pickItem(id){ closePicker(); openItem(id); }
function closePicker(){
  var m = document.getElementById('pick-modal');
  if(m) m.classList.add('hidden');
  document.body.classList.remove('picker-open');
}
/* 바깥 어두운 곳을 눌렀을 때만 닫습니다 */
function closePickerBg(ev){ if(ev.target === document.getElementById('pick-modal')) closePicker(); }

/* ── ④ 본문 글자 크기 ───────────────────────────────
   크게 키울수록 줄간격을 조금씩 좁힙니다.
   그대로 두면 글자가 클 때 줄 사이가 벌어져 문단이 흩어져 보입니다.

   ⚠ 저장 이름이 블러드하이스쿨(bhs_reader_fs)과 다릅니다.
     일부러 나눠 두었습니다. 여기는 조각글이라 한 편이 짧고,
     저쪽은 웹소설이라 한 화가 깁니다. 편한 크기가 서로 다릅니다.
     (클릭 소리는 반대로 공용입니다 — 한 곳에서 끄면 다 꺼집니다) */
var STOCK_FS_STEPS = [
  { fs:14,   lh:2.10 },
  { fs:15.5, lh:2.05 },   /* 모바일 기본 */
  { fs:16.5, lh:2.00 },   /* 데스크탑 기본 */
  { fs:18,   lh:1.95 },
  { fs:20,   lh:1.90 },
  { fs:22.5, lh:1.85 }
];
var STOCK_FS_KEY = 'stock_reader_fs';
var STOCK_FS_I   = null;

function stFsDefault(){ return window.innerWidth <= 768 ? 1 : 2; }

function stFsIdx(){
  if(STOCK_FS_I !== null) return STOCK_FS_I;
  var v = null;
  try{ v = localStorage.getItem(STOCK_FS_KEY); }catch(e){}
  var i = (v === null) ? stFsDefault() : parseInt(v,10);
  if(isNaN(i) || i < 0 || i >= STOCK_FS_STEPS.length){
    i = stFsDefault();
    try{ localStorage.removeItem(STOCK_FS_KEY); }catch(e){}   /* 망가진 저장값 정리 */
  }
  STOCK_FS_I = i;
  return i;
}

function stFsApply(){
  var s = STOCK_FS_STEPS[stFsIdx()];
  var r = document.getElementById('reader');
  if(r){
    r.style.setProperty('--rd-fs', s.fs + 'px');
    r.style.setProperty('--rd-lh', String(s.lh));
  }
  stFsSyncUI();
}

function stFsSyncUI(){
  var i = stFsIdx(), s = STOCK_FS_STEPS[i];
  var n = document.getElementById('rd-fs-num');   if(n) n.textContent = s.fs;
  var f = document.getElementById('rd-fs-fill');  if(f) f.style.width = (i/(STOCK_FS_STEPS.length-1)*100) + '%';
  var m = document.getElementById('rd-fs-minus'); if(m) m.disabled = (i === 0);
  var p = document.getElementById('rd-fs-plus');  if(p) p.disabled = (i === STOCK_FS_STEPS.length - 1);
}

function stFsStep(d){
  var i = stFsIdx() + d;
  if(i < 0 || i >= STOCK_FS_STEPS.length) return;
  STOCK_FS_I = i;
  try{ localStorage.setItem(STOCK_FS_KEY, String(i)); }catch(e){}
  stFsApply();
}

function stFsReset(){
  STOCK_FS_I = stFsDefault();
  try{ localStorage.removeItem(STOCK_FS_KEY); }catch(e){}
  stFsApply();
}

function stFsToggle(ev){
  if(ev) ev.stopPropagation();
  var p = document.getElementById('rd-fs-panel');
  var t = document.getElementById('rd-fs-toggle');
  if(!p) return;
  var willOpen = p.classList.contains('hidden');
  p.classList.toggle('hidden', !willOpen);
  if(t) t.classList.toggle('on', willOpen);
  if(willOpen) stFsSyncUI();
}

function stFsClose(){
  var p = document.getElementById('rd-fs-panel'); if(p) p.classList.add('hidden');
  var t = document.getElementById('rd-fs-toggle'); if(t) t.classList.remove('on');
}

/* 패널 바깥을 누르면 닫힙니다 */
document.addEventListener('click', function(e){
  var w = document.getElementById('tb-fs-wrap');
  if(w && !w.contains(e.target)) stFsClose();
});
/* ESC 로 크기 패널과 목록 모달을 닫습니다 */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  stFsClose();
  closePicker();
});

/* ▲▲▲ 읽기 보조 기능 묶음 끝 ▲▲▲ */


/* ══════════════════════════════════════════════════
   화면 전환 — 목록 / 읽기 / PD 안내 세 개뿐입니다
   ══════════════════════════════════════════════════ */
function showView(v){
  document.getElementById('listview').style.display = (v === 'list') ? '' : 'none';
  document.getElementById('reader').classList.toggle('show', v === 'reader');
  document.getElementById('pdview').classList.toggle('show', v === 'pd');

  /* 읽기 화면일 때만 켜지는 것들:
       body.reading → 상단바 글자 크기 버튼
       플로팅 네비 · 상단바 자동 숨김 */
  var reading = (v === 'reader');
  document.body.classList.toggle('reading', reading);
  if(!reading){
    hideFloatNav();
    resetChrome();
    closePicker();
    stFsClose();
  }
  window.scrollTo(0,0);
}

function openPD(){
  CUR = null;
  document.getElementById('pd-slot').innerHTML = PD_DOC;
  showView('pd');
  if(location.hash !== '#/pd') location.hash = '#/pd';
}

function goList(){
  CUR = null;
  showView('list');
  var want = SEED ? '#/s/' + encodeURIComponent(SEED) : '#/';
  if(location.hash !== want) location.hash = want;
}

function pickSeed(s){
  SEED = s;
  render();
  var want = s ? '#/s/' + encodeURIComponent(s) : '#/';
  if(location.hash !== want) location.hash = want;
}

function retry(){ LOAD = 'loading'; render(); loadList(); }

/* ── 주소 한 곳에서 화면을 정합니다 ──
   #/          목록
   #/s/씨앗    씨앗으로 거른 목록
   #/f/001     글 읽기
   #/pd        기획 문의 안내 (PD 에게 이 주소를 보냅니다) */
function route(){
  var h = location.hash || '';

  var f = h.match(/^#\/f\/(.+)$/);
  if(f){
    /* #/f/1 로 들어와도 001 로 찾아갑니다.
       예전에 복사해 둔 링크나 손으로 친 주소를 살리기 위해서입니다. */
    var id = padId(decodeURIComponent(f[1]));
    if(!CUR || CUR.id !== id) openItem(id);
    return;
  }
  if(/^#\/pd$/.test(h)){ openPD(); return; }

  var s = h.match(/^#\/s\/(.+)$/);
  SEED = s ? decodeURIComponent(s[1]) : '';
  CUR = null;
  showView('list');
  render();
}
window.addEventListener('hashchange', route);

/* ── 링크 복사 ── */
var _tT = null;
function toast(msg){
  var el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_tT);
  _tT = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}
function copyLink(){
  var u = location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(function(){ toast('링크를 복사했습니다'); },
                                          function(){ toast(u); });
  }else toast(u);
}

/* ══════════════════════════════════════════════════
   클릭 소리

   허브 · biz-OC-doll · 블러드하이스쿨과 같은 저장 이름을 씁니다.
   한 곳에서 끄면 여기서도 함께 꺼집니다.
   소리를 바꾸려면 네 곳을 모두 같은 값으로 고쳐야 합니다.
   ══════════════════════════════════════════════════ */
(function(){
  var KEY = 'rrkt_sound', KEY_VOL = 'rrkt_sound_vol';
  var on = true, vol = 100, ctx = null;
  try{ if(localStorage.getItem(KEY) === '0') on = false; }catch(e){}
  try{ var sv = parseInt(localStorage.getItem(KEY_VOL),10); if(!isNaN(sv)) vol = Math.max(0,Math.min(100,sv)); }catch(e){}

  var _S = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
  var ICON_ON  = _S + '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>';
  var ICON_LOW = _S + '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>';
  var ICON_OFF = _S + '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';

  function paint(){
    var mute = (!on || vol === 0);
    var b = document.getElementById('tb-sound-btn');
    if(!b) return;
    b.innerHTML = mute ? ICON_OFF : (vol <= 40 ? ICON_LOW : ICON_ON);
    b.classList.toggle('is-off', mute);
    b.title = mute ? '클릭 소리 켜기' : '클릭 소리 끄기';
  }
  window.soundToggle = function(){
    on = !on;
    if(on && vol === 0) vol = 100;
    try{ localStorage.setItem(KEY, on?'1':'0'); localStorage.setItem(KEY_VOL, String(vol)); }catch(e){}
    paint();
  };
  document.addEventListener('click', function(){
    if(!on || vol <= 0) return;
    try{
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
      var k = vol/100;
      function tone(f,st,du,v){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type='sine';
        o.frequency.setValueAtTime(f, ctx.currentTime+st);
        g.gain.setValueAtTime(Math.max(v,0.0005), ctx.currentTime+st);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+st+du);
        o.start(ctx.currentTime+st); o.stop(ctx.currentTime+st+du+0.01);
      }
      tone(1200, 0, 0.05, 0.12*k);
      tone(900, 0.045, 0.06, 0.09*k);
    }catch(e){}
  });
  paint();
})();

/* ⚠ route() 를 loadList() 보다 먼저 부릅니다.
   PD 안내(#/pd)는 구글시트와 아무 상관이 없는 화면입니다.
   시트를 다 읽은 뒤에 화면을 정하면
   시트가 느릴 때 늦게 열리고, 시트가 안 열리면 아예 안 열립니다.
   PD 에게 보내는 주소가 시트 상태에 발목 잡히면 안 됩니다.

   글 읽기(#/f/001)는 목록이 있어야 하므로
   loadList() 가 끝난 뒤 route() 를 한 번 더 부릅니다. */
route();
loadList();
